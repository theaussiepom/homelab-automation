change_hvac_option:
  alias: Change HVAC Option
  sequence:
  - service: input_select.select_next
    target:
      entity_id: input_select.climate_ac_options
    data:
      cycle: true
  - service: climate.set_hvac_mode
    data_template:
      entity_id: climate.ac_0
      hvac_mode: '{{ states("input_select.climate_ac_options") }}'
  mode: queued
  icon: mdi:hvac
refresh_home_assistant:
  alias: Refresh Home Assistant
  sequence:
  - target:
      entity_id:
      - cover.blind_deck_long
    data: {}
    action: homeassistant.reload_config_entry
  - action: script.display_living_refresh
  description: ''
  icon: mdi:restart
scene_living_dining:
  alias: Living + Landing Dining
