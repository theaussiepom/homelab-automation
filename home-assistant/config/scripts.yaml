# Stable controls for the Living tablet.
display_living_wake:
  alias: Living Display - Wake
  description: Turn on the verified Living tablet screen through Fully Kiosk without changing brightness or the current page.
  icon: mdi:tablet
  mode: restart
  sequence:
  - action: switch.turn_on
    target:
      entity_id: switch.tablet_living_kiosk_screen
display_living_sleep:
  alias: Living Display - Sleep
  description: Turn off the Living tablet screen through Fully Kiosk without changing brightness or the current page.
  icon: mdi:tablet
  mode: restart
  sequence:
  - action: switch.turn_off
    target:
      entity_id: switch.tablet_living_kiosk_screen
display_living_brightness:
  alias: Living Display - Brightness
  description: Set Living tablet brightness on Fully Kiosk's native 0-255 scale without changing screen power.
  icon: mdi:brightness-6
  mode: restart
  fields:
    brightness:
      name: Brightness
      required: true
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: slider
  sequence:
  - action: number.set_value
    target:
      entity_id: number.tablet_living_kiosk_screen_brightness
    data:
      value: '{{ brightness }}'
display_living_refresh:
  alias: Living Display - Refresh
  description: Restart the Living tablet Fully Kiosk browser using its existing restart-browser action. Does not reboot the tablet.
  icon: mdi:refresh
  mode: parallel
  sequence:
  - action: button.press
    target:
      entity_id: button.tablet_living_kiosk_restart_browser

# Add this entry to scripts.yaml. This public script configuration deliberately contains no secret.
house_alarm_disarm_trusted:
  alias: House Alarm - trusted account disarm
  description: Disarm from Ben or Erin's authenticated Home Assistant account. Tablet and other accounts require the PIN.
  icon: mdi:shield-off-outline
  mode: single
  trace:
    stored_traces: 0
  sequence:
    - if:
        - condition: template
          value_template: >-
            {{ context.user_id not in ['a9a9e2d41e7b44fab972c064d89f67ce', 'e68930c0a3314c1b804ac859b1e6a8ec'] }}
      then:
        - stop: Disarm requires Ben or Erin's Home Assistant account.
          error: true
    - event: house_alarm_trusted_disarm_requested
