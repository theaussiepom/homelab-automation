###########################################################################
# MAIN AC BRIDGE (whole-house unit)
###########################################################################
- name: AC Bridge
  port: 21060
  ip_address: !secret ha_homekit_ip_address_1
  advertise_ip:
    - !secret ha_homekit_ip_address_1
  filter:
    exclude_entity_globs:
      - "*"
    include_entities:
      - climate.ac_0
  entity_config:
    climate.ac_0:
      name: "Main Aircon"

###########################################################################
# LIVING
###########################################################################
- name: Living Bridge
  port: 21061
  ip_address: !secret ha_homekit_ip_address_1
  advertise_ip:
    - !secret ha_homekit_ip_address_1
  filter:
    exclude_entity_globs:
      - "*"
    include_entities:
      # Living blinds
      - cover.blinds_living_windows
      - cover.blinds_living_door
      - cover.blind_kitchen
      - vacuum.downstairs_robot
      - media_player.bennis_a9

      - light.kitchen_switch_light_kitchen_bench

      # Living fan
      - fan.living_fan
      - switch.laundry_plug_laundry_plug_fan

      # Living climate zone
      - climate.living

    include_entity_globs:
      # Living scenes (scripts like scene_living_chill, scene_living_bright, etc.)
      - script.scene_living_*

      # Living fan speed scripts (e.g. living_fan_speed_1..4)
      - script.living_fan_speed_*

  entity_config:
    script.scene_living_cinema:
      name: "Cinema"
    script.scene_living_movie:
      name: "Movie"
    climate.living:
      name: "Living Zone"
    switch.laundry_plug_laundry_plug_fan:
      name: "Laundry Fan"

