  - id: sg_battery_control_reload_stop
    alias: Sungrow Battery One-shot Startup Reload Stop
    mode: single
    triggers:
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: automation_reloaded
    - trigger: event
      event_type: call_service
      event_data:
        domain: script
        service: reload
    conditions: []
    actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sg_battery_runtime_started
    - if:
      - condition: template
        value_template: |-
          {% set lease = states('input_text.sg_battery_manual_lease') | from_json({}) %}
          {{ lease is mapping and lease.get('id') is string and not lease.get('done', true) }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.sg_battery_manual_lease
        data:
          value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int)
            | tojson | replace('', '', '','') | replace('': '', '':'') }}'
    - action: script.sg_battery_request
      data:
        operation: normal
  - id: sg_battery_command_path_registered_stop
    alias: Sungrow Recreated Command Path One-shot Stop
    mode: restart
    description: Script reload preserves unchanged entities. Changed owner/request services are re-registered; stop again through the available
      recreated path so reload cannot cancel the only Stop transaction.
    triggers:
    - trigger: event
      event_type: service_registered
      event_data:
        domain: script
        service: sg_battery_request
    - trigger: event
      event_type: service_registered
      event_data:
        domain: script
        service: sg_battery_command_owner
    conditions:
    - condition: template
      value_template: '{{ is_state(''input_boolean.sg_battery_runtime_started'',''on'') }}'
    actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sg_battery_control_armed
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sg_battery_stop_pending
    - wait_template: '{{ has_value(''script.sg_battery_request'') and has_value(''script.sg_battery_command_owner'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - action: script.sg_battery_request
      data:
        operation: normal

  - id: sg_manual_battery_authority_lost
    alias: Sungrow Stop On Lost Manual Authority
    description: One-shot Stop for unexpected removal or mutation of an active manual lease. Ingress rejects superseded loss events before cancelling
      an owner.
    mode: queued
    max: 10
    max_exceeded: silent
    triggers:
    - trigger: state
      entity_id: input_text.sg_battery_manual_lease
    conditions:
    - condition: template
      value_template: |-
        {% set prior=trigger.from_state.state|from_json({}) if trigger.from_state is not none else {} %}
        {% set current=trigger.to_state.state|from_json({}) if trigger.to_state is not none else {} %}
        {% set prior=prior if prior is mapping else {} %}
        {% set current=current if current is mapping else {} %}
        {% set active=prior.get('id') is string and prior.get('id')|length>0 and prior.get('done') == false %}
        {% set completed=current.get('id') == prior.get('id') and current.get('done') == true
         and current.get('stop_requested') == true and current.get('start') == prior.get('start')
         and current.get('end') == prior.get('end') and current.get('op') == prior.get('op')
         and current.get('power') == prior.get('power')
         and current.get('kind') == prior.get('kind') and current.get('target') == prior.get('target')
         and current.get('rearm') == prior.get('rearm') %}
        {% set unchanged=current.get('id') == prior.get('id') and current.get('done') == false
         and current.get('start') == prior.get('start') and current.get('end') == prior.get('end')
         and current.get('op') == prior.get('op') and current.get('power') == prior.get('power')
         and current.get('kind') == prior.get('kind') and current.get('target') == prior.get('target')
         and current.get('rearm') == prior.get('rearm') %}
        {{ active and not completed and not unchanged }}
    actions:
    - action: script.sg_battery_request
      data:
        operation: normal
        lost_manual_id: '{{ (trigger.from_state.state|from_json({})).get(''id'','''') }}'

