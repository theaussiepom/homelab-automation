  - id: sg_manual_battery_lease_deadline
    alias: Sungrow Manual Lease One-shot Deadline
    mode: restart
    triggers:
    - trigger: state
      entity_id: input_text.sg_battery_manual_lease
    conditions:
    - condition: template
      value_template: |-
        {% set lease = states('input_text.sg_battery_manual_lease') | from_json({}) %}
        {{ lease is mapping and lease.get('id') is string and not lease.get('done', true) }}
    actions:
    - variables:
        captured_lease: '{{ states(''input_text.sg_battery_manual_lease'') }}'
    - delay:
        seconds: '{{ [0, (captured_lease | from_json({})).get(''end'',0) | float - as_timestamp(now())] | max }}'
    - condition: template
      value_template: '{{ states(''input_text.sg_battery_manual_lease'') == captured_lease }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.sg_battery_manual_lease
      data:
        value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int) |
          tojson | replace('', '', '','') | replace('': '', '':'') }}'
    - action: script.sg_battery_request
      data:
        operation: normal
  - id: sg_manual_battery_lease_withdrawn
