# Battery control Step 1, 2026-09-27. No periodic retries or forecast/policy changes.
input_boolean:
  sg_battery_control_armed:
    name: Sungrow Forced Battery Control Armed
    icon: mdi:shield-lock
    initial: false
  sg_battery_stop_pending:
    name: Sungrow Battery Stop Pending
    icon: mdi:battery-alert
    initial: true

  sg_battery_runtime_started:
    name: Sungrow Battery Runtime Started
    initial: false
input_text:
  sg_battery_control_result:
    name: Sungrow Battery Command Result
    max: 255
    initial: Not yet verified after startup

  sg_battery_command_ack:
    name: Sungrow Correlated Command Acknowledgement
    max: 255
    initial: ''
  sg_battery_manual_lease:
    name: Sungrow Manual Battery Lease
    max: 255
    initial: ''
  sg_battery_last_command_session:
    name: Sungrow Last Consumed Command Session
    max: 100
  sg_battery_owner_started_session:
    name: Sungrow Last Owner Started Session
    max: 100

  sg_battery_normal_confirmation:
    name: Sungrow Verified Normal Stop Receipt
    max: 255
    initial: ''
    icon: mdi:check-decagram

  sg_battery_authority_epoch:
    name: Sungrow Battery Authority Epoch
    max: 40
    initial: ''
  sg_battery_last_command_attempt:
    name: Sungrow Last Consumed Command Attempt
    max: 160
  sg_battery_owner_started_attempt:
    name: Sungrow Last Owner Started Attempt
    max: 160
script:
  sg_battery_request:
    alias: Sungrow battery request (single command entry)
    mode: queued
    max: 20
    description: Serialized admission for the single command owner. Stop invalidates queued starts. Only current scheduler attempts may retry, before
      any enable write.
    fields:
      operation:
        required: true
        selector:
          select:
            options:
            - normal
            - stage
            - charge
            - discharge
            - bypass
            - refresh
      power_w:
        selector:
          number:
            min: 1
            max: 10000
            step: 1
            unit_of_measurement: W
    sequence:
      - variables:
          op: '{{ operation | default(''normal'') }}'
          requested_w: '{{ power_w | default(states(''input_number.energy_overnight_battery_charge_power_w'')) | float(-1) }}'
          source: '{{ authority | default('''') }}'
          request_id: '{{ session_id | default('''') }}'
          captured_epoch: '{{ authority_epoch | default('''') | string }}'
          attempt_number: '{{ attempt | default(1) | int(-1) }}'
          power_limit: |-
            {% from 'energy_battery_manual.jinja' import battery_request_power_limit %}
            {% set limit=battery_request_power_limit|as_function %}
            {{ limit(source,op,request_id) }}
          preserve_arm: |-
            {% set s=states('input_text.energy_battery_charge_session')|from_json({}) %}
            {% set a=states('input_text.sg_battery_command_ack')|from_json({}) %}
            {% set r=states('input_text.energy_battery_recovery')|from_json({}) %}
            {% set s=s if s is mapping else {} %}{% set a=a if a is mapping else {} %}{% set r=r if r is mapping else {} %}
            {{ recovery_stop|default(false) == true and is_state('input_boolean.sg_battery_control_armed','on')
             and s.get('done') == false and s.get('id') is string and s.get('id') == a.get('id')
             and a.get('authority') == 'session' and a.get('op') == 'charge' and a.get('power') == s.get('power')
             and a.get('status') == 'failed' and 'started' in a and a.get('started') is none
             and a.get('attempt') in [1,2] and a.get('epoch') == states('input_text.sg_battery_authority_epoch')
             and r.get('id') == s.get('id') and r.get('phase') in ['stopping']
             and r.get('starts') == a.get('attempt') and r.get('epoch') == a.get('epoch')
             and is_number(s.get('start')) and is_number(s.get('end'))
             and s.start|float <= as_timestamp(now()) < [s.end|float,s.start|float+60]|min }}
      - if:
        - condition: template
          value_template: "{{ op == 'refresh' }}"
        then:
        - condition: template
          value_template: |-
            {% from 'energy_battery_manual.jinja' import battery_target_refresh_permitted %}
            {% set valid=battery_target_refresh_permitted|as_function %}
            {{ source=='manual' and valid(captured_epoch,request_id,requested_w)
              and is_state('script.sg_battery_command_owner','off') }}
        - action: script.turn_on
          target:
            entity_id: script.sg_battery_command_owner
          data:
            variables:
              operation: refresh
              power_w: '{{ requested_w | int }}'
              authority: manual
              session_id: '{{ request_id }}'
              authority_epoch: '{{ captured_epoch }}'
        - stop: Target command refreshed through the existing owner
      - if:
        - condition: template
          value_template: '{{ op in [''normal'',''stage''] and authority_epoch is defined and captured_epoch != states(''input_text.sg_battery_authority_epoch'')
            }}'
        then:
        - stop: Superseded reconciliation Stop; newer owner untouched
      - if:
        - condition: template
          value_template: |-
            {% set s=states('input_text.energy_battery_charge_session')|from_json({}) %}
            {% set m=states('input_text.sg_battery_manual_lease')|from_json({}) %}
            {% set s=s if s is mapping else {} %}{% set m=m if m is mapping else {} %}
            {{ op in ['normal','stage'] and ((expected_session_id is defined and expected_session_id != s.get('id',''))
             or (expected_manual_id is defined and expected_manual_id != m.get('id',''))) }}
        then:
        - stop: Reconciliation Stop superseded by newer session or manual lease; owner untouched
      - if:
        - condition: template
          value_template: '{{ lost_manual_id is defined }}'
        then:
        - variables:
            lost_authority_still_current: |-
              {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
              {% set current_plan_authority=battery_plan_authority|as_function %}
              {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
              {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
              {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
              {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
              {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}
              {% set manual=states('input_text.sg_battery_manual_lease')|from_json({}) %}
              {% set session=states('input_text.energy_battery_charge_session')|from_json({}) %}
              {% set ack=states('input_text.sg_battery_command_ack')|from_json({}) %}
              {% set manual=manual if manual is mapping else {} %}
              {% set session=session if session is mapping else {} %}
              {% set ack=ack if ack is mapping else {} %}
              {% set t=as_timestamp(now()) %}
              {% set last=states('input_text.sg_battery_last_command_session') %}
              {% set fresh=has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))
               and 0 <= states('sensor.battery_level')|float <= 100
               and 0 <= t-as_timestamp(states.sensor.battery_level.last_reported,0) <= 180 %}
              {% set permitted=fresh and is_state('input_boolean.sg_battery_control_armed','on')
               and is_state('input_boolean.sg_battery_stop_pending','off') and is_state('input_boolean.energy_disable_automation','off') %}
              {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
              {% set manual_permitted=battery_manual_permitted|as_function %}
              {% set m_valid=manual_permitted(manual) and manual.get('id') != lost_manual_id and manual.get('id') == last %}
              {% set s_valid=session.get('id') is string and session.get('id')|length>0 and session.get('id') != lost_manual_id
               and session.get('id') == last and session.get('done') == false
               and is_number(session.get('start')) and is_number(session.get('end'))
               and is_number(session.get('max_end')) and is_number(session.get('power')) and is_number(session.get('budget'))
               and is_number(session.get('targetkwh')) and is_number(session.get('targetsoc'))
               and session.start|float <= t < session.end|float <= session.max_end|float
               and 0 < session.power|float <= 3000 and session.power|float == session.power|int
               and 0 < session.budget|float and 0 < session.targetkwh|float and 0 < session.targetsoc|float <= 90
               and plan_authority_ok and authority_plan.get('ready') == true and authority_plan.get('passive_target_met',true) == false and authority_plan.get('passive_dominates_continuation',true)==false
               and is_state('binary_sensor.energy_tariff_ev','on') and is_state('input_boolean.energy_allow_overnight_battery_charge','on')
               and is_number(states('sensor.energy_battery_effective_capacity')) and is_number(authority_plan.get('stop_target_kwh',authority_plan.get('target_kwh')))
               and states('sensor.battery_level')|float(100)/100*states('sensor.energy_battery_effective_capacity')|float(0)
                < [session.get('targetkwh',0)|float,authority_plan.get('stop_target_kwh',authority_plan.get('target_kwh',0))|float,states('sensor.energy_battery_effective_capacity')|float(0)*0.9]|min %}
              {% set newer=manual if m_valid else session if s_valid else {} %}
              {% set new_source='manual' if m_valid else 'session' %}
              {% set new_op=manual.get('op') if m_valid else 'charge' %}
              {% set confirmation=ack.get('epoch') == states('input_text.sg_battery_authority_epoch') and ack.get('id') == newer.get('id') and ack.get('authority') == new_source
               and ack.get('op') == new_op and ack.get('power') == newer.get('power') and ack.get('status') == 'confirmed'
               and is_number(ack.get('ts')) and is_number(ack.get('started')) and is_number(newer.get('start'))
               and newer.start|float <= ack.started|float <= ack.ts|float <= t %}
              {% set recovery=states('input_text.energy_battery_recovery')|from_json({}) %}
              {% set recovery=recovery if recovery is mapping else {} %}
              {% set retry_preparing=s_valid and t<=session.get('start',0)|float+60
               and recovery.get('id')==session.get('id') and recovery.get('starts') in [1,2,3]
               and ((recovery.get('phase')=='starting' and recovery.get('epoch')==states('input_text.sg_battery_authority_epoch'))
               or (recovery.get('phase') in ['stopping','stop_backoff','retry_wait']
               and ack.get('id')==session.get('id') and ack.get('authority')=='session' and ack.get('op')=='charge'
               and ack.get('power')==session.get('power') and ack.get('status')=='failed' and 'started' in ack and ack.get('started') is none
               and ack.get('epoch')==recovery.get('epoch') and ack.get('attempt')==recovery.get('starts'))) %}
              {% set preparing=newer and ack.get('id') != newer.get('id') and t <= newer.get('start',0)|float+60 %}
              {{ lost_manual_id is string and lost_manual_id|length>0
               and not ((permitted and (m_valid or s_valid) and (confirmation or preparing))
               or (fresh and is_state('input_boolean.sg_battery_control_armed','on')
               and is_state('input_boolean.energy_disable_automation','off') and retry_preparing)) }}
        - if:
          - condition: template
            value_template: '{{ op != ''normal'' or not lost_authority_still_current }}'
          then:
          - stop: Lost-manual-authority event superseded or invalid; active owner untouched
      - if:
        - condition: template
          value_template: '{{ op not in [''normal'',''stage'',''charge'',''discharge'',''bypass''] }}'
        then:
        - stop: Unsupported battery operation; no command sent
          error: true
      - if:
        - condition: template
          value_template: '{{ op in [''stage'',''charge'',''discharge'',''bypass''] and (requested_w < 1 or requested_w > power_limit or requested_w != requested_w
            | int) }}'
        then:
        - stop: Power exceeds this request authority ceiling or is not a whole number; no command sent
          error: true
      - if:
        - condition: template
          value_template: '{{ op in [''charge'',''discharge'',''bypass''] }}'
        then:
        - if:
          - condition: template
            value_template: '{{ attempt | default(1) | string not in [''1'',''2'',''3''] }}'
          then:
          - stop: Invalid start attempt ordinal; owner untouched
            error: true
        - if:
          - condition: template
            value_template: '{{ is_state(''script.sg_battery_command_owner'',''on'') }}'
          then:
          - stop: An active owner must finish or be stopped before a new start; owner untouched
            error: true
        - if:
          - condition: template
            value_template: |-
              {% set r=states('input_text.energy_battery_recovery')|from_json({}) %}
              {% set r=r if r is mapping else {} %}
              {{ not (captured_epoch is string and captured_epoch|length > 0 and captured_epoch not in ['unknown','unavailable'] and captured_epoch == states('input_text.sg_battery_authority_epoch')
               and attempt_number in [1,2,3] and (source != 'manual' or attempt_number == 1) and (source != 'session' or (op == 'charge'
               and r.get('id') == request_id and r.get('phase') == 'starting'
               and r.get('starts') == attempt_number and r.get('epoch') == captured_epoch))) }}
          then:
          - stop: Start epoch or current recovery attempt no longer authoritative; owner untouched
            error: true
        - if:
          - condition: template
            value_template: |-
              {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
              {% set current_plan_authority=battery_plan_authority|as_function %}
              {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
              {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
              {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
              {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
              {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}
              {% set raw_plan = state_attr('sensor.energy_recovery_forecast_model_cache', 'model_data') %}
              {% set decoded_plan = raw_plan if raw_plan is mapping else raw_plan | from_json({}) if raw_plan is string else {} %}
              {% set plan = decoded_plan if decoded_plan is mapping else {} %}
              {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
              {% set manual_permitted=battery_manual_permitted|as_function %}
              {% set lease = states('input_text.energy_battery_charge_session' if source == 'session' else 'input_text.sg_battery_manual_lease') | from_json({}) %}
              {{ not (captured_epoch == states('input_text.sg_battery_authority_epoch') and is_state('input_boolean.sg_battery_control_armed', 'on')
               and is_state('input_boolean.sg_battery_stop_pending', 'off')
               and is_state('input_boolean.energy_disable_automation', 'off')
               and (source == 'manual' or op != 'charge' or is_state('input_boolean.energy_allow_overnight_battery_charge', 'on')) and source in ['session','manual'] and lease is mapping and lease.get('id') == request_id
               and not lease.get('done', true) and lease.get('power') == requested_w
               and is_number(lease.get('start')) and is_number(lease.get('end'))
               and lease.start | float <= as_timestamp(now()) < lease.end | float
               and (source != 'session' or (op == 'charge' and is_state('binary_sensor.energy_state_battery_should_be_charging','on')
                 and as_timestamp(now()) <= lease.start | float + 60))
               and (source == 'manual' or op != 'charge' or states('sensor.battery_level') | float(100) < 90)
               and (source != 'session' or (plan_authority_ok and plan.get('ready') == true and plan.get('passive_target_met', true) == false and plan.get('passive_dominates_continuation',true)==false
                 and is_number(states('sensor.energy_battery_effective_capacity'))
                 and is_number(plan.get('stop_target_kwh', plan.get('target_kwh')))
                 and states('sensor.battery_level') | float(100) / 100 * states('sensor.energy_battery_effective_capacity') | float(0)
                    < [lease.get('targetkwh',0) | float, plan.get('stop_target_kwh', plan.get('target_kwh',0)) | float, states('sensor.energy_battery_effective_capacity') | float(0) * 0.9] | min))
               and (source != 'manual' or (lease.get('op') == op and manual_permitted(lease)))
               and has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))
               and 0 <= states('sensor.battery_level') | float <= 100
               and 0 <= as_timestamp(now()) - as_timestamp(states.sensor.battery_level.last_reported, 0) <= 180) }}
          then:
          - stop: Forced battery control is disarmed, stopping, or not permitted; active stop remains untouched
            error: true
        - if:
          - condition: template
            value_template: '{{ states(''input_text.sg_battery_last_command_attempt'') == request_id ~ ''|'' ~ captured_epoch ~ ''|'' ~ attempt_number
              or (source == ''manual'' and states(''input_text.sg_battery_last_command_session'') == request_id) }}'
          then:
          - stop: Session already consumed; no command sent and active owner untouched
            error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_last_command_session
          data:
            value: '{{ request_id }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_last_command_attempt
          data:
            value: '{{ request_id ~ ''|'' ~ captured_epoch ~ ''|'' ~ attempt_number }}'
        - action: input_text.set_value
          continue_on_error: true
          target:
            entity_id: input_text.sg_battery_normal_confirmation
          data:
            value: ''
        else:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.sg_battery_stop_pending
          continue_on_error: true
        - variables:
            captured_epoch: '{{ ''e'' ~ ([(as_timestamp(now())*1000000)|int, states(''input_text.sg_battery_authority_epoch'')|replace(''e'','''')|int(0)+1]|max|string)
              }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_authority_epoch
          data:
            value: '{{ captured_epoch }}'
          continue_on_error: true
        - action: input_text.set_value
          continue_on_error: true
          target:
            entity_id: input_text.sg_battery_normal_confirmation
          data:
            value: ''
        - if:
          - condition: template
            value_template: |-
              {% set lease = states('input_text.sg_battery_manual_lease') | from_json({}) %}
              {{ lease is mapping and lease.get('id') is string and not lease.get('done', true) }}
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_manual_lease
            data:
              value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int)
                | tojson | replace('', '', '','') | replace('': '', '':'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ not preserve_arm }}'
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sg_battery_control_armed
            continue_on_error: true
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.sg_battery_stop_pending
          continue_on_error: true
      - action: script.turn_off
        target:
          entity_id: script.sg_battery_command_owner
      - action: script.turn_on
        target:
          entity_id: script.sg_battery_command_owner
        data:
          variables:
            operation: '{{ op }}'
            power_w: '{{ requested_w | int }}'
            authority: '{{ source }}'
            session_id: '{{ request_id }}'
            authority_epoch: '{{ captured_epoch }}'
            attempt: '{{ attempt_number }}'
            recovery_stop: '{{ preserve_arm }}'
  sg_battery_command_owner:
    alias: Sungrow battery verified command owner
    mode: single
    max_exceeded: warning
    description: Only writer for mode/command/forced-power. Epoch and immutable authority are rechecked; failed starts leave persistent pending Stop
      for reconciliation.
    sequence:
      - variables:
          op: '{{ operation | default(''normal'') }}'
          requested_w: '{{ power_w | default(3000) | float(-1) }}'
          source: '{{ authority | default('''') }}'
          request_id: '{{ session_id | default('''') }}'
          captured_epoch: '{{ authority_epoch | default('''') | string }}'
          attempt_number: '{{ attempt | default(1) | int(-1) }}'
          power_limit: |-
            {% from 'energy_battery_manual.jinja' import battery_request_power_limit %}
            {% set limit=battery_request_power_limit|as_function %}
            {{ limit(source,op,request_id) }}
          preserve_arm: '{{ recovery_stop | default(false) == true }}'
      - if:
        - condition: template
          value_template: "{{ op == 'refresh' }}"
        then:
        - variables:
            refresh_lease: "{{ states('input_text.sg_battery_manual_lease') }}"
            refresh_ack: "{{ states('input_text.sg_battery_command_ack')|from_json({}) }}"
        - condition: template
          value_template: |-
            {% from 'energy_battery_manual.jinja' import battery_target_refresh_permitted %}
            {% set valid=battery_target_refresh_permitted|as_function %}
            {{ source=='manual' and valid(captured_epoch,request_id,requested_w) }}
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_control_result
          data:
            value: "{{ 'Refreshing: target charge at ' ~ requested_w|int ~ ' W' }}"
        - condition: template
          value_template: |-
            {% from 'energy_battery_manual.jinja' import battery_target_refresh_permitted %}
            {% set valid=battery_target_refresh_permitted|as_function %}
            {{ states('input_text.sg_battery_manual_lease')==refresh_lease
              and valid(captured_epoch,request_id,requested_w) }}
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: SungrowSHx
            slave: !secret sungrow_modbus_slave
            address: 13051
            value: '{{ requested_w | int }}'
        - condition: template
          value_template: |-
            {% from 'energy_battery_manual.jinja' import battery_target_refresh_permitted %}
            {% set valid=battery_target_refresh_permitted|as_function %}
            {{ states('input_text.sg_battery_manual_lease')==refresh_lease
              and valid(captured_epoch,request_id,requested_w) }}
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: SungrowSHx
            slave: !secret sungrow_modbus_slave
            address: 13050
            value: 170
        - condition: template
          value_template: |-
            {% from 'energy_battery_manual.jinja' import battery_target_refresh_permitted %}
            {% set valid=battery_target_refresh_permitted|as_function %}
            {{ states('input_text.sg_battery_manual_lease')==refresh_lease
              and valid(captured_epoch,request_id,requested_w) }}
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: SungrowSHx
            slave: !secret sungrow_modbus_slave
            address: 13049
            value: 2
        - variables:
            refresh_read_after: '{{ as_timestamp(now()) }}'
        - action: homeassistant.update_entity
          continue_on_error: true
          target:
            entity_id:
            - sensor.ems_mode_selection_raw
            - sensor.battery_forced_charge_discharge_cmd_raw
            - sensor.battery_forced_charge_discharge_power
        - wait_template: >-
            {{ states('input_text.sg_battery_manual_lease')!=refresh_lease
              or states('input_text.sg_battery_authority_epoch')!=captured_epoch
              or (is_state('sensor.ems_mode_selection_raw','2')
                and is_state('sensor.battery_forced_charge_discharge_cmd_raw','170')
                and states('sensor.battery_forced_charge_discharge_power')|int(-1)==requested_w
                and as_timestamp(states.sensor.ems_mode_selection_raw.last_reported,0)>=refresh_read_after|float
                and as_timestamp(states.sensor.battery_forced_charge_discharge_cmd_raw.last_reported,0)>=refresh_read_after|float
                and as_timestamp(states.sensor.battery_forced_charge_discharge_power.last_reported,0)>=refresh_read_after|float) }}
          timeout: '00:00:20'
          continue_on_timeout: true
        - condition: template
          value_template: "{{ states('input_text.sg_battery_manual_lease')==refresh_lease and states('input_text.sg_battery_authority_epoch')==captured_epoch }}"
        - variables:
            refresh_verified: >-
              {% from 'energy_battery_manual.jinja' import battery_target_refresh_permitted %}
              {% set valid=battery_target_refresh_permitted|as_function %}
              {{ valid(captured_epoch,request_id,requested_w) and is_state('sensor.ems_mode_selection_raw','2')
                and is_state('sensor.battery_forced_charge_discharge_cmd_raw','170')
                and states('sensor.battery_forced_charge_discharge_power')|int(-1)==requested_w
                and as_timestamp(states.sensor.ems_mode_selection_raw.last_reported,0)>=refresh_read_after|float
                and as_timestamp(states.sensor.battery_forced_charge_discharge_cmd_raw.last_reported,0)>=refresh_read_after|float
                and as_timestamp(states.sensor.battery_forced_charge_discharge_power.last_reported,0)>=refresh_read_after|float }}
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_command_ack
          data:
            value: "{{ dict(refresh_ack,status='confirmed' if refresh_verified else 'failed',ts=as_timestamp(now()))|tojson|replace(', ',',')|replace(': ',':') }}"
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_control_result
          data:
            value: "{{ 'Confirmed: target charge refreshed, setting ' ~ requested_w|int ~ ' W' if refresh_verified else 'Failed: target refresh readback unconfirmed' }}"
        - stop: Target refresh completed; lease target and deadline unchanged
      - if:
        - condition: template
          value_template: '{{ op not in [''normal'',''stage'',''charge'',''discharge'',''bypass''] or (op in [''stage'',''charge'',''discharge'',''bypass'']
            and (requested_w < 1 or requested_w > power_limit or requested_w != requested_w | int)) }}'
        then:
        - if:
          - condition: template
            value_template: '{% set m = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ source == ''manual'' and m is mapping and
              m.get(''id'') == request_id and not m.get(''done'',true) }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_manual_lease
            data:
              value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int)
                | tojson | replace('', '', '','') | replace('': '', '':'') }}'
            continue_on_error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_command_ack
          data:
            value: '{{ {''id'':request_id,''epoch'':captured_epoch,''attempt'':attempt_number,''authority'':source,''op'':op,''power'':requested_w |
              int,''status'':''failed'',''ts'':as_timestamp(now()),''started'':command_enable_at | default(none)} | tojson | replace('', '', '','')
              | replace('': '', '':'') }}'
        - stop: Invalid transaction; no command sent
          error: true
      - if:
        - condition: template
          value_template: '{{ op in [''charge'',''discharge'',''bypass''] }}'
        then:
        - if:
          - condition: template
            value_template: '{{ states(''input_text.sg_battery_last_command_session'') != request_id or states(''input_text.sg_battery_last_command_attempt'')
              != request_id ~ ''|'' ~ captured_epoch ~ ''|'' ~ attempt_number or states(''input_text.sg_battery_owner_started_attempt'') == request_id
              ~ ''|'' ~ captured_epoch ~ ''|'' ~ attempt_number or captured_epoch != states(''input_text.sg_battery_authority_epoch'') }}'
          then:
          - stop: Owner rejected unadmitted or replayed session; no registers changed
            error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_owner_started_session
          data:
            value: '{{ request_id }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_owner_started_attempt
          data:
            value: '{{ request_id ~ ''|'' ~ captured_epoch ~ ''|'' ~ attempt_number }}'
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.sg_battery_normal_confirmation
        data:
          value: ''
      - if:
        - condition: template
          value_template: '{{ op in [''charge'',''discharge'',''bypass''] }}'
        then:
        - if:
          - condition: template
            value_template: |-
              {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
              {% set current_plan_authority=battery_plan_authority|as_function %}
              {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
              {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
              {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
              {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
              {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}
              {% set raw_plan = state_attr('sensor.energy_recovery_forecast_model_cache', 'model_data') %}
              {% set decoded_plan = raw_plan if raw_plan is mapping else raw_plan | from_json({}) if raw_plan is string else {} %}
              {% set plan = decoded_plan if decoded_plan is mapping else {} %}
              {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
              {% set manual_permitted=battery_manual_permitted|as_function %}
              {% set lease = states('input_text.energy_battery_charge_session' if source == 'session' else 'input_text.sg_battery_manual_lease') | from_json({}) %}
              {{ not (captured_epoch == states('input_text.sg_battery_authority_epoch') and is_state('input_boolean.sg_battery_control_armed', 'on')
               and is_state('input_boolean.sg_battery_stop_pending', 'off')
               and is_state('input_boolean.energy_disable_automation', 'off')
               and (source == 'manual' or op != 'charge' or is_state('input_boolean.energy_allow_overnight_battery_charge', 'on')) and source in ['session','manual'] and lease is mapping and lease.get('id') == request_id
               and not lease.get('done', true) and lease.get('power') == requested_w
               and is_number(lease.get('start')) and is_number(lease.get('end'))
               and lease.start | float <= as_timestamp(now()) < lease.end | float
               and (source != 'session' or (op == 'charge' and is_state('binary_sensor.energy_state_battery_should_be_charging','on')
                 and as_timestamp(now()) <= lease.start | float + 60))
               and (source == 'manual' or op != 'charge' or states('sensor.battery_level') | float(100) < 90)
               and (source != 'session' or (plan_authority_ok and plan.get('ready') == true and plan.get('passive_target_met', true) == false and plan.get('passive_dominates_continuation',true)==false
                 and is_number(states('sensor.energy_battery_effective_capacity'))
                 and is_number(plan.get('stop_target_kwh', plan.get('target_kwh')))
                 and states('sensor.battery_level') | float(100) / 100 * states('sensor.energy_battery_effective_capacity') | float(0)
                    < [lease.get('targetkwh',0) | float, plan.get('stop_target_kwh', plan.get('target_kwh',0)) | float, states('sensor.energy_battery_effective_capacity') | float(0) * 0.9] | min))
               and (source != 'manual' or (lease.get('op') == op and manual_permitted(lease)))
               and has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))
               and 0 <= states('sensor.battery_level') | float <= 100
               and 0 <= as_timestamp(now()) - as_timestamp(states.sensor.battery_level.last_reported, 0) <= 180) }}
          then:
          - if:
            - condition: template
              value_template: '{% set m = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ source == ''manual'' and m is mapping
                and m.get(''id'') == request_id and not m.get(''done'',true) }}'
            then:
            - action: input_text.set_value
              target:
                entity_id: input_text.sg_battery_manual_lease
              data:
                value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int)
                  | tojson | replace('', '', '','') | replace('': '', '':'') }}'
              continue_on_error: true
          - if:
            - condition: template
              value_template: |-
                {% set r=states('input_text.energy_battery_recovery')|from_json({}) %}
                {% set r=r if r is mapping else {} %}
                {{ not (source == 'session' and op == 'charge' and command_enable_at is not defined and attempt_number in [1,2]
                 and captured_epoch == states('input_text.sg_battery_authority_epoch')
                 and r.get('id') == request_id and r.get('phase') == 'starting'
                 and r.get('starts') == attempt_number and r.get('epoch') == captured_epoch) }}
            then:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.sg_battery_control_armed
              continue_on_error: true
