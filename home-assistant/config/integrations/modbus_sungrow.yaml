          value_template: '{{ not (has_value(''sensor.ems_mode_selection_raw'') and is_number(states(''sensor.ems_mode_selection_raw'')) and states(''sensor.ems_mode_selection_raw'')
            | int(-1) == 2 and as_timestamp(states.sensor.ems_mode_selection_raw.last_reported, 0) >= read_barrier | float and has_value(''sensor.battery_forced_charge_discharge_cmd_raw'')
            and is_number(states(''sensor.battery_forced_charge_discharge_cmd_raw'')) and states(''sensor.battery_forced_charge_discharge_cmd_raw'')
            | int(-1) == (170 if op == ''charge'' else 187 if op == ''discharge'' else 204) and as_timestamp(states.sensor.battery_forced_charge_discharge_cmd_raw.last_reported,
            0) >= read_barrier | float and has_value(''sensor.battery_forced_charge_discharge_power'') and is_number(states(''sensor.battery_forced_charge_discharge_power''))
            and states(''sensor.battery_forced_charge_discharge_power'') | int(-1) == requested_w and as_timestamp(states.sensor.battery_forced_charge_discharge_power.last_reported,
            0) >= read_barrier | float) }}'
        then:
        - if:
          - condition: template
            value_template: '{% set m = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ source == ''manual'' and m is mapping and
              m.get(''id'') == request_id and not m.get(''done'',true) }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_manual_lease
            data:
              value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int)
                | tojson | replace('', '', '','') | replace('': '', '':'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: |-
              {% set r=states('input_text.energy_battery_recovery')|from_json({}) %}
              {% set r=r if r is mapping else {} %}
              {{ not (source == 'session' and op == 'charge' and command_enable_at is not defined and attempt_number in [1,2]
               and captured_epoch == states('input_text.sg_battery_authority_epoch')
               and r.get('id') == request_id and r.get('phase') == 'starting'
               and r.get('starts') == attempt_number and r.get('epoch') == captured_epoch) }}
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sg_battery_control_armed
            continue_on_error: true
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.sg_battery_stop_pending
          continue_on_error: true
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: SungrowSHx
            slave: !secret 'sungrow_modbus_slave'
            address: 13050
            value: 204
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: SungrowSHx
            slave: !secret 'sungrow_modbus_slave'
            address: 13049
            value: 0
        - variables:
            read_barrier: '{{ as_timestamp(now()) }}'
        - action: homeassistant.update_entity
          continue_on_error: true
          target:
            entity_id:
            - sensor.ems_mode_selection_raw
            - sensor.battery_forced_charge_discharge_cmd_raw
            - sensor.battery_forced_charge_discharge_power
        - if:
          - condition: template
            value_template: '{{ has_value(''sensor.ems_mode_selection_raw'') and is_number(states(''sensor.ems_mode_selection_raw'')) and states(''sensor.ems_mode_selection_raw'')
              | int(-1) == 0 and as_timestamp(states.sensor.ems_mode_selection_raw.last_reported, 0) >= read_barrier | float and has_value(''sensor.battery_forced_charge_discharge_cmd_raw'')
              and is_number(states(''sensor.battery_forced_charge_discharge_cmd_raw'')) and states(''sensor.battery_forced_charge_discharge_cmd_raw'')
              | int(-1) == 204 and as_timestamp(states.sensor.battery_forced_charge_discharge_cmd_raw.last_reported, 0) >= read_barrier | float }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_control_result
            data:
              value: 'FAILED: Final mode/command/power not verified; self-consumption freshly confirmed'
            continue_on_error: true
          else:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_control_result
            data:
              value: 'FAILED: Final mode/command/power not verified; STOP UNCONFIRMED'
            continue_on_error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_command_ack
          data:
            value: '{{ {''id'':request_id,''epoch'':captured_epoch,''attempt'':attempt_number,''authority'':source,''op'':op,''power'':requested_w |
              int,''status'':''failed'',''ts'':as_timestamp(now()),''started'':command_enable_at | default(none)} | tojson | replace('', '', '','')
              | replace('': '', '':'') }}'
        - stop: Final mode/command/power not verified
          error: true
      - if:
        - condition: template
          value_template: |-
            {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
            {% set current_plan_authority=battery_plan_authority|as_function %}
            {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
            {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
            {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
            {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
            {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}
            {% set raw_plan = state_attr('sensor.energy_recovery_forecast_model_cache', 'model_data') %}
            {% set decoded_plan = raw_plan if raw_plan is mapping else raw_plan | from_json({}) if raw_plan is string else {} %}
            {% set plan = decoded_plan if decoded_plan is mapping else {} %}
            {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
            {% set manual_permitted=battery_manual_permitted|as_function %}
            {% set lease = states('input_text.energy_battery_charge_session' if source == 'session' else 'input_text.sg_battery_manual_lease') | from_json({}) %}
            {{ not (captured_epoch == states('input_text.sg_battery_authority_epoch') and is_state('input_boolean.sg_battery_control_armed', 'on')
             and is_state('input_boolean.sg_battery_stop_pending', 'off')
             and is_state('input_boolean.energy_disable_automation', 'off')
             and (source == 'manual' or op != 'charge' or is_state('input_boolean.energy_allow_overnight_battery_charge', 'on')) and source in ['session','manual'] and lease is mapping and lease.get('id') == request_id
             and not lease.get('done', true) and lease.get('power') == requested_w
             and is_number(lease.get('start')) and is_number(lease.get('end'))
             and lease.start | float <= as_timestamp(now()) < lease.end | float
             and (source != 'session' or (op == 'charge' and is_state('binary_sensor.energy_state_battery_should_be_charging','on')
               and as_timestamp(now()) <= lease.start | float + 60))
             and (source == 'manual' or op != 'charge' or states('sensor.battery_level') | float(100) < 90)
             and (source != 'session' or (plan_authority_ok and plan.get('ready') == true and plan.get('passive_target_met', true) == false and plan.get('passive_dominates_continuation',true)==false
               and is_number(states('sensor.energy_battery_effective_capacity'))
               and is_number(plan.get('stop_target_kwh', plan.get('target_kwh')))
               and states('sensor.battery_level') | float(100) / 100 * states('sensor.energy_battery_effective_capacity') | float(0)
                  < [lease.get('targetkwh',0) | float, plan.get('stop_target_kwh', plan.get('target_kwh',0)) | float, states('sensor.energy_battery_effective_capacity') | float(0) * 0.9] | min))
             and (source != 'manual' or (lease.get('op') == op and manual_permitted(lease)))
             and has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))
             and 0 <= states('sensor.battery_level') | float <= 100
             and 0 <= as_timestamp(now()) - as_timestamp(states.sensor.battery_level.last_reported, 0) <= 180) }}
        then:
        - if:
          - condition: template
            value_template: '{% set m = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ source == ''manual'' and m is mapping and
              m.get(''id'') == request_id and not m.get(''done'',true) }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_manual_lease
            data:
              value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int)
                | tojson | replace('', '', '','') | replace('': '', '':'') }}'
            continue_on_error: true
        - if:
          - condition: template
            value_template: |-
              {% set r=states('input_text.energy_battery_recovery')|from_json({}) %}
              {% set r=r if r is mapping else {} %}
              {{ not (source == 'session' and op == 'charge' and command_enable_at is not defined and attempt_number in [1,2]
               and captured_epoch == states('input_text.sg_battery_authority_epoch')
               and r.get('id') == request_id and r.get('phase') == 'starting'
               and r.get('starts') == attempt_number and r.get('epoch') == captured_epoch) }}
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sg_battery_control_armed
            continue_on_error: true
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.sg_battery_stop_pending
          continue_on_error: true
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: SungrowSHx
            slave: !secret 'sungrow_modbus_slave'
            address: 13050
            value: 204
        - action: modbus.write_register
          continue_on_error: true
          data:
            hub: SungrowSHx
            slave: !secret 'sungrow_modbus_slave'
            address: 13049
            value: 0
        - variables:
            read_barrier: '{{ as_timestamp(now()) }}'
        - action: homeassistant.update_entity
          continue_on_error: true
          target:
            entity_id:
            - sensor.ems_mode_selection_raw
            - sensor.battery_forced_charge_discharge_cmd_raw
            - sensor.battery_forced_charge_discharge_power
        - if:
          - condition: template
            value_template: '{{ has_value(''sensor.ems_mode_selection_raw'') and is_number(states(''sensor.ems_mode_selection_raw'')) and states(''sensor.ems_mode_selection_raw'')
              | int(-1) == 0 and as_timestamp(states.sensor.ems_mode_selection_raw.last_reported, 0) >= read_barrier | float and has_value(''sensor.battery_forced_charge_discharge_cmd_raw'')
              and is_number(states(''sensor.battery_forced_charge_discharge_cmd_raw'')) and states(''sensor.battery_forced_charge_discharge_cmd_raw'')
              | int(-1) == 204 and as_timestamp(states.sensor.battery_forced_charge_discharge_cmd_raw.last_reported, 0) >= read_barrier | float }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_control_result
            data:
              value: 'FAILED: Permission withdrawn before final confirmation; self-consumption freshly confirmed'
            continue_on_error: true
          else:
          - action: input_text.set_value
            target:
              entity_id: input_text.sg_battery_control_result
            data:
              value: 'FAILED: Permission withdrawn before final confirmation; STOP UNCONFIRMED'
            continue_on_error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.sg_battery_command_ack
          data:
            value: '{{ {''id'':request_id,''epoch'':captured_epoch,''attempt'':attempt_number,''authority'':source,''op'':op,''power'':requested_w |
              int,''status'':''failed'',''ts'':as_timestamp(now()),''started'':command_enable_at | default(none)} | tojson | replace('', '', '','')
              | replace('': '', '':'') }}'
        - stop: Permission withdrawn before final confirmation
          error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.sg_battery_control_result
        data:
          value: '{{ ''Confirmed: '' ~ op ~ '', setting '' ~ requested_w ~ '' W (register readback)'' }}'
        continue_on_error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.sg_battery_command_ack
        data:
          value: '{{ {''id'':request_id,''epoch'':captured_epoch,''attempt'':attempt_number,''authority'':source,''op'':op,''power'':requested_w | int,''status'':''confirmed'',''ts'':as_timestamp(now()),''started'':command_enable_at
            | default(none)} | tojson | replace('', '', '','') | replace('': '', '':'') }}'
  sg_set_forced_charge_battery_mode:
    mode: single
    sequence:
    - condition: template
      value_template: |-
        {% from 'energy_battery_manual.jinja' import battery_target_override_active %}
        {% set active=battery_target_override_active|as_function %}
        {{ not active() }}
    - action: script.energy_battery_reconcile

    description: Compatibility wakeup for Node-RED. The reconciler alone selects automatic attempts from current authority.
  sg_set_forced_discharge_battery_mode:
    mode: single
    sequence:
      - action: script.sg_start_manual_battery_lease
        data:
          operation: discharge
          power_w: '{{ states(''input_number.set_sg_forced_charge_discharge_power'') | int(-1) }}'
  sg_set_battery_bypass_mode:
    mode: single
    sequence:
      - action: script.sg_start_manual_battery_lease
        data:
          operation: bypass
          power_w: '{{ states(''input_number.set_sg_forced_charge_discharge_power'') | int(-1) }}'
  sg_set_self_consumption_mode:
    mode: single
    sequence:
    - condition: template
      value_template: |-
        {% from 'energy_battery_manual.jinja' import battery_target_override_active %}
        {% set active=battery_target_override_active|as_function %}
        {{ not active() }}
    - action: script.sg_battery_request
      data:
        operation: normal
  sg_stage_battery_charge_power:
    mode: single
    sequence:
    - condition: template
      value_template: |-
        {% from 'energy_battery_manual.jinja' import battery_target_override_active %}
        {% set active=battery_target_override_active|as_function %}
        {{ not active() }}
    - action: script.sg_battery_request
      data:
        operation: stage
        power_w: '{{ states(''input_number.energy_overnight_battery_charge_power_w'') | int(-1) }}'
  sg_set_self_consumption_limited_discharge:
    sequence:
    - stop: 'Limited-discharge operation is not commissioned for SH10RS: previous 10 W request was outside its helper
        range. No registers changed.'
      error: true
  sg_apply_requested_battery_mode:
    alias: Sungrow apply requested battery mode
    mode: single
    sequence:
      - if:
        - condition: template
          value_template: '{{ states(''input_select.set_sg_ems_mode'') not in [''Self-consumption mode (default)'', ''Forced mode''] }}'
        then:
        - stop: External EMS is not part of the commissioned command path; no registers changed
          error: true
      - if:
        - condition: template
          value_template: '{{ is_state(''input_select.set_sg_ems_mode'',''Forced mode'') and states(''input_select.set_sg_battery_forced_charge_discharge_cmd'')
            not in [''Stop (default)'',''Forced charge'',''Forced discharge''] }}'
        then:
        - stop: Requested battery command is unavailable or unsupported; no registers changed
          error: true
      - if:
        - condition: template
          value_template: '{{ is_state(''input_select.set_sg_ems_mode'',''Self-consumption mode (default)'') }}'
        then:
        - action: script.sg_battery_request
          data:
            operation: normal
        else:
        - action: script.sg_start_manual_battery_lease
          data:
            operation: '{{ ''normal'' if is_state(''input_select.set_sg_ems_mode'',''Self-consumption mode (default)'') else ''charge'' if is_state(''input_select.set_sg_battery_forced_charge_discharge_cmd'',''Forced
              charge'') else ''discharge'' if is_state(''input_select.set_sg_battery_forced_charge_discharge_cmd'',''Forced discharge'') else ''bypass''
              }}'
            power_w: '{{ states(''input_number.set_sg_forced_charge_discharge_power'') | int(-1) }}'

  sg_start_manual_battery_lease:
    alias: Sungrow Start Bounded Manual Battery Lease
    mode: single
    description: Captures operation, power and duration once for at most 15 minutes. Explicit request; no renewal, retry or rearm.
    sequence:
      - variables:
          op: '{{ operation | default('''') }}'
          requested_w: '{{ power_w | default(-1) | float(-1) }}'
          manual_epoch: '{{ states(''input_text.sg_battery_authority_epoch'') }}'
          requested_duration_s: '{{ duration_s | default(900) | float(-1) }}'
      - if:
        - condition: template
          value_template: |-
            {{ not (is_state('input_boolean.sg_battery_control_armed', 'on')
             and is_state('input_boolean.sg_battery_stop_pending', 'off')
             and is_state('input_boolean.energy_disable_automation', 'off')
             and (op != 'charge' or is_state('input_boolean.energy_allow_overnight_battery_charge', 'on')) and has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))
             and 0 <= states('sensor.battery_level') | float <= 100
             and 0 <= as_timestamp(now()) - as_timestamp(states.sensor.battery_level.last_reported, 0) <= 180 and op in ['charge','discharge','bypass'] and (op != 'charge' or states('sensor.battery_level') | float(100) < 90) and 10 <= requested_duration_s <= 900 and requested_duration_s == requested_duration_s | int and 1 <= requested_w <= 3000 and requested_w == requested_w | int) }}
        then:
        - stop: Manual lease requires fresh SOC, bounded power/duration and explicit permissions
          error: true
      - if:
        - condition: template
          value_template: '{{ not (states(''input_text.energy_battery_charge_session'') | from_json({})).get(''done'', true) or not (states(''input_text.sg_battery_manual_lease'')
            | from_json({})).get(''done'', true) }}'
        then:
        - stop: Another battery session is active; end it before a manual request
          error: true
      - variables:
          manual_json: '{% set stamp = as_timestamp(now()) %}{{ {''id'':''manual-'' ~ stamp,''start'':stamp,''end'':stamp+requested_duration_s|int,''op'':op,''power'':requested_w
            | int,''done'':false} | tojson | replace('', '', '','') | replace('': '', '':'') }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.sg_battery_manual_lease
        data:
          value: '{{ manual_json }}'
      - action: script.sg_battery_request
        data:
          operation: '{{ op }}'
          power_w: '{{ requested_w | int }}'
          authority: manual
          session_id: '{{ (manual_json | from_json({})).id }}'
          authority_epoch: '{{ manual_epoch }}'
          attempt: 1

    fields:
      duration_s:
        name: Maximum duration
        description: Non-renewing lease; defaults to 900 seconds.
        default: 900
        selector:
          number:
            min: 10
            max: 900
            step: 1
            unit_of_measurement: s
            mode: box
