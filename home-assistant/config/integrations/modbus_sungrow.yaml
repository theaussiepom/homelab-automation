        {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
        {% set permitted=battery_manual_permitted|as_function %}
        {{ not permitted(states('input_text.sg_battery_manual_lease')|from_json({})) }}
    - trigger: state
      entity_id: input_text.sg_battery_manual_lease
    conditions:
    - condition: template
      value_template: |-
        {% set lease = states('input_text.sg_battery_manual_lease') | from_json({}) %}
        {{ lease is mapping and lease.get('id') is string and not lease.get('done', true) }}
    - condition: template
      value_template: |-
        {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
        {% set permitted=battery_manual_permitted|as_function %}
        {{ not permitted(states('input_text.sg_battery_manual_lease')|from_json({})) }}
    actions:
    - action: input_text.set_value
      target:
        entity_id: input_text.sg_battery_manual_lease
      data:
        value: '{% set lease = states(''input_text.sg_battery_manual_lease'') | from_json({}) %}{{ dict(lease, done=true, stop_requested=true, stop_at=as_timestamp(now())|int) |
          tojson | replace('', '', '','') | replace('': '', '':'') }}'
    - action: script.sg_battery_request
      data:
