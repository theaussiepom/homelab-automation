automation:
  - id: set_fan_speed_living_remote
    alias: "Climate: Set fan speed"
    trigger:
      - platform: state
        entity_id:
          - input_number.fan_speed_living
    action:
      - service: script.fan_set_speed
        data:
          fan: "{{ fan }}"
          speed: "{{ states(trigger.entity_id) }}"
          remote: living_universal_remote
    variables:
      fan:
        "{{
            trigger.entity_id |
            regex_replace(
              find='input_number.fan_speed_',
              replace='',
              ignorecase=False
            )
        }}"
  - id: set_fan_speed_bedroom_remote
    alias: "Climate: Set fan speed"
    trigger:
      - platform: state
        entity_id:
          - input_number.fan_speed_master
