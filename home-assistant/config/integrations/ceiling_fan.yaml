script:
  fan_off:
    alias: Turn a fan off
    fields:
      fan:
        description: The fan to turn off
    sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.fan_speed_{{ 'master' if fan == 'ben' else 'guest' if fan == 'matty' else fan }}
          value: 0
    mode: single
    icon: mdi:fan-off
  fan_on:
    alias: Turn a fan on
    fields:
      fan:
        description: The fan to turn on
        example: parents_fan
    sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.fan_speed_{{ 'master' if fan == 'ben' else 'guest' if fan == 'matty' else fan }}
          value: 1
    mode: single
    icon: mdi:fan
  fan_set_speed:
    alias: Set the speed of a fan
    icon: mdi:fan
    fields:
      fan:
        description: The fan to set the speed of
      speed:
        description: The speed of the fan
      remote:
        description: The remote to use
    sequence:
      - service: remote.send_command
        data:
          device: "fan-{{ 'ben' if fan == 'master' else 'matty' if fan == 'guest' else fan }}"
          command: "speed{{ speed | round (0, 'floor') }}"
        target:
          entity_id: remote.{{ 'master_universal_remote' if remote == 'bedroom_universal_remote' else remote }}
      - if:
          - condition: template
            value_template: "{{ (speed | round (0, 'floor')) == 0 }}"
        then:
          - service: input_boolean.turn_off
            data:
              entity_id: input_boolean.fan_state_{{ 'master' if fan == 'ben' else 'guest' if fan == 'matty' else fan }}
        else:
          - service: input_boolean.turn_on
            data:
              entity_id: input_boolean.fan_state_{{ 'master' if fan == 'ben' else 'guest' if fan == 'matty' else fan }}
      - service: input_number.set_value
        data:
          entity_id: input_number.fan_speed_{{ 'master' if fan == 'ben' else 'guest' if fan == 'matty' else fan }}
          value: "{{ speed }}"
    mode: single
  fan_set_speed_from_percent:
    alias: Set the tracking value for the fan speed
    icon: mdi:fan
    fields:
      fan:
        description: The fan to set the speed of
      speed:
        description: The speed of the fan
      speeds:
        description: number of available fan speeds
    sequence:
      service: input_number.set_value
      data:
        entity_id: input_number.fan_speed_{{ 'master' if fan == 'ben' else 'guest' if fan == 'matty' else fan }}
        value: "{{ (((speed | float(0)) / 100) * (speeds | int(1))) | round(0, 'ceil') | int }}"
    mode: single
  ###########################################################################
  # PER-FAN SPEED SCRIPTS (for HomeKit buttons)
  ###########################################################################

