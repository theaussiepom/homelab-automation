input_boolean:
  fan_state_ben:
    name: "Master fan state"
    icon: mdi:fan
  fan_state_deck:
    name: "Deck: Fan state"
    icon: mdi:fan
  fan_state_landing:
    name: "Landing: Fan state"
    icon: mdi:fan
  fan_state_living:
    name: "Living: Fan state"
    icon: mdi:fan
  fan_state_matty:
    name: "Guest Fan State"
    icon: mdi:fan
  fan_state_study:
    name: "Study: Fan state"
    icon: mdi:fan

input_number:
  fan_speed_ben:
    name: Master fan speed
    icon: mdi:fan
    step: 1
    min: 0
    max: 4
    mode: slider
  fan_speed_deck:
    name: Deck fan speed
    icon: mdi:fan
    step: 1
    min: 0
    max: 4
    mode: slider
  fan_speed_landing:
    name: Landing fan speed
    icon: mdi:fan
    step: 1
    min: 0
    max: 4
    mode: slider
  fan_speed_living:
    name: Living fan speed
    icon: mdi:fan
    step: 1
    min: 0
    max: 4
    mode: slider
  fan_speed_matty:
    name: Guest Fan Speed
    icon: mdi:fan
    step: 1
    min: 0
    max: 5
    mode: slider
  fan_speed_study:
    name: Study fan speed
    icon: mdi:fan
    step: 1
    min: 0
    max: 5
    mode: slider

template:
  - fan:
      - default_entity_id: fan.ben_fan
        name: "Master fan"
        unique_id: fan-ben
        speed_count: 4
        state: "{{ states('input_boolean.fan_state_master') }}"
        percentage: "{{ (100 * ((states('input_number.fan_speed_master') | int(0)) / 4)) | round(0) }}"
        turn_off:
          - action: script.fan_off
            data:
              fan: ben
        turn_on:
          - action: script.fan_on
            data:
              fan: ben
        set_percentage:
          - action: script.fan_set_speed_from_percent
            data:
              fan: ben
              speed: "{{ percentage }}"
              speeds: 4

      - default_entity_id: fan.deck_fan
        name: Deck fan
        unique_id: fan-deck
        speed_count: 4
        state: "{{ states('sensor.living_power_fans_power_deck') | float(0) > 1 }}"
        percentage: >
          {% set power = states('sensor.living_power_fans_power_deck') | float(0) %}
          {% if power < 1 %}
            0
          {% elif power < 6 %}
            25
          {% elif power < 8 %}
            50
          {% elif power < 13 %}
            75
          {% else %}
            100
          {% endif %}
        turn_off:
          - action: script.fan_off
            data:
              fan: deck
        turn_on:
          - action: script.fan_on
            data:
              fan: deck
        set_percentage:
          - action: script.fan_set_speed_from_percent
            data:
              fan: deck
              speed: "{{ percentage }}"
              speeds: 4

      - default_entity_id: fan.landing_fan
        name: Landing fan
        unique_id: fan-landing
        speed_count: 4
        state: "{{ states('sensor.landing_power_fan_power_b') | float(0) > 1 }}"
        percentage: >
          {% set power = states('sensor.landing_power_fan_power_b') | float(0) %}
          {% if power < 1 %}
            0
          {% elif power < 9 %}
            25
          {% elif power < 15 %}
            50
          {% elif power < 30 %}
            75
          {% else %}
            100
          {% endif %}
        turn_off:
          - action: script.fan_off
            data:
              fan: landing
        turn_on:
          - action: script.fan_on
            data:
              fan: landing
        set_percentage:
          - action: script.fan_set_speed_from_percent
            data:
              fan: landing
              speed: "{{ percentage }}"
              speeds: 4

      - default_entity_id: fan.living_fan
        name: Living fan
        unique_id: fan-living
        speed_count: 4
        state: "{{ states('sensor.living_power_fans_power_living') | float(0) > 1 }}"
        percentage: >
          {% set power = states('sensor.living_power_fans_power_living') | float(0) %}
          {% if power < 1 %}
            0
          {% elif power < 7 %}
            25
          {% elif power < 10 %}
            50
          {% elif power < 12.5 %}
            75
          {% else %}
            100
          {% endif %}
        turn_off:
          - action: script.fan_off
            data:
              fan: living
        turn_on:
          - action: script.fan_on
            data:
              fan: living
        set_percentage:
          - action: script.fan_set_speed_from_percent
            data:
              fan: living
              speed: "{{ percentage }}"
              speeds: 4

      - default_entity_id: fan.matty_fan
        name: "Guest Fan"
        unique_id: fan-matty
        speed_count: 5
        state: "{{ states('sensor.guest_power_fan_energy_b') | float(0) > 1 }}"
        percentage: >
          {% set power = states('sensor.guest_power_fan_energy_b') | float(0) %}
          {% if power < 1 %}
            0
          {% elif power < 6 %}
            20
          {% elif power < 9 %}
            40
          {% elif power < 13 %}
            60
          {% elif power < 22 %}
            80
          {% else %}
            100
          {% endif %}
        turn_off:
          - action: script.fan_off
            data:
              fan: matty
        turn_on:
          - action: script.fan_on
            data:
              fan: matty
        set_percentage:
          - action: script.fan_set_speed_from_percent
            data:
              fan: matty
              speed: "{{ percentage }}"
              speeds: 5

      - default_entity_id: fan.study_fan
        name: Study fan
        unique_id: fan-study
        speed_count: 5
        state: "{{ states('input_boolean.fan_state_study') }}"
        percentage: "{{ (100 * ((states('input_number.fan_speed_study') | int(0)) / 5)) | round(0) }}"
        turn_off:
          - action: script.fan_off
            data:
              fan: study
        turn_on:
          - action: script.fan_on
            data:
              fan: study
        set_percentage:
          - action: script.fan_set_speed_from_percent
            data:
              fan: study
              speed: "{{ percentage }}"
              speeds: 5
