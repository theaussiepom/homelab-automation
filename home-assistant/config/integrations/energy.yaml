          {% set threshold = states('input_number.energy_solar_surplus_ev_threshold_w') | float(1800) %}
          {% set band = states('input_number.energy_solar_surplus_hysteresis_w') | float(400) %}
          {% set on_at = threshold + (band / 2) %}
          {% set off_at = threshold - (band / 2) %}
          {% if this.state == 'on' %}
            {{ surplus_w >= off_at }}
          {% else %}
            {{ surplus_w >= on_at }}
          {% endif %}
