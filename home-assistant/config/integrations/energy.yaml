###############################################################################
# /config/packages/energy_model.yaml
#
# Energy model + native Solcast forecasts + anomaly/state model
#
# Home Assistant owns:
# - tariff definitions
# - tariff switching
# - utility meters
# - billing maths
# - forecast ingestion
# - semantic state and sofault entities
#
# Home Assistant also owns the battery planner, serialized inverter command
# owner, bounded authority, feedback verification and persistent Stop recovery.
# Node-RED owns EV/Zappi actuation and its recovery; battery requests are
# handed to the existing Home Assistant owner, never a second inverter writer.
###############################################################################

###############################################################################
# HELPERS - FLAGS
###############################################################################

input_boolean:
  energy_allow_overnight_battery_charge:
    name: Energy Allow Overnight Battery Charge
    icon: mdi:battery-charging-50

  energy_force_ev_charge:
    name: Energy Force EV Charge
    icon: mdi:car-electric

  energy_block_ev_charge:
    name: Energy Block EV Charge
    icon: mdi:car-off

  energy_disable_automation:
    name: Energy Disable Automation
    icon: mdi:robot-off

  energy_ev_allow_overnight_fast_charge:
    name: Energy EV Allow Overnight Fast Charge
    icon: mdi:car-electric
    # Turn OFF to skip overnight Fast charging; re-enabled daily at 06:00 local time.

###############################################################################
# HELPERS - NUMBERS
###############################################################################

input_number:
  # Battery modelling
  # Offline model-v5 candidate: capacity and both reserve policies are unchanged.
  energy_battery_reserve_target_kwh:
    name: Energy Battery Reserve Target kWh
    min: 0
    max: 20
    step: 0.5
    mode: box
    unit_of_measurement: kWh
    initial: 5.0

  energy_battery_usable_capacity_kwh:
    name: Energy Battery Usable Capacity kWh
    min: 1
    max: 30
    step: 0.1
    mode: box
    unit_of_measurement: kWh
    initial: 16.0

  energy_overnight_battery_charge_power_w:
    name: Energy Overnight Battery Charge Power
    min: 0
    max: 5000
    step: 100
    mode: box
    unit_of_measurement: W
    initial: 3000

  energy_solar_surplus_ev_threshold_w:
    name: Energy Solar Surplus EV Threshold
    min: 0
    max: 10000
    step: 100
    mode: box
    unit_of_measurement: W
    initial: 1800

  energy_solar_surplus_hysteresis_w:
    name: Energy Solar Surplus Hysteresis
    min: 0
    max: 2000
    step: 50
    mode: box
    unit_of_measurement: W
    initial: 400

  energy_hysteresis_delay_on_minutes:
    name: Energy Hysteresis Delay On
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 3

  energy_hysteresis_delay_off_minutes:
    name: Energy Hysteresis Delay Off
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 5

  energy_ev_allow_delay_minutes:
    name: Energy EV Allow Delay
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 5

  # EV divert guardrail thresholds (v3)
  energy_ev_unsafe_batt_w:
    name: Energy EV Unsafe Battery Discharge
    min: 0
    max: 10000
    step: 50
    mode: box
    unit_of_measurement: W
    initial: 400

  energy_ev_unsafe_ev_w:
    name: Energy EV Unsafe EV Charge
    min: 0
    max: 10000
    step: 50
    mode: box
    unit_of_measurement: W
    initial: 500

  energy_ev_unsafe_on_minutes:
    name: Energy EV Unsafe On Minutes
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 2

  energy_ev_unsafe_hard_batt_w:
    name: Energy EV Unsafe Hard Battery Discharge
    min: 0
    max: 10000
    step: 50
    mode: box
    unit_of_measurement: W
    initial: 800

  energy_ev_unsafe_hard_ev_w:
    name: Energy EV Unsafe Hard EV Charge
    min: 0
    max: 10000
    step: 50
    mode: box
    unit_of_measurement: W
    initial: 1000

  energy_ev_unsafe_hard_on_minutes:
    name: Energy EV Unsafe Hard On Minutes
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 1

  energy_ev_unsafe_off_minutes:
    name: Energy EV Unsafe Off Minutes
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 5

  energy_ev_solar_floor_on_kw:
    name: Energy EV Solar Floor On
    min: 0
    max: 20
    step: 0.1
    mode: box
    unit_of_measurement: kW
    initial: 1.5

  energy_ev_solar_floor_off_kw:
    name: Energy EV Solar Floor Off
    min: 0
    max: 20
    step: 0.1
    mode: box
    unit_of_measurement: kW
    initial: 0.8

  energy_ev_solar_floor_on_minutes:
    name: Energy EV Solar Floor On Minutes
    min: 0
    max: 60
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 5

  energy_ev_solar_floor_off_minutes:
    name: Energy EV Solar Floor Off Minutes
    min: 0
    max: 60
    step: 1
    mode: box
    unit_of_measurement: min
    initial: 10

  energy_ev_soc_margin_percent:
    name: Energy EV SOC Margin
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: "%"
    initial: 5

  # Tariff rates
  energy_rate_import_ev:
    name: Energy Rate Import EV
    min: 0
    max: 2
    step: 0.00001
    mode: box
    unit_of_measurement: "$/kWh"
    initial: 0.30591

  energy_rate_import_shoulder:
    name: Energy Rate Import Shoulder
    min: 0
    max: 2
    step: 0.00001
    mode: box
    unit_of_measurement: "$/kWh"
    initial: 0.30591

  energy_rate_import_offpeak:
    name: Energy Rate Import Offpeak
    min: 0
    max: 2
    step: 0.00001
    mode: box
    unit_of_measurement: "$/kWh"
    initial: 0.26213

  energy_rate_import_peak:
    name: Energy Rate Import Peak
    min: 0
    max: 2
    step: 0.00001
    mode: box
    unit_of_measurement: "$/kWh"
    initial: 0.56133

  energy_rate_export:
    name: Energy Rate Export
    min: 0
    max: 2
    step: 0.00001
    mode: box
    unit_of_measurement: "$/kWh"
    initial: 0.10

  energy_rate_ev_credit:
    name: Energy Rate EV Credit
    min: 0
    max: 2
    step: 0.00001
    mode: box
    unit_of_measurement: "$/kWh"
    initial: 0.10

  energy_rate_supply_daily:
    name: Energy Rate Supply Daily
    min: 0
    max: 10
    step: 0.00001
    mode: box
    unit_of_measurement: "$/day"
    initial: 1.16666

  # Legacy display helpers only; native Solcast now enforces its shared 8-call daily API budget.
  energy_solcast_api_calls_today:
    name: Energy Solcast Legacy API Calls Today
    min: 0
    max: 50
    step: 1
    mode: box
    initial: 0

  energy_solcast_api_daily_limit:
    name: Energy Solcast API Daily Limit
    min: 1
    max: 50
    step: 1
    mode: box
    initial: 8

  energy_solcast_sites_per_refresh:
    name: Energy Solcast Sites Per Refresh
    min: 1
    max: 4
    step: 1
    mode: box
    initial: 2

  energy_solcast_refresh_min_interval_minutes:
    name: Energy Solcast Refresh Min Interval
    min: 1
    max: 480
    step: 1
    mode: box
    initial: 360

  energy_solcast_inter_site_delay_seconds:
    name: Energy Solcast Inter Site Delay
    min: 1
    max: 60
    step: 1
    mode: box
    initial: 5

  # Unix epoch of last successful refresh; 0 = never refreshed
  energy_solcast_last_refresh_epoch:
    name: Energy Solcast Last Refresh Epoch
    min: 0
    max: 9999999999
    step: 1
    mode: box
    initial: 0

###############################################################################
# HELPERS - TIMES
###############################################################################

input_datetime:
  energy_time_ev_start:
    name: Energy Time EV Start
    has_date: false
    has_time: true

  energy_time_ev_end:
    name: Energy Time EV End
    has_date: false
    has_time: true

  energy_time_offpeak_start:
    name: Energy Time Offpeak Start
    has_date: false
    has_time: true

  energy_time_offpeak_end:
    name: Energy Time Offpeak End
    has_date: false
    has_time: true

  energy_time_peak_start:
    name: Energy Time Peak Start
    has_date: false
    has_time: true

  energy_time_peak_end:
    name: Energy Time Peak End
    has_date: false
    has_time: true

###############################################################################
# INITIALISER AUTOMATIONS FOR TIME HELPERS AND OVERRIDE RESET
###############################################################################

automation:
  - id: energy_reset_overnight_ev_fast_charge
    alias: Energy Reset Overnight EV Charging at 6am
    description: Re-enable overnight Fast charging each morning so turning the permission off skips one night.
    mode: single
    triggers:
      - trigger: time
        at: "06:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.energy_ev_allow_overnight_fast_charge
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energy_ev_allow_overnight_fast_charge

  - id: energy_initialise_time_helpers
    alias: Energy Initialise Time Helpers
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - if:
          - condition: template
            value_template: "{{ states('input_datetime.energy_time_ev_start') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_time_ev_start
            data:
              time: "00:00:00"

      - if:
          - condition: template
            value_template: "{{ states('input_datetime.energy_time_ev_end') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_time_ev_end
            data:
              time: "06:00:00"

      - if:
          - condition: template
            value_template: "{{ states('input_datetime.energy_time_offpeak_start') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_time_offpeak_start
            data:
              time: "11:00:00"

      - if:
          - condition: template
            value_template: "{{ states('input_datetime.energy_time_offpeak_end') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_time_offpeak_end
            data:
              time: "16:00:00"

      - if:
          - condition: template
            value_template: "{{ states('input_datetime.energy_time_peak_start') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_time_peak_start
            data:
              time: "16:00:00"

      - if:
          - condition: template
            value_template: "{{ states('input_datetime.energy_time_peak_end') in ['unknown', 'unavailable', ''] }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.energy_time_peak_end
            data:
              time: "21:00:00"

  - id: energy_reset_solcast_api_counter
    alias: Energy Reset Solcast API Counter
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.energy_solcast_api_calls_today
        data:
          value: 0


  - id: energy_update_house_load_expected_daily
    alias: Energy Update House Load Expected Daily
    mode: single
    triggers:
    - trigger: time
      at: 00:15:00
    - trigger: homeassistant
      event: start
    - trigger: template
      value_template: |-
        {% set a=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_ev_start'), none) %}
        {% set b=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_ev_end'), none) %}
        {% set ready_0 = a is not none and b is not none and a.hour*60+a.minute < b.hour*60+b.minute %}
        {% set a=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_ev_end'), none) %}
        {% set b=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_offpeak_start'), none) %}
        {% set ready_1 = a is not none and b is not none and a.hour*60+a.minute < b.hour*60+b.minute %}
        {% set raw_a=as_datetime(states('sensor.the_dennis_boys_sun_sunrise_start'), none) %}
        {% set raw_b=as_datetime(states('sensor.the_dennis_boys_sun_sunset_end'), none) %}
        {% set a=as_local(raw_a) if raw_a is not none and raw_a.tzinfo is not none else none %}
        {% set b=as_local(raw_b) if raw_b is not none and raw_b.tzinfo is not none else none %}
        {% set ready_2 = a is not none and b is not none and a.hour*60+a.minute < b.hour*60+b.minute %}
        {{ ready_0 and ready_1 and ready_2 }}
    actions:
    - wait_template: |-
        {% set a=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_ev_start'), none) %}
        {% set b=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_ev_end'), none) %}
        {% set ready_0 = a is not none and b is not none and a.hour*60+a.minute < b.hour*60+b.minute %}
        {% set a=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_ev_end'), none) %}
        {% set b=as_datetime('2000-01-01T' ~ states('input_datetime.energy_time_offpeak_start'), none) %}
        {% set ready_1 = a is not none and b is not none and a.hour*60+a.minute < b.hour*60+b.minute %}
        {% set raw_a=as_datetime(states('sensor.the_dennis_boys_sun_sunrise_start'), none) %}
        {% set raw_b=as_datetime(states('sensor.the_dennis_boys_sun_sunset_end'), none) %}
        {% set a=as_local(raw_a) if raw_a is not none and raw_a.tzinfo is not none else none %}
        {% set b=as_local(raw_b) if raw_b is not none and raw_b.tzinfo is not none else none %}
        {% set ready_2 = a is not none and b is not none and a.hour*60+a.minute < b.hour*60+b.minute %}
        {{ ready_0 and ready_1 and ready_2 and states.sensor.energy_house_load_daylight_expected_daily is not none and state_attr('sensor.energy_house_load_daylight_expected_daily','restored') != true and states.sensor.energy_house_load_ev_window_expected_daily is not none and state_attr('sensor.energy_house_load_ev_window_expected_daily','restored') != true and states.sensor.energy_house_load_shoulder_expected_daily is not none and state_attr('sensor.energy_house_load_shoulder_expected_daily','restored') != true }}
      timeout: 00:05:00
      continue_on_timeout: false
    - action: homeassistant.update_entity
      target:
        entity_id:
        - sensor.energy_house_load_daylight_expected_daily
        - sensor.energy_house_load_ev_window_expected_daily
        - sensor.energy_house_load_shoulder_expected_daily
        - sensor.energy_house_shoulder_shape
    description: At startup or when source bounds become valid, wait at most5minutes for valid bounds and real REST entities, then make one local
      Influx refresh. No periodic retry loop or external forecast request.
    max_exceeded: silent

  - id: energy_utility_meter_tariff_switcher
    alias: Energy Utility Meter Tariff Switcher
    mode: single
    triggers:
      # Follow the resolved tariff sensor so utility meters switch after
      # the template sensor has actually crossed the tariff boundary.
      - trigger: state
        entity_id: sensor.energy_current_tariff
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          tariff: "{{ states('sensor.energy_current_tariff') }}"
      - if:
          - condition: template
            value_template: "{{ tariff in ['ev', 'shoulder', 'offpeak', 'peak'] }}"
        then:
          - action: select.select_option
            target:
              entity_id:
                - select.energy_grid_import_daily
                - select.energy_grid_import_monthly
                - select.energy_ev_daily
                - select.energy_ev_monthly
            data:
              option: "{{ tariff }}"

  - id: energy_battery_session_admit
    alias: Energy Battery Admit One Overnight Session
    description: Qualifies and captures one immutable session; recovery owns attempts within the original60-second setup allowance.
    mode: single
    max_exceeded: silent
    triggers:
    - trigger: state
      entity_id: binary_sensor.energy_battery_should_grid_charge_overnight
      to: 'on'
      for: 00:03:00
    - trigger: state
      entity_id: sensor.energy_recovery_forecast_model_cache
    - trigger: time_pattern
      minutes: /1
    conditions:
    - condition: template
      value_template: |-
        {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
        {% set current_plan_authority=battery_plan_authority|as_function %}
        {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
        {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
        {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
        {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
        {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}
        {% set raw_plan = state_attr('sensor.energy_recovery_forecast_model_cache', 'model_data') %}
        {% set decoded_plan = raw_plan if raw_plan is mapping else raw_plan | from_json({}) if raw_plan is string else {} %}
        {% set plan = decoded_plan if decoded_plan is mapping else {} %}
        {% set start = plan.get('latest_start') | float if is_number(plan.get('latest_start')) else as_timestamp(plan.get('latest_start'), none) %}
        {% set end = plan.get('tariff_end') | float if is_number(plan.get('tariff_end')) else as_timestamp(plan.get('tariff_end'), none) %}
        {% set budget = plan.get('budget_kwh', plan.get('budget', plan.get('grid_topup_kwh'))) %}
        {% set duration = plan.get('charge_duration_h') %}
        {% set power = states('input_number.energy_overnight_battery_charge_power_w') %}
        {% set previous = states('input_text.energy_battery_charge_session') | from_json({}) %}
        {% set previous_window_ended = previous is mapping and previous.get('done') == true
          and is_number(previous.get('max_end')) and previous.max_end | float < as_timestamp(now()) %}
        {{ plan_authority_ok and plan is mapping and plan.get('ready') == true and plan.get('passive_target_met', true) == false and plan.get('passive_dominates_continuation',true)==false
          and has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))
         and 0 <= states('sensor.battery_level') | float <= 100
         and 0 <= as_timestamp(now()) - as_timestamp(states.sensor.battery_level.last_reported, 0) <= 180
         and is_number(states('sensor.energy_battery_soc'))
          and is_number(states('sensor.energy_battery_effective_capacity'))
          and is_number(plan.get('target_kwh'))
          and 0 <= states('sensor.energy_battery_soc') | float <= 100
          and states('sensor.energy_battery_effective_capacity') | float > 0
          and plan.target_kwh | float > 0
          and is_state('input_boolean.energy_disable_automation', 'off')
          and is_state('input_boolean.energy_allow_overnight_battery_charge', 'on')
          and is_state('input_boolean.sg_battery_control_armed', 'on')
          and is_state('input_boolean.sg_battery_stop_pending', 'off')
          and is_state('binary_sensor.energy_tariff_ev', 'on')
          and is_state('binary_sensor.energy_recovery_target_forecast_available', 'on')
          and (states('input_text.energy_battery_charge_session') == '' or previous_window_ended)
          and is_state('binary_sensor.energy_battery_should_grid_charge_overnight', 'on')
          and as_timestamp(now()) - as_timestamp(states.binary_sensor.energy_battery_should_grid_charge_overnight.last_changed, 0) >= 180
          and is_number(start) and is_number(end) and start <= as_timestamp(now()) < end - 60
          and is_number(budget) and budget | float > 0
          and is_number(duration) and duration | float > 0
          and is_number(plan.get('grid_power_kw')) and power | float(-1) == plan.grid_power_kw | float * 1000
          and is_number(power) and 0 < power | float <= 3000 and power | float == power | int
          and is_number(plan.get('target_soc')) and 0 < plan.target_soc | float <= 90
          and (states('input_text.sg_battery_manual_lease') | from_json({})).get('done', true)
          and plan.get('source_snapshot_id', '') | string | length > 0
          and states('sensor.energy_battery_soc') | float < plan.target_soc | float
          and states('sensor.energy_battery_soc') | float / 100 * states('sensor.energy_battery_effective_capacity') | float
              < plan.target_kwh | float }}
    actions:
    - variables:
        admitted_plan: '{{ state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'') }}'
        session_json: |-
          {% set raw_plan = state_attr('sensor.energy_recovery_forecast_model_cache', 'model_data') %}
          {% set decoded_plan = raw_plan if raw_plan is mapping else raw_plan | from_json({}) if raw_plan is string else {} %}
          {% set plan = decoded_plan if decoded_plan is mapping else {} %}
          {% set start = as_timestamp(now()) | int %}
          {% set max_end = plan.tariff_end | int if is_number(plan.tariff_end) else as_timestamp(plan.tariff_end) | int %}
          {% set power = (plan.grid_power_kw | float * 1000) | int %}
          {% set budget = plan.get('budget_kwh', plan.get('budget', plan.get('grid_topup_kwh'))) | float %}
          {% set duration = [plan.charge_duration_h | float * 3600, budget / (power / 1000) * 3600, [0, max_end - start - 60] | max] | min | int %}
          {% set end = [max_end, (start + 60 + duration) | int] | min %}
          {{ {'id': (plan.source_snapshot_id | string)[:24] ~ '-' ~ start,
            'start': start, 'end': end, 'max_end': max_end,
            'targetkwh': plan.target_kwh | float | round(3),
            'targetsoc': plan.target_soc | float | round(2), 'power': power,
            'budget': ((duration / 3600 * power / 1000 * 10000) | int) / 10000, 'dur': duration, 'done': false} | tojson | replace(', ', ',') | replace(': ', ':') }}
    - condition: template
      value_template: |-
        {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
        {% set current_plan_authority=battery_plan_authority|as_function %}
        {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
        {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
        {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
        {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
        {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}
        {{ plan_authority_ok }}
    - condition: template
      value_template: '{{ session_json | length <= 255 and (session_json | from_json({})).get(''end'', 0) > as_timestamp(now()) }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.energy_battery_charge_session
      data:
        value: '{{ session_json }}'
    - event: energy_battery_session_admitted
      continue_on_error: true
      event_data:
        session: '{{ session_json }}'
        plan: '{{ admitted_plan }}'
    - action: script.turn_on
      target:
        entity_id: script.energy_battery_reconcile
    - wait_template: |-
        {% set session = states('input_text.energy_battery_charge_session') | from_json({}) %}
        {% set ack = states('input_text.sg_battery_command_ack') | from_json({}) %}
