             and states('sensor.energy_ev_desired_mode') not in ['off', 'unknown', 'unavailable', 'none', 'None', ''] }}

  - triggers:
    - trigger: state
      entity_id:
      - input_text.energy_battery_charge_session
      - input_text.sg_battery_manual_lease
      - input_text.sg_battery_command_ack
      - input_text.sg_battery_control_result
      - input_boolean.sg_battery_control_armed
      - input_boolean.energy_allow_overnight_battery_charge
      - input_boolean.energy_disable_automation
      - input_boolean.sg_battery_stop_pending
      - binary_sensor.energy_state_battery_should_be_charging
      - binary_sensor.energy_tariff_ev
      - sensor.energy_recovery_forecast_model_cache
      - sensor.energy_battery_planning_health
      - sensor.battery_level
      - sensor.ems_mode_selection_raw
      - sensor.battery_forced_charge_discharge_cmd_raw
      - sensor.battery_forced_charge_discharge_power
      - sensor.battery_power_raw
      - script.sg_battery_command_owner
      - input_text.sg_battery_normal_confirmation
      - script.sg_battery_request
      - input_text.energy_battery_recovery
      - input_text.sg_battery_authority_epoch
      - script.energy_battery_reconcile
    - trigger: time_pattern
      seconds: /30
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
    variables:
      battery_diagnostic_json: |
        {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
        {% set current_plan_authority=battery_plan_authority|as_function %}
        {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
        {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
        {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
        {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
        {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}

        {% set stamp = as_timestamp(now()) %}
        {% set current_epoch=states('input_text.sg_battery_authority_epoch') %}
        {% set current_epoch_valid=has_value('input_text.sg_battery_authority_epoch') and current_epoch|length>0 %}
        {% set rr0=states('input_text.energy_battery_recovery')|from_json({}) %}
        {% set rr=rr0 if rr0 is mapping else {} %}
        {% set recovery_record_valid=has_value('input_text.energy_battery_recovery') and rr.get('phase') in ['idle','starting','retry_wait','stopping','stop_backoff','stop_escalated','confirmed','exhausted']
         and rr.get('id','') is string and rr.get('epoch') is string and is_number(rr.get('starts')) and is_number(rr.get('stops'))
         and 0 <= rr.starts|float <= 3 and rr.starts|float == rr.starts|int
         and 0 <= rr.stops|float and rr.stops|float == rr.stops|int
         and is_number(rr.get('next')) and rr.next|float >= 0 and is_number(rr.get('first')) and rr.first|float >= 0 %}
        {% set recovery_phase=rr.get('phase') if recovery_record_valid else 'unavailable' %}
        {% set recovery_start_attempts=rr.get('starts')|int if recovery_record_valid else none %}
        {% set recovery_stop_attempts=rr.get('stops')|int if recovery_record_valid else none %}
        {% set recovery_next=rr.get('next')|float if recovery_record_valid and rr.get('next')|float > 0 else none %}
        {% set recovery_first=rr.get('first')|float if recovery_record_valid and rr.get('first')|float > 0 else none %}

        {% set s0 = states('input_text.energy_battery_charge_session') | from_json({}) %}
        {% set m0 = states('input_text.sg_battery_manual_lease') | from_json({}) %}
        {% set a0 = states('input_text.sg_battery_command_ack') | from_json({}) %}
        {% set s = s0 if s0 is mapping else {} %}{% set m = m0 if m0 is mapping else {} %}{% set a = a0 if a0 is mapping else {} %}
        {% set plan0 = state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
        {% set p0 = plan0 | from_json({}) if plan0 is string else plan0 %}{% set plan = p0 if p0 is mapping else {} %}
        {% set ages = namespace(values={}) %}
        {% for e in ['sensor.battery_level','sensor.ems_mode_selection_raw','sensor.battery_forced_charge_discharge_cmd_raw','sensor.battery_forced_charge_discharge_power','sensor.battery_power_raw'] %}
         {% set reported = as_timestamp(states[e].last_reported,0) if states[e] is not none else 0 %}
         {% set age = (stamp-reported)|round(1) if reported>0 else none %}
         {% set ages.values = dict(ages.values, **{e:age}) %}
        {% endfor %}
        {% set soc = states('sensor.battery_level') | float if is_number(states('sensor.battery_level')) else none %}
        {% set soc_age = ages.values['sensor.battery_level'] %}
        {% set soc_fresh = soc is not none and 0<=soc<=100 and soc_age is not none and 0<=soc_age<=180 %}
        {% set ems = states('sensor.ems_mode_selection_raw') | int if is_number(states('sensor.ems_mode_selection_raw')) and states('sensor.ems_mode_selection_raw')|float==states('sensor.ems_mode_selection_raw')|int else none %}
        {% set cmd = states('sensor.battery_forced_charge_discharge_cmd_raw') | int if is_number(states('sensor.battery_forced_charge_discharge_cmd_raw')) and states('sensor.battery_forced_charge_discharge_cmd_raw')|float==states('sensor.battery_forced_charge_discharge_cmd_raw')|int else none %}
        {% set setting = states('sensor.battery_forced_charge_discharge_power') | float if is_number(states('sensor.battery_forced_charge_discharge_power')) else none %}
        {% set ra = [ages.values['sensor.ems_mode_selection_raw'],ages.values['sensor.battery_forced_charge_discharge_cmd_raw'],ages.values['sensor.battery_forced_charge_discharge_power']] %}
        {% set read_age = ra|max if none not in ra else none %}
        {% set reads_fresh = ems is not none and cmd is not none and setting is not none and none not in ra and ra|min>=0 and read_age<=180 %}
        {% set raw_power = states('sensor.battery_power_raw') | float if is_number(states('sensor.battery_power_raw')) else none %}
        {% set power_age = ages.values['sensor.battery_power_raw'] %}
        {% set power_fresh = raw_power is not none and power_age is not none and 0<=power_age<=60 %}
        {% set session_active = s.get('id') is string and s.get('id')|length>0 and not s.get('done',true) and is_number(s.get('start')) and is_number(s.get('end')) and s.start|float<=stamp<s.end|float %}
        {% set manual_active = m.get('id') is string and m.get('id')|length>0 and not m.get('done',true) and is_number(m.get('start')) and is_number(m.get('end')) and m.start|float<=stamp<m.end|float %}
        {% set authority = 'conflict' if session_active and manual_active else 'session' if session_active else 'manual' if manual_active else 'none' %}
        {% set lease = s if authority=='session' else m if authority=='manual' else {} %}
        {% set armed = is_state('input_boolean.sg_battery_control_armed','on') %}
        {% set allowed = is_state('input_boolean.energy_allow_overnight_battery_charge','on') %}
        {% set enabled = is_state('input_boolean.energy_disable_automation','off') %}
        {% set pending = is_state('input_boolean.sg_battery_stop_pending','on') %}
        {% set requested = is_state('binary_sensor.energy_state_battery_should_be_charging','on') %}
        {% set manual_op = m.get('op') if manual_active else none %}
        {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
        {% set manual_policy=battery_manual_permitted|as_function %}
        {% set manual_permitted = authority=='manual' and manual_policy(m) %}

        {% set automatic_permitted=authority=='session' and requested and plan_authority_ok and plan.get('ready')==true
         and plan.get('passive_target_met',true)==false and plan.get('passive_dominates_continuation',true)==false and armed and allowed and enabled and not pending and soc_fresh and soc<90
         and is_state('binary_sensor.energy_tariff_ev','on')
         and is_number(s.get('max_end')) and s.start|float<s.end|float<=s.max_end|float
         and is_number(s.get('power')) and 0<s.power|float<=3000 and s.power|float==s.power|int
         and is_number(s.get('budget')) and s.budget|float>0
         and is_number(s.get('targetkwh')) and s.targetkwh|float>0
         and is_number(s.get('targetsoc')) and 0<s.targetsoc|float<=90
         and is_number(states('sensor.energy_battery_effective_capacity')) and states('sensor.energy_battery_effective_capacity')|float>0
         and is_number(plan.get('stop_target_kwh',plan.get('target_kwh')))
         and not (a.get('id')==s.get('id') and a.get('status')=='failed') %}
        {% if automatic_permitted %}
         {% set current_stored=soc/100*states('sensor.energy_battery_effective_capacity')|float %}
         {% set current_stop=[s.targetkwh|float,plan.get('stop_target_kwh',plan.get('target_kwh'))|float,states('sensor.energy_battery_effective_capacity')|float*0.9]|min %}
         {% set automatic_permitted=current_stored<current_stop %}
        {% endif %}
        {% set desired = 'charge' if automatic_permitted else manual_op if manual_permitted else 'normal' %}
        {% set request_w = lease.get('power') if is_number(lease.get('power')) else none %}
        {% set low_power_threshold_w = [100, request_w|float*0.2]|min if is_number(request_w) and request_w|float>0 else 100 %}
        {% set actual = 'unknown' if not reads_fresh else 'normal' if ems==0 and cmd==204 else 'charge' if ems==2 and cmd==170 else 'discharge' if ems==2 and cmd==187 else 'bypass' if ems==2 and cmd==204 else 'inconsistent' %}
        {% set observed_forced = ems==2 or cmd in [170,187] %}
        {% set ack_attempt_current=current_epoch_valid and a.get('epoch') == current_epoch and ((authority == 'manual' and a.get('attempt') == 1) or (authority == 'session' and recovery_record_valid and rr.get('id') == s.get('id') and rr.get('epoch') == current_epoch and rr.get('phase') in ['starting','confirmed'] and a.get('attempt') == rr.get('starts'))) %}
        {% set ack_matches = ack_attempt_current and authority in ['session','manual'] and a.get('id')==lease.get('id') and a.get('authority')==authority and a.get('op')==desired and a.get('power')==request_w and a.get('status')=='confirmed' and is_number(a.get('ts')) and is_number(a.get('started')) and lease.start|float<=a.started|float<=a.ts|float and (authority!='session' or a.ts|float<=lease.start|float+60) %}
        {% set owner_running = is_state('script.sg_battery_command_owner','on') %}
        {% set result = states('input_text.sg_battery_control_result') %}
        {% set result_reported = as_timestamp(states.input_text.sg_battery_control_result.last_reported,0) if states.input_text.sg_battery_control_result is not none else 0 %}
        {% set owner_age = stamp-result_reported if result_reported>0 else none %}
        {% set refresh_running=owner_running and authority=='manual' and lease.get('kind')=='target'
          and result.startswith('Refreshing:') and owner_age is not none and 0<=owner_age<=60 %}
        {% set preparing = (owner_running and authority in ['session','manual'] and desired!='normal' and stamp-lease.start|float<=60) or refresh_running %}
        {% set stopping = pending and owner_running and (result.startswith('Running: normal') or result.startswith('Running: stage')) and owner_age is not none and 0<=owner_age<=60 %}
        {% set readback_matches = reads_fresh and actual==desired and (desired=='normal' or setting==request_w) %}
        {% set recovery_labels={
         'idle':'Reconciliation is ready; no retry is pending.',
         'starting':'A bounded start attempt is in progress.',
         'retry_wait':'Waiting before another pre-enable start attempt; current authority will be checked again.',
         'stopping':'Normal/Stop is being requested and freshly verified.',
         'stop_backoff':'Stop remains pending; another attempt is scheduled.',
         'stop_escalated':'Stop is still unconfirmed; slower retries continue until verified.',
         'confirmed':'The last recovery transaction was confirmed; current feedback is checked separately.',
         'exhausted':'Start retries are closed for this captured request.',
         'unavailable':'Recovery state is missing or invalid; current operation cannot be inferred from it.'} %}
        {% set recovery_summary=recovery_labels.get(recovery_phase,recovery_labels.unavailable) %}
        {% if pending and recovery_phase not in ['stopping','stop_backoff','stop_escalated'] %}
         {% set recovery_summary='Stop is pending; the controller must verify Normal/Stop before any further start.' %}
        {% endif %}
        {% set recovery_summary=recovery_summary ~ (' Start attempts: ' ~ recovery_start_attempts ~ '/3; Stop attempts: ' ~ recovery_stop_attempts ~ '.' if recovery_record_valid else '') %}
        {% if recovery_next is not none and recovery_phase in ['retry_wait','stop_backoff','stop_escalated'] %}
         {% set recovery_summary=recovery_summary ~ (' Next attempt in ' ~ ([0,recovery_next-stamp]|max|round(0)|int) ~ ' s.' if recovery_next>=stamp else ' Next attempt is due; waiting for reconciliation.') %}
        {% endif %}


        {% set nr0=states('input_text.sg_battery_normal_confirmation')|from_json({}) %}
        {% set nr=nr0 if nr0 is mapping else {} %}
        {% set nr_now=as_timestamp(now()) %}
        {% set nr_numeric=is_number(nr.get('confirmed_at')) and is_number(nr.get('read_after')) %}
        {% set nr_valid=has_value('input_text.sg_battery_normal_confirmation')
         and state_attr('input_text.sg_battery_normal_confirmation','restored') != true
         and has_value('input_text.sg_battery_authority_epoch') and states('input_text.sg_battery_authority_epoch')|length > 0 and nr.get('epoch') == states('input_text.sg_battery_authority_epoch') and nr.get('v') == 1 and nr.get('status') == 'confirmed' and nr.get('operation') in ['normal','stage']
         and nr.get('ems') == 0 and nr.get('command') == 204 and nr_numeric
         and 0 < nr.read_after|float <= nr.confirmed_at|float <= nr_now
         and nr_now-nr.confirmed_at|float <= 180
         and is_state('script.sg_battery_command_owner','off')
         and is_state('script.sg_battery_request','off')
         and is_state('input_boolean.sg_battery_stop_pending','off')
         and states('input_text.sg_battery_control_result').startswith('Confirmed: self-consumption') %}
        {% set nr_ems=states.sensor.ems_mode_selection_raw %}{% set nr_cmd=states.sensor.battery_forced_charge_discharge_cmd_raw %}
        {% set nr_valid=nr_valid and nr_ems is not none and nr_cmd is not none
         and has_value('sensor.ems_mode_selection_raw') and is_number(states('sensor.ems_mode_selection_raw')) and states('sensor.ems_mode_selection_raw')|float == 0
         and has_value('sensor.battery_forced_charge_discharge_cmd_raw') and is_number(states('sensor.battery_forced_charge_discharge_cmd_raw')) and states('sensor.battery_forced_charge_discharge_cmd_raw')|float == 204
         and nr.read_after|float <= as_timestamp(nr_ems.last_reported,0) <= nr_now
         and nr.read_after|float <= as_timestamp(nr_cmd.last_reported,0) <= nr_now
         and nr_now-as_timestamp(nr_ems.last_reported,0) <= 180 and nr_now-as_timestamp(nr_cmd.last_reported,0) <= 180 %}
        {% if nr_valid and nr.operation == 'stage' %}
         {% set nr_power=states.sensor.battery_forced_charge_discharge_power %}
         {% set nr_valid=is_number(nr.get('power_w')) and 1 <= nr.power_w|float <= 3000 and nr.power_w|float == nr.power_w|int
          and nr_power is not none and has_value('sensor.battery_forced_charge_discharge_power') and is_number(nr_power.state)
          and nr_power.state|float == nr.power_w|float and nr.read_after|float <= as_timestamp(nr_power.last_reported,0) <= nr_now
          and nr_now-as_timestamp(nr_power.last_reported,0) <= 180 %}
        {% endif %}
        {% set owner_normal_confirmed = reads_fresh and actual=='normal' and nr_valid %}
        {% set failed_current = current_epoch_valid and a.get('epoch') == current_epoch and authority in ['session','manual'] and a.get('id')==lease.get('id') and a.get('status')=='failed' and ((authority=='manual' and a.get('attempt') == 1) or (authority=='session' and recovery_record_valid and rr.get('id')==s.get('id') and rr.get('epoch') == current_epoch and a.get('attempt') == rr.get('starts'))) %}
        {% set blocks = namespace(values=[]) %}
        {% if not enabled %}{% set blocks.values=blocks.values+['automation_disabled'] %}{% endif %}
        {% if not allowed %}{% set blocks.values=blocks.values+['overnight_charge_not_allowed'] %}{% endif %}
        {% if not armed %}{% set blocks.values=blocks.values+['controller_disarmed'] %}{% endif %}
        {% if not plan_authority_ok %}{% set blocks.values=blocks.values+['planning_inputs_unusable'] %}{% endif %}
        {% if not soc_fresh %}{% set blocks.values=blocks.values+['direct_soc_stale_or_unavailable'] %}{% endif %}
        {% if not reads_fresh %}{% set blocks.values=blocks.values+['register_feedback_stale_or_unavailable'] %}{% endif %}
        {% set n=namespace(health='healthy',code='self_consumption',fault='none',reason='Self-consumption observed; no forced operation requested.',alert=false) %}
        {% if pending %}
         {% set n.health='fault' %}{% set n.code='stop_unconfirmed' %}{% set n.fault='stop_unconfirmed' %}{% set n.reason='Stop remains unconfirmed. ' ~ recovery_summary %}{% set n.alert=true %}
        {% elif authority=='conflict' %}
         {% set n.health='fault' %}{% set n.code='authority_conflict' %}{% set n.fault='command' %}{% set n.reason='Automatic and manual session records overlap; ownership is ambiguous.' %}{% set n.alert=true %}
        {% elif requested and authority!='session' %}
         {% set n.health='fault' %}{% set n.code='intent_without_session' %}{% set n.fault='command' %}{% set n.reason='Automatic charging intent has no matching active captured session.' %}{% set n.alert=true %}
        {% elif not reads_fresh or not soc_fresh %}
         {% set n.health='unknown' %}{% set n.code='telemetry_unavailable' %}{% set n.fault='telemetry' %}{% set n.reason='Current battery control cannot be verified: direct SOC or mode/power feedback is stale or unavailable.' %}{% set n.alert=authority!='none' or observed_forced or armed %}
        {% elif observed_forced and desired=='normal' %}
         {% set n.health='fault' %}{% set n.code='unexpected_forced_mode' %}{% set n.fault='unexpected_forced' %}{% set n.reason='Forced inverter mode or command remains set without current permission, even if battery power is zero.' %}{% set n.alert=true %}
        {% elif failed_current %}
         {% set n.health='fault' %}{% set n.code='owner_failed' %}{% set n.fault='command' %}{% set n.reason='The owner reported failure for this captured session. ' ~ recovery_summary %}{% set n.alert=true %}
        {% elif preparing %}
         {% set n.health='preparing' %}{% set n.code='command_preparing' %}{% set n.reason='Captured request is being staged; final acknowledgement is not yet confirmed.' %}
        {% elif desired!='normal' and not ack_matches %}
         {% set n.health='fault' %}{% set n.code='ack_missing_or_mismatched' %}{% set n.fault='command' %}{% set n.reason='Active request lacks a matching owner acknowledgement for its session, operation and captured power.' %}{% set n.alert=true %}
        {% elif desired!='normal' and not readback_matches %}
         {% set n.health='fault' %}{% set n.code='command_readback_mismatch' %}{% set n.fault='command' %}{% set n.reason='Fresh inverter mode, command or power setting differs from the captured request.' %}{% set n.alert=true %}
        {% elif desired in ['charge','discharge'] and not power_fresh %}
         {% set n.health='unknown' %}{% set n.code='actual_power_unavailable' %}{% set n.fault='telemetry' %}{% set n.reason='Command acknowledgement matches, but current battery power telemetry is stale or unavailable.' %}{% set n.alert=true %}
        {% elif desired in ['charge','discharge'] and (lease.get('kind')!='target' or lease.get('target')!=100 or soc<95) and raw_power|abs<low_power_threshold_w and stamp-lease.start|float>120 %}
         {% set n.health='fault' %}{% set n.code='command_no_power' %}{% set n.fault='command' %}{% set n.reason='Command is acknowledged and its setting matches, but battery power remains below ' ~ (low_power_threshold_w|round(1)|string) ~ ' W after two minutes.' %}{% set n.alert=true %}
        {% elif desired!='normal' %}
         {% set n.code='command_verified' %}{% set n.reason='Captured request and owner acknowledgement match fresh inverter settings; actual battery power is reported separately.' %}
        {% elif actual!='normal' %}
         {% set n.health='fault' %}{% set n.code='unexpected_register_state' %}{% set n.fault='command' %}{% set n.reason='Fresh mode and command registers are inconsistent with self-consumption/Stop.' %}{% set n.alert=true %}
        {% elif not armed or not allowed or not enabled %}
         {% set n.health='blocked' %}{% set n.code='charging_disabled' %}{% set n.reason='Self-consumption observed; automatic grid charging is disabled or disarmed.' %}
        {% elif not plan_authority_ok %}
         {% set n.health='blocked' %}{% set n.code='planning_blocked' %}{% set n.reason='Self-consumption observed; battery planning inputs or forecast provenance are not usable.' %}
        {% elif not is_state('binary_sensor.energy_tariff_ev','on') %}
         {% set n.code='waiting_tariff' %}{% set n.reason='Self-consumption observed; waiting for the overnight tariff window.' %}
        {% elif plan.get('passive_target_met',false) %}
         {% set n.code='no_grid_topup_needed' %}{% set n.reason='Self-consumption observed; the passive forecast trajectory meets the battery target.' %}
        {% elif plan.get('passive_dominates_continuation',false) %}
         {% set n.code='passive_outcome_better' %}{% set n.reason='Self-consumption observed; the forecast passive outcome equals or exceeds the upper bound for continuing grid charging.' %}
         {% else %}
         {% set n.code='waiting_admission' %}{% set n.reason='Self-consumption observed; waiting for the planned start and continuous qualification.' %}
        {% endif %}
        {{ {
         'as_of':now().isoformat(),'as_of_epoch':stamp,'health':n.health,'status_code':n.code,'fault_class':n.fault,'reason':n.reason,'alert_required':n.alert,
         'authority':authority,'session_id':lease.get('id'),'session_active':session_active,'manual_active':manual_active,
         'desired_operation':desired,'automatic_permitted':automatic_permitted,'current_plan_authority_ok':plan_authority_ok,'desired_session_charge':requested,'requested_power_w':request_w,'deadline':lease.get('end'),'captured_target_kwh':lease.get('targetkwh'),'captured_budget_kwh':lease.get('budget'),
         'raw_ems_mode':ems,'raw_forced_command':cmd,'raw_power_setting_w':setting,'actual_operation':actual,'readback_matches':readback_matches,'owner_normal_confirmed':owner_normal_confirmed,
         'ack_status':a.get('status'),'ack_matches':ack_matches,'ack_session_id':a.get('id'),'ack_authority':a.get('authority'),'ack_operation':a.get('op'),'ack_power_w':a.get('power'),'ack_confirmed_at':a.get('ts'),'command_started_at':a.get('started'),
         'owner_running':owner_running,'owner_result':result,'owner_result_reported_at':result_reported if result_reported>0 else none,
         'owner_normal_confirmed_at':nr.get('confirmed_at') if nr_numeric else none,'owner_normal_receipt':nr,
         'soc_pct':soc,'soc_age_s':soc_age,'readback_age_s':read_age,'readback_ages_s':ages.values,'telemetry_fresh':soc_fresh and reads_fresh,
         'actual_battery_power_raw_w':raw_power,'actual_power_age_s':power_age,'actual_power_fresh':power_fresh,'low_power_threshold_w':low_power_threshold_w,'actual_power_note':'Direct raw magnitude; sign/direction remains firmware-dependent and is not inferred from the command setting.',
         'pending_stop':pending,'controller_armed':armed,'overnight_charge_allowed':allowed,'automation_enabled':enabled,'block_reasons':blocks.values,'retries':'bounded starts; persistent Stop','recovery_state':recovery_phase,
         'recovery_session_id':rr.get('id') if recovery_record_valid else none,'recovery_record_valid':recovery_record_valid,
         'start_attempts':recovery_start_attempts,'stop_attempts':recovery_stop_attempts,
         'recovery_next_attempt_epoch':recovery_next,'recovery_first_attempt_epoch':recovery_first,
         'recovery_escalated':recovery_phase=='stop_escalated','recovery_summary':recovery_summary,
         'authority_epoch':current_epoch if current_epoch_valid else none,'ack_attempt':a.get('attempt'),'ack_epoch':a.get('epoch'),
         'planning_health':states('sensor.energy_battery_planning_health'),'plan_as_of':plan.get('plan_as_of'),'source_snapshot_id':plan.get('source_snapshot_id'),
         'power_time_budget_note':'Captured power/time bound, not a measured grid-energy cutoff.'
         } | tojson }}
