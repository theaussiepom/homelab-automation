        {{ state_attr('sensor.energy_solcast_ne_forecasts', 'forecasts') is not none
           and state_attr('sensor.energy_solcast_sw_forecasts', 'forecasts') is not none }}
      state: |
        {% set tomorrow = (now() + timedelta(days=1)).date() %} {% set ne = state_attr('sensor.energy_solcast_ne_forecasts', 'forecasts') | default([], true) %} {% set sw = state_attr('sensor.energy_solcast_sw_forecasts', 'forecasts') | default([], true) %} {% set ns = namespace(best_p=-1, start='unknown', end='unknown') %} {% set max_len = [ne | count, sw | count] | max %} {% for i in range(max_len) %}
          {% set ne_i = ne[i] if i < (ne | count) else {} %}
          {% set sw_i = sw[i] if i < (sw | count) else {} %}
          {% set dt_end = as_local(as_datetime(ne_i.period_end if ne_i.period_end is defined else sw_i.period_end if sw_i.period_end is defined else now().isoformat())) %}
          {% if dt_end.date() == tomorrow %}
            {% set p = (ne_i.pv_estimate | float(0)) + (sw_i.pv_estimate | float(0)) %}
            {% if p > ns.best_p %}
              {% set dt_start = dt_end - timedelta(minutes=30) %}
              {% set ns.best_p = p %}
              {% set ns.start = dt_start.strftime('%H:%M') %}
              {% set ns.end = dt_end.strftime('%H:%M') %}
            {% endif %}
          {% endif %}
        {% endfor %} {{ ns.start }}
      attributes:
        end: |
          {% set tomorrow = (now() + timedelta(days=1)).date() %} {% set ne = state_attr('sensor.energy_solcast_ne_forecasts', 'forecasts') | default([], true) %} {% set sw = state_attr('sensor.energy_solcast_sw_forecasts', 'forecasts') | default([], true) %} {% set ns = namespace(best_p=-1, start='unknown', end='unknown') %} {% set max_len = [ne | count, sw | count] | max %} {% for i in range(max_len) %}
            {% set ne_i = ne[i] if i < (ne | count) else {} %}
            {% set sw_i = sw[i] if i < (sw | count) else {} %}
            {% set dt_end = as_local(as_datetime(ne_i.period_end if ne_i.period_end is defined else sw_i.period_end if sw_i.period_end is defined else now().isoformat())) %}
            {% if dt_end.date() == tomorrow %}
              {% set p = (ne_i.pv_estimate | float(0)) + (sw_i.pv_estimate | float(0)) %}
              {% if p > ns.best_p %}
                {% set dt_start = dt_end - timedelta(minutes=30) %}
                {% set ns.best_p = p %}
                {% set ns.start = dt_start.strftime('%H:%M') %}
                {% set ns.end = dt_end.strftime('%H:%M') %}
              {% endif %}
            {% endif %}
          {% endfor %} {{ ns.end }}

  ###########################################################################
  # RECOVERY DAY ENERGY MODEL (Influx load profiles + single Solcast pass)
  # Namespace loops must run in state/attribute templates — not variables: blocks.
  ###########################################################################
  - trigger:
    - trigger: time_pattern
      minutes: /1
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id:
      - sensor.energy_solcast_planning_snapshot
      - sensor.energy_battery_soc
      - sensor.energy_battery_effective_capacity
      - sensor.energy_battery_reserved_backup_soc
      - sensor.energy_house_load_daylight_expected_daily
      - sensor.energy_house_load_ev_window_expected_daily
      - sensor.energy_house_load_shoulder_expected_daily
      - sensor.energy_house_shoulder_shape
      - input_number.energy_battery_reserve_target_kwh
      - input_number.energy_overnight_battery_charge_power_w
      - input_datetime.energy_time_ev_start
      - input_datetime.energy_time_ev_end
      - input_datetime.energy_time_offpeak_start
      - sensor.the_dennis_boys_sun_sunrise_start
      - sensor.the_dennis_boys_sun_sunset_end
    - trigger: state
      entity_id: input_text.energy_solcast_refresh_observation
    sensor:
    - name: Energy Recovery Forecast Model Cache
      unique_id: energy_recovery_forecast_model_cache
      unit_of_measurement: kWh
      device_class: energy
      state: |-
        {% from 'energy_battery_planner.jinja' import battery_plan %}
        {% set calculate=battery_plan|as_function %}
        {% from 'energy_house_profile.jinja' import shoulder_shape %}
        {% set select_shape=shoulder_shape|as_function %}
        {% set shape_entity=states.sensor.energy_house_shoulder_shape %}
        {% set shape_attributes=shape_entity.attributes if shape_entity is not none else {} %}
        {% set shape=dict(applied=false,weights=[],status='flat_fallback',reason='planning_input_unavailable') %}
        {% set snapshot='sensor.energy_solcast_planning_snapshot' %}
        {% set rows=state_attr(snapshot,'rows')|default([],true) %}
        {% set source_ts=as_timestamp(state_attr(snapshot,'source_generation_utc'),0) %}
        {% set snapshot_id=state_attr(snapshot,'snapshot_id') %}
        {% set t=as_timestamp(now()) %}
        {% set inputs=[states('sensor.energy_house_load_ev_window_expected_daily'),states('sensor.energy_house_load_shoulder_expected_daily'),states('sensor.energy_house_load_daylight_expected_daily'),states('sensor.energy_battery_effective_capacity'),states('sensor.energy_battery_soc'),states('sensor.energy_battery_reserved_backup_soc'),states('input_number.energy_battery_reserve_target_kwh'),states('input_number.energy_overnight_battery_charge_power_w')] %}
        {% set ns=namespace(numbers=true) %}
        {% for value in inputs %}{% if not is_number(value) %}{% set ns.numbers=false %}{% endif %}{% endfor %}
        {% set times_ok=has_value('input_datetime.energy_time_ev_start') and has_value('input_datetime.energy_time_ev_end') and has_value('input_datetime.energy_time_offpeak_start') and has_value('sensor.the_dennis_boys_sun_sunrise_start') and has_value('sensor.the_dennis_boys_sun_sunset_end') %}
        {% set forecast_ok=is_state(snapshot,'accepted') and state_attr(snapshot,'provenance_status')=='proved_native_cycle' and 0<=t-source_ts<=86400 and state_attr(snapshot,'interval_seconds')==1800 %}
        {% set result=dict(valid=false,ready=false,usable_inputs=false,invalid_reason='planning_input_unavailable',source_snapshot_id=snapshot_id,source_generation_utc=state_attr(snapshot,'source_generation_utc')) %}
        {% if times_ok and ns.numbers %}
          {% set start=today_at(states('input_datetime.energy_time_ev_start')) %}
          {% set finish=today_at(states('input_datetime.energy_time_ev_end')) %}
          {% set shoulder=today_at(states('input_datetime.energy_time_offpeak_start')) %}
          {# Existing profiles currently support the established same-day 00:00–06:00–11:00 order. #}
          {% set order_ok=start<finish<shoulder %}
          {% if t>=as_timestamp(finish) %}
            {% set start=start+timedelta(days=1) %}{% set finish=finish+timedelta(days=1) %}{% set shoulder=shoulder+timedelta(days=1) %}
          {% endif %}
          {% set offset=(finish.date()-now().date()).days %}
