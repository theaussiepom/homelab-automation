      availability: |
        {% set polled = as_timestamp(states('sensor.solcast_pv_forecast_api_last_polled'), 0) %} {{ polled > 0 and 0 <= as_timestamp(now()) - polled < 86400 and has_value('sensor.solcast_pv_forecast_power_now') }}
      state: |
        {% set v = states('sensor.solcast_pv_forecast_power_now') | float(0) %} {{ (v / 1000 if state_attr('sensor.solcast_pv_forecast_power_now', 'unit_of_measurement') == 'W' else v) | round(3) }}
    - name: Energy Solar Forecast Next Half Hour
      unique_id: energy_solar_forecast_next_half_hour
      unit_of_measurement: kWh
      device_class: energy
      availability: |
        {{ is_state('binary_sensor.energy_state_forecast_available', 'on') }}
      state: |
        {% set start = as_timestamp(now()) %} {% set finish = start + 1800 %} {% set ns = namespace(total=0) %} {% for entity in ['sensor.energy_solcast_ne_forecasts','sensor.energy_solcast_sw_forecasts'] %}
          {% for row in state_attr(entity, 'forecasts') | default([], true) %}
