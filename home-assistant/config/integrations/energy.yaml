      unique_id: energy_state_battery_should_be_discharging
      state: |
        {% set sun_down = is_state('sun.sun', 'below_horizon') %} {% set battery_available = states('sensor.energy_battery_available_energy') | float(0) > 1.0 %} {% set house_importing = states('sensor.sh10rs_a2392201672_purchased_power') | float(0) > 0.3 %} {% set ev_window = is_state('binary_sensor.energy_tariff_ev', 'on') %} {{ sun_down and battery_available and house_importing and not ev_window }}
    - name: Energy State Battery Is Discharging
      unique_id: energy_state_battery_is_discharging
      state: |
        {{ states('sensor.sh10rs_a2392201672_battery_discharging_power') | float(0) > 0.1 }}
    - name: Energy State Battery Is Charging
      unique_id: energy_state_battery_is_charging
      state: |
        {{ states('sensor.sh10rs_a2392201672_battery_charging_power') | float(0) > 0.1 }}
    - name: Energy State EV Should Be Charging
      unique_id: energy_state_ev_should_be_charging
      state: |
        {{ is_state('binary_sensor.energy_ev_plugged_in_and_allowed', 'on') }}
    - name: Energy State EV Is Charging
      unique_id: energy_state_ev_is_charging
      state: |
        {{ is_state('binary_sensor.energy_ev_is_charging', 'on') }}
    - name: Energy State Forecast Available
      unique_id: energy_state_forecast_available
      state: '{% set e=''sensor.energy_solcast_planning_snapshot'' %}{% set t=as_timestamp(now()) %}{% set generation=as_timestamp(state_attr(e,''source_generation_utc''),0)
        %}{{ is_state(e,''accepted'') and 0<=t-generation<=86400 and state_attr(e,''interval_seconds'')==1800 and (state_attr(e,''rows'')|default([],true)|count)>0
        and state_attr(e,''valid_from'')|float(0)<=t<state_attr(e,''valid_to'')|float(0) }}'
      attributes:
        source_snapshot_id: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'',''snapshot_id'') }}'
        source_generation_utc: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'',''source_generation_utc'') }}'
        age_rule: Original accepted source generation <=24h; copying cache does not refresh age
        coverage_rule: Accepted snapshot covers now; planner independently requires its full horizon
    - name: Energy State Tariff Utility Meter In Sync
      unique_id: energy_state_tariff_utility_meter_in_sync
      state: |
        {% set tariff = states('sensor.energy_current_tariff') %} {% set import_daily = states('select.energy_grid_import_daily') %} {% set import_monthly = states('select.energy_grid_import_monthly') %} {% set ev_daily = states('select.energy_ev_daily') %} {% set ev_monthly = states('select.energy_ev_monthly') %} {{ tariff == import_daily and tariff == import_monthly and tariff == ev_daily and tariff == ev_monthly }}
    - name: Energy State Cost Model Available
      unique_id: energy_state_cost_model_available
      state: |
        {% set daily = states('sensor.energy_cost_daily_net') %} {% set monthly = states('sensor.energy_cost_monthly_net') %} {{ daily not in ['unknown','unavailable','none','None',''] and monthly not in ['unknown','unavailable','none','None',''] }}

  ###########################################################################
  # FAULT ENTITIES
  ###########################################################################
  - binary_sensor:
    - name: Energy State Fault Battery Discharge Anomaly
      unique_id: energy_state_fault_battery_discharge_anomaly
      state: |
        {{ is_state('binary_sensor.energy_state_battery_should_be_discharging', 'on')
           and is_state('binary_sensor.energy_state_battery_is_discharging', 'off') }}
    - name: Energy State Fault Battery Charge Anomaly
      unique_id: energy_state_fault_battery_charge_anomaly
      state: |
        {{ is_state('binary_sensor.energy_state_battery_should_be_charging', 'on')
           and is_state('binary_sensor.energy_state_battery_is_charging', 'off') }}
    - name: Energy State Fault EV Charge Anomaly
      unique_id: energy_state_fault_ev_charge_anomaly
      state: |
        {% set should_charge = is_state('binary_sensor.energy_state_ev_should_be_charging', 'on') %} {% set is_charging = is_state('binary_sensor.energy_state_ev_is_charging', 'on') %} {{ (should_charge and not is_charging) or ((not should_charge) and is_charging) }}
    - name: Energy State Fault EV Peak Charge
      unique_id: energy_state_fault_ev_peak_charge
      state: |
        {{ is_state('binary_sensor.energy_tariff_peak', 'on')
           and is_state('binary_sensor.energy_state_ev_is_charging', 'on') }}
    - name: Energy State Fault EV Draining Battery
      unique_id: energy_state_fault_ev_draining_battery
      state: |
        {% set ev_charging = is_state('binary_sensor.energy_state_ev_is_charging', 'on') %} {% set unsafe = is_state('binary_sensor.energy_ev_divert_unsafe', 'on') %} {{ ev_charging and unsafe }}
    - name: Energy State Fault EV Mode Mismatch
      unique_id: energy_state_fault_ev_mode_mismatch
      state: |-
        {% set desired=states('sensor.energy_ev_desired_mode') %}
        {% set actual=states('sensor.energy_ev_actual_mode') %}
        {{ desired in ['off','eco_plus','eco','fast'] and actual in ['off','eco_plus','eco','fast'] and desired != actual }}
      delay_on: 00:02:00
      delay_off: 00:00:30
    - name: Energy State Fault Forecast Unavailable
      unique_id: energy_state_fault_forecast_unavailable
      state: |
        {{ is_state('input_boolean.energy_allow_overnight_battery_charge', 'on')
           and is_state('binary_sensor.energy_tariff_ev', 'on')
           and is_state('binary_sensor.energy_recovery_target_forecast_available', 'off') }}
    - name: Energy State Fault Tariff Mismatch
      unique_id: energy_state_fault_tariff_mismatch
      state: |
        {{ is_state('binary_sensor.energy_state_tariff_utility_meter_in_sync', 'off') }}
    - name: Energy State Fault Cost Model Invalid
      unique_id: energy_state_fault_cost_model_invalid
      state: |
        {{ is_state('binary_sensor.energy_state_cost_model_available', 'off') }}
    - name: Energy State Fault Night Grid Dependency
      unique_id: energy_state_fault_night_grid_dependency
      state: |
        {% set sun_down = is_state('sun.sun', 'below_horizon') %} {% set battery_available = states('sensor.energy_battery_available_energy') | float(0) > 1.0 %} {% set grid_import = states('sensor.sh10rs_a2392201672_purchased_power') | float(0) > 0.5 %} {% set battery_idle = is_state('binary_sensor.energy_state_battery_is_discharging', 'off') %} {{ sun_down and battery_available and grid_import and battery_idle }}
    - name: Energy State Fault Solar Unused
      unique_id: energy_state_fault_solar_unused
      state: |
        {% set solar = states('sensor.energy_solar_generation_power') | float(0) %} {% set battery_charging = is_state('binary_sensor.energy_state_battery_is_charging', 'on') %} {% set ev_charging = is_state('binary_sensor.energy_state_ev_is_charging', 'on') %} {% set exporting = states('sensor.sh10rs_a2392201672_total_export_active_power') | float(0) > 0.1 %} {{ solar > 1.5 and not battery_charging and not ev_charging and not exporting }}
    - name: Energy State Fault Battery Forced Charge Stuck
      unique_id: energy_state_fault_battery_forced_charge_stuck
      icon: mdi:battery-alert
      state: |
        {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
        {% set current_plan_authority=battery_plan_authority|as_function %}
        {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
        {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
        {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
        {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
        {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}

        {% set stamp = as_timestamp(now()) %}
        {% set s0 = states('input_text.energy_battery_charge_session') | from_json({}) %}
        {% set m0 = states('input_text.sg_battery_manual_lease') | from_json({}) %}
        {% set a0 = states('input_text.sg_battery_command_ack') | from_json({}) %}
        {% set s = s0 if s0 is mapping else {} %}{% set m = m0 if m0 is mapping else {} %}{% set a = a0 if a0 is mapping else {} %}
        {% set plan0 = state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
        {% set p0 = plan0 | from_json({}) if plan0 is string else plan0 %}{% set plan = p0 if p0 is mapping else {} %}
        {% set ages = namespace(values={}) %}
        {% for e in ['sensor.battery_level','sensor.ems_mode_selection_raw','sensor.battery_forced_charge_discharge_cmd_raw','sensor.battery_forced_charge_discharge_power','sensor.battery_power_raw'] %}
         {% set reported = as_timestamp(states[e].last_reported,0) if states[e] is not none else 0 %}
         {% set age = (stamp-reported)|round(1) if reported>0 else none %}
         {% set ages.values = dict(ages.values, **{e:age}) %}
        {% endfor %}
        {% set soc = states('sensor.battery_level') | float if is_number(states('sensor.battery_level')) else none %}
        {% set soc_age = ages.values['sensor.battery_level'] %}
        {% set soc_fresh = soc is not none and 0<=soc<=100 and soc_age is not none and 0<=soc_age<=180 %}
        {% set ems = states('sensor.ems_mode_selection_raw') | int if is_number(states('sensor.ems_mode_selection_raw')) and states('sensor.ems_mode_selection_raw')|float==states('sensor.ems_mode_selection_raw')|int else none %}
        {% set cmd = states('sensor.battery_forced_charge_discharge_cmd_raw') | int if is_number(states('sensor.battery_forced_charge_discharge_cmd_raw')) and states('sensor.battery_forced_charge_discharge_cmd_raw')|float==states('sensor.battery_forced_charge_discharge_cmd_raw')|int else none %}
        {% set setting = states('sensor.battery_forced_charge_discharge_power') | float if is_number(states('sensor.battery_forced_charge_discharge_power')) else none %}
        {% set ra = [ages.values['sensor.ems_mode_selection_raw'],ages.values['sensor.battery_forced_charge_discharge_cmd_raw'],ages.values['sensor.battery_forced_charge_discharge_power']] %}
        {% set read_age = ra|max if none not in ra else none %}
        {% set reads_fresh = ems is not none and cmd is not none and setting is not none and none not in ra and ra|min>=0 and read_age<=180 %}
        {% set raw_power = states('sensor.battery_power_raw') | float if is_number(states('sensor.battery_power_raw')) else none %}
        {% set power_age = ages.values['sensor.battery_power_raw'] %}
        {% set power_fresh = raw_power is not none and power_age is not none and 0<=power_age<=60 %}
        {% set session_active = s.get('id') is string and s.get('id')|length>0 and not s.get('done',true) and is_number(s.get('start')) and is_number(s.get('end')) and s.start|float<=stamp<s.end|float %}
        {% set manual_active = m.get('id') is string and m.get('id')|length>0 and not m.get('done',true) and is_number(m.get('start')) and is_number(m.get('end')) and m.start|float<=stamp<m.end|float %}
        {% set authority = 'conflict' if session_active and manual_active else 'session' if session_active else 'manual' if manual_active else 'none' %}
        {% set lease = s if authority=='session' else m if authority=='manual' else {} %}
        {% set armed = is_state('input_boolean.sg_battery_control_armed','on') %}
        {% set allowed = is_state('input_boolean.energy_allow_overnight_battery_charge','on') %}
        {% set enabled = is_state('input_boolean.energy_disable_automation','off') %}
        {% set pending = is_state('input_boolean.sg_battery_stop_pending','on') %}
        {% set requested = is_state('binary_sensor.energy_state_battery_should_be_charging','on') %}
        {% set manual_op = m.get('op') if manual_active else none %}
        {% from 'energy_battery_manual.jinja' import battery_manual_permitted %}
        {% set manual_policy=battery_manual_permitted|as_function %}
        {% set manual_permitted = authority=='manual' and manual_policy(m) %}

        {% set automatic_permitted=authority=='session' and requested and plan_authority_ok and plan.get('ready')==true
         and plan.get('passive_target_met',true)==false and plan.get('passive_dominates_continuation',true)==false and armed and allowed and enabled and not pending and soc_fresh and soc<90
         and is_state('binary_sensor.energy_tariff_ev','on')
         and is_number(s.get('max_end')) and s.start|float<s.end|float<=s.max_end|float
         and is_number(s.get('power')) and 0<s.power|float<=3000 and s.power|float==s.power|int
         and is_number(s.get('budget')) and s.budget|float>0
         and is_number(s.get('targetkwh')) and s.targetkwh|float>0
         and is_number(s.get('targetsoc')) and 0<s.targetsoc|float<=90
         and is_number(states('sensor.energy_battery_effective_capacity')) and states('sensor.energy_battery_effective_capacity')|float>0
         and is_number(plan.get('stop_target_kwh',plan.get('target_kwh')))
         and not (a.get('id')==s.get('id') and a.get('status')=='failed') %}
        {% if automatic_permitted %}
         {% set current_stored=soc/100*states('sensor.energy_battery_effective_capacity')|float %}
         {% set current_stop=[s.targetkwh|float,plan.get('stop_target_kwh',plan.get('target_kwh'))|float,states('sensor.energy_battery_effective_capacity')|float*0.9]|min %}
         {% set automatic_permitted=current_stored<current_stop %}
        {% endif %}

        {% set ems_text=states('sensor.ems_mode_selection')|lower %}{% set cmd_text=states('sensor.battery_forced_charge_discharge_cmd')|lower %}
        {% set forced = ems==2 or cmd in [170,187] or 'forced' in ems_text or 'forced charge' in cmd_text %}
        {{ forced and not (automatic_permitted or manual_permitted) }}

  ###########################################################################
  # HUMAN READABLE REASONS
  ###########################################################################
  - sensor:
    - name: Energy Battery Grid Charge Reason
      unique_id: energy_battery_grid_charge_reason
      icon: mdi:battery-clock
      state: '{{ state_attr(''sensor.energy_battery_control_health'',''reason'') or ''Battery control diagnostics are not available yet.'' }}'
      attributes:
        status_code: '{{ state_attr(''sensor.energy_battery_control_health'',''status_code'') }}'
        fault_class: '{{ state_attr(''sensor.energy_battery_control_health'',''fault_class'') }}'
        authority: '{{ state_attr(''sensor.energy_battery_control_health'',''authority'') }}'
        session_id: '{{ state_attr(''sensor.energy_battery_control_health'',''session_id'') }}'
        desired_operation: '{{ state_attr(''sensor.energy_battery_control_health'',''desired_operation'') }}'
        actual_operation: '{{ state_attr(''sensor.energy_battery_control_health'',''actual_operation'') }}'
        requested_power_w: '{{ state_attr(''sensor.energy_battery_control_health'',''requested_power_w'') }}'
        ack_matches: '{{ state_attr(''sensor.energy_battery_control_health'',''ack_matches'') }}'
        telemetry_fresh: '{{ state_attr(''sensor.energy_battery_control_health'',''telemetry_fresh'') }}'
        pending_stop: '{{ state_attr(''sensor.energy_battery_control_health'',''pending_stop'') }}'
        block_reasons: '{{ state_attr(''sensor.energy_battery_control_health'',''block_reasons'') }}'
        retries: '{{ state_attr(''sensor.energy_battery_control_health'',''retries'') }}'
        recovery_state: '{{ state_attr(''sensor.energy_battery_control_health'',''recovery_state'') }}'
        recovery_summary: '{{ state_attr(''sensor.energy_battery_control_health'',''recovery_summary'') }}'
        start_attempts: '{{ state_attr(''sensor.energy_battery_control_health'',''start_attempts'') }}'
        stop_attempts: '{{ state_attr(''sensor.energy_battery_control_health'',''stop_attempts'') }}'
    - name: Energy State Reason Battery Discharge Anomaly
      unique_id: energy_state_reason_battery_discharge_anomaly
      state: |
        {% if is_state('binary_sensor.energy_state_fault_battery_discharge_anomaly', 'off') %}
          ok
        {% elif states('sensor.energy_battery_available_energy') | float(0) <= 1.0 %}
          battery has insufficient available energy
        {% elif states('sensor.sh10rs_a2392201672_purchased_power') | float(0) > 0.3 %}
          battery should be discharging but grid is importing
        {% else %}
          battery should be discharging but is not
        {% endif %}
    - name: Energy State Reason Battery Charge Anomaly
      unique_id: energy_state_reason_battery_charge_anomaly
      state: |
        {% if is_state('binary_sensor.energy_state_fault_battery_charge_anomaly', 'off') %}
          ok
        {% elif is_state('binary_sensor.energy_battery_should_grid_charge_overnight', 'on') %}
          overnight grid charge requested but battery is not charging
        {% else %}
          battery should be charging but is not
        {% endif %}
    - name: Energy State Reason EV Charge Anomaly
      unique_id: energy_state_reason_ev_charge_anomaly
      state: |
        {% set should_charge = is_state('binary_sensor.energy_state_ev_should_be_charging', 'on') %} {% set is_charging = is_state('binary_sensor.energy_state_ev_is_charging', 'on') %} {% if is_state('binary_sensor.energy_state_fault_ev_charge_anomaly', 'off') %}
          ok
        {% elif should_charge and not is_charging %}
          EV should be charging but is not
        {% elif (not should_charge) and is_charging %}
          EV is charging when it should not be
        {% else %}
          EV charge state is inconsistent
        {% endif %}
    - name: Energy State Reason EV Peak Charge
      unique_id: energy_state_reason_ev_peak_charge
      state: |
        {% if is_state('binary_sensor.energy_state_fault_ev_peak_charge', 'off') %}
          ok
        {% else %}
          EV is charging during peak tariff
        {% endif %}
    - name: Energy State Reason EV Draining Battery
      unique_id: energy_state_reason_ev_draining_battery
      state: |
        {% if is_state('binary_sensor.energy_state_fault_ev_draining_battery', 'off') %}
          ok
        {% else %}
          EV is charging while divert is unsafe (battery feeding EV)
        {% endif %}
    - name: Energy State Reason EV Mode Mismatch
      unique_id: energy_state_reason_ev_mode_mismatch
      state: |
        {% if is_state('binary_sensor.energy_state_fault_ev_mode_mismatch', 'off') %}
          ok
        {% else %}
          desired mode {{ states('sensor.energy_ev_desired_mode') }} actual mode {{ states('sensor.energy_ev_actual_mode') }}
        {% endif %}
    - name: Energy State Reason Forecast Unavailable
      unique_id: energy_state_reason_forecast_unavailable
      state: '{% if is_state(''binary_sensor.energy_state_fault_forecast_unavailable'',''off'') %}ok{% else %}{{ state_attr(''sensor.energy_battery_planning_health'',''reason'')|default(''Battery
        planning inputs are unavailable.'',true) }}{% endif %}'
      attributes:
        planning_health: '{{ states(''sensor.energy_battery_planning_health'') }}'
        planning_reason_code: '{{ state_attr(''sensor.energy_battery_planning_health'',''reason_code'') }}'
        source_snapshot_id: '{{ state_attr(''sensor.energy_battery_planning_health'',''snapshot_id'') }}'
    - name: Energy State Reason Tariff Mismatch
      unique_id: energy_state_reason_tariff_mismatch
      state: |
        {% set tariff = states('sensor.energy_current_tariff') %} {% set import_daily = states('select.energy_grid_import_daily') %} {% set import_monthly = states('select.energy_grid_import_monthly') %} {% set ev_daily = states('select.energy_ev_daily') %} {% set ev_monthly = states('select.energy_ev_monthly') %} {% if is_state('binary_sensor.energy_state_fault_tariff_mismatch', 'off') %}
          ok
        {% else %}
          tariff mismatch current {{ tariff }} grid daily {{ import_daily }} grid monthly {{ import_monthly }} EV daily {{ ev_daily }} EV monthly {{ ev_monthly }}
        {% endif %}
    - name: Energy State Reason Cost Model Invalid
      unique_id: energy_state_reason_cost_model_invalid
      state: |
        {% set daily = states('sensor.energy_cost_daily_net') %} {% set monthly = states('sensor.energy_cost_monthly_net') %} {% if is_state('binary_sensor.energy_state_fault_cost_model_invalid', 'off') %}
          ok
        {% elif daily in ['unknown','unavailable','none','None',''] %}
          daily net cost is unavailable
        {% elif monthly in ['unknown','unavailable','none','None',''] %}
          monthly net cost is unavailable
        {% else %}
          cost model is invalid
        {% endif %}
    - name: Energy State Reason Night Grid Dependency
      unique_id: energy_state_reason_night_grid_dependency
      state: |
        {% if is_state('binary_sensor.energy_state_fault_night_grid_dependency', 'off') %}
          ok
        {% else %}
          house is importing from grid at night while battery has usable energy
        {% endif %}
    - name: Energy State Reason Solar Unused
      unique_id: energy_state_reason_solar_unused
      state: |
        {% if is_state('binary_sensor.energy_state_fault_solar_unused', 'off') %}
          ok
        {% else %}
          solar is available but it is not charging battery, charging EV, or exporting materially
        {% endif %}

  ###########################################################################
  # FAULT CLASSIFICATION
  # Aggregate fault signals for Node-RED — notify / recover / safe_stop tiers.
  # No delays, service calls, or actuation here; timing lives in Node-RED.
  ###########################################################################
  - binary_sensor:
      - name: Energy Fault Notify
        unique_id: energy_fault_notify
        icon: mdi:bell-alert
        state: >
          {{ is_state('binary_sensor.energy_state_fault_forecast_unavailable', 'on')
             or is_state('binary_sensor.energy_state_fault_tariff_mismatch', 'on')
             or is_state('binary_sensor.energy_state_fault_cost_model_invalid', 'on')
             or is_state('binary_sensor.energy_state_fault_night_grid_dependency', 'on')
             or is_state('binary_sensor.energy_state_fault_solar_unused', 'on') }}

      - name: Energy Fault Recover
        unique_id: energy_fault_recover
        icon: mdi:restore-alert
        state: >
          {{ is_state('binary_sensor.energy_state_fault_battery_charge_anomaly', 'on')
             or is_state('binary_sensor.energy_state_fault_battery_discharge_anomaly', 'on')
             or is_state('binary_sensor.energy_state_fault_ev_mode_mismatch', 'on') }}

      - name: Energy Fault Safe Stop
        unique_id: energy_fault_safe_stop
        icon: mdi:stop-circle-outline
        state: >
          {{ is_state('binary_sensor.energy_state_fault_ev_peak_charge', 'on')
             or is_state('binary_sensor.energy_state_fault_ev_draining_battery', 'on')
             or is_state('binary_sensor.energy_state_fault_battery_forced_charge_stuck', 'on') }}

  - sensor:
      - name: Energy Fault Primary Reason
        unique_id: energy_fault_primary_reason
        icon: mdi:text-box-check
        state: >
          {% if is_state('binary_sensor.energy_state_fault_ev_draining_battery', 'on') %}
            {{ states('sensor.energy_state_reason_ev_draining_battery') }}
          {% elif is_state('binary_sensor.energy_state_fault_ev_peak_charge', 'on') %}
            {{ states('sensor.energy_state_reason_ev_peak_charge') }}
          {% elif is_state('binary_sensor.energy_state_fault_battery_forced_charge_stuck', 'on') %}
            battery appears to be stuck in forced charge mode
          {% elif is_state('binary_sensor.energy_state_fault_battery_charge_anomaly', 'on') %}
            {{ states('sensor.energy_state_reason_battery_charge_anomaly') }}
          {% elif is_state('binary_sensor.energy_state_fault_ev_mode_mismatch', 'on') %}
            {{ states('sensor.energy_state_reason_ev_mode_mismatch') }}
          {% elif is_state('binary_sensor.energy_state_fault_battery_discharge_anomaly', 'on') %}
            {{ states('sensor.energy_state_reason_battery_discharge_anomaly') }}
          {% elif is_state('binary_sensor.energy_state_fault_forecast_unavailable', 'on') %}
            {{ states('sensor.energy_state_reason_forecast_unavailable') }}
          {% elif is_state('binary_sensor.energy_state_fault_tariff_mismatch', 'on') %}
            {{ states('sensor.energy_state_reason_tariff_mismatch') }}
          {% elif is_state('binary_sensor.energy_state_fault_cost_model_invalid', 'on') %}
            {{ states('sensor.energy_state_reason_cost_model_invalid') }}
          {% elif is_state('binary_sensor.energy_state_fault_night_grid_dependency', 'on') %}
            {{ states('sensor.energy_state_reason_night_grid_dependency') }}
          {% elif is_state('binary_sensor.energy_state_fault_solar_unused', 'on') %}
            {{ states('sensor.energy_state_reason_solar_unused') }}
          {% else %}
            ok
          {% endif %}

      - name: Energy Fault Severity
        unique_id: energy_fault_severity
        icon: mdi:traffic-light
        state: >
          {% if is_state('binary_sensor.energy_fault_safe_stop', 'on') %}
            safe_stop
          {% elif is_state('binary_sensor.energy_fault_recover', 'on') %}
            recover
          {% elif is_state('binary_sensor.energy_fault_notify', 'on') %}
            notify
          {% else %}
            ok
          {% endif %}


  ###########################################################################
  # HYSTERESIS / STABLE DECISION SENSORS
  # EV mode control uses solar floor + divert_unsafe (not residual surplus).
