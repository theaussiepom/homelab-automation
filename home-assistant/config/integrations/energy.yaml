rest:
  - resource: !secret influxdb_query_url
    method: POST
    headers:
      Authorization: !secret 'influxdb_query_authorization'
      Content-Type: application/vnd.flux
      Accept: application/csv
    payload_template: |
      {% set raw_a=as_datetime(states('sensor.the_dennis_boys_sun_sunrise_start'), none) %}
      {% set raw_b=as_datetime(states('sensor.the_dennis_boys_sun_sunset_end'), none) %}
      {% set a=as_local(raw_a) if raw_a is not none and raw_a.tzinfo is not none else none %}
      {% set b=as_local(raw_b) if raw_b is not none and raw_b.tzinfo is not none else none %}
      {% if a is not none and b is not none and a.hour*60+a.minute < b.hour*60+b.minute %}
      // Read-only reconstruction from the existing state-change history.
      // Known numeric values are carried forward; missing anchors are never zero-filled.
      // HA omits unavailable/unknown events from Influx: historical availability cannot
      // be proved by this data alone. This is an explicit limitation, not an age cutoff.
      import "date"
