      state: '{{ ''ready'' if states(''sensor.energy_ev_desired_mode'') in [''off'',''eco_plus'',''eco'',''fast''] and state_attr(''sensor.energy_ev_desired_mode'',''restored'')
        != true else ''blocked'' }}'
      attributes:
        desired: '{{ states(''sensor.energy_ev_desired_mode'') }}'
        generation: '{{ ''g'' ~ as_timestamp(states.sensor.energy_ev_desired_mode.last_changed,0) if states.sensor.energy_ev_desired_mode is not
          none else '''' }}'
        reason: '{{ state_attr(''sensor.energy_ev_desired_mode'',''reason'') }}'
        actual: '{{ states(''select.myenergi_zappi_21539112_charge_mode'') }}'
        actual_available: '{{ has_value(''select.myenergi_zappi_21539112_charge_mode'') and state_attr(''select.myenergi_zappi_21539112_charge_mode'',''restored'')
          != true }}'
        reported_at: '{{ as_timestamp(states.select.myenergi_zappi_21539112_charge_mode.last_reported,0) if states.select.myenergi_zappi_21539112_charge_mode
          is not none else 0 }}'
        policy_changed_at: '{{ as_timestamp(states.sensor.energy_ev_desired_mode.last_changed,0) if states.sensor.energy_ev_desired_mode is not
          none else 0 }}'
        sampled_at: '{{ as_timestamp(now()) }}'
        confirmation_note: Mode service responses are optimistic. Recovery waits for a later HA report after the service response; no additional
          provider polls are requested.


###############################################################################
# SCRIPTS
###############################################################################

script:
  energy_solcast_refresh:
    alias: Energy Restore Accepted Solcast Forecast Cache
    mode: single
    description: 'Compatibility alias: restore the validated durable cache; never query or fetch Solcast.'
    fields:
      bypass_rate_limit:
        default: false
        description: Retained for callers; ignored. This action does not use forecast quota.
    sequence:
      - action: script.energy_solcast_planning_cache_restore

  energy_solcast_planning_cache_restore:
    alias: Energy Read Durable Native Forecast Proof
    mode: single
    description: Read the last committed proof and accepted snapshot. No provider calls, local forecast queries, session token or age reset.
    sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.energy_solcast_planning_snapshot

  energy_battery_record_decision:
    alias: Energy Battery Append Decision Journal
    mode: queued
    max: 100
    description: One serialized local file writer. No control commands, provider calls or retries.
    fields:
      record:
        description: Original captured event and decision; never recomputed by the writer.
        required: true
    sequence:
    - variables:
        entry: '{% set r=record|from_json({}) if record is string else record %}{% set w=states(''input_text.energy_battery_journal_write_status'')|from_json({})
          %}{{ dict(r, schema=1, recorded_at=utcnow().isoformat(), previous_write_unconfirmed=w if w.get(''status'')==''pending'' else none) }}'
    - if:
      - condition: template
        value_template: '{{ entry.previous_write_unconfirmed is not none }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.energy_battery_journal_gap
        data:
          value: '{{ entry.previous_write_unconfirmed|tojson }}'
    - condition: template
      value_template: '{{ entry is mapping and entry.get(''event'') is string and entry.get(''event_id'') is string }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.energy_battery_journal_write_status
      data:
        value: '{{ {''status'':''pending'',''id'':entry.event_id,''at'':as_timestamp(now())|int}|tojson }}'
    - action: notify.send_message
      target:
        entity_id: notify.energy_battery_decision_log
      data:
        message: '{{ entry|tojson }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.energy_battery_journal_write_status
      data:
        value: '{{ {''status'':''written'',''id'':entry.event_id,''at'':as_timestamp(now())|int}|tojson }}'

  energy_battery_present_fault_incident:
    alias: Energy Battery Present Local Fault Incident
    mode: queued
    max: 10
    description: Local incident presentation only. The phone-attempt latch is separate; no device commands or notification retries.
    fields:
      fingerprint:
        required: true
      message:
        required: true
      title:
        required: true
    sequence:
    - action: persistent_notification.create
      data:
        notification_id: energy_battery_control_fault
        title: '{{ title }}'
        message: '{{ message }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.energy_battery_fault_local_notification
      data:
        value: '{{ fingerprint }}'

  energy_battery_reconcile:
    alias: Battery Reconcile Current Authority And Inverter
    mode: single
    max_exceeded: silent
    description: Read current policy/authority on every wakeup. Bounded pre-enable retries, persistent paced Stop recovery. Never rearms or fetches
      forecasts.
    sequence:
    - variables:
        decision: |-
          {% from 'energy_battery_recovery.jinja' import battery_recovery_decision %}
          {% set decide=battery_recovery_decision|as_function %}{{ decide() }}
    - if:
      - condition: template
        value_template: '{{ decision.cancel_session and (states(''input_text.energy_battery_charge_session'')|from_json({})).get(''id'') == decision.session_id
          }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.energy_battery_charge_session
        data:
          value: '{% set s=states(''input_text.energy_battery_charge_session'')|from_json({}) %}{{ dict(s,done=true)|tojson|replace('', '','','')|replace('':
            '','':'') }}'
        continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ decision.cancel_manual and (states(''input_text.sg_battery_manual_lease'')|from_json({})).get(''id'') == decision.manual_id
          }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.sg_battery_manual_lease
        data:
          value: '{% set m=states(''input_text.sg_battery_manual_lease'')|from_json({}) %}{{ dict(m,done=true,stop_requested=true,stop_at=as_timestamp(now())|int)|tojson|replace('',
            '','','')|replace('': '','':'') }}'
        continue_on_error: true
    - variables:
        progress: '{{ decision.state|tojson|replace('', '','','')|replace('': '','':'') }}'
    - if:
      - condition: template
        value_template: '{{ progress|length<=255 and (states(''input_text.energy_battery_recovery'')|from_json({})) != decision.state }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.energy_battery_recovery
        data:
          value: '{{ progress }}'
        continue_on_error: true
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ decision.action==''start'' }}'
        sequence:
        - condition: template
          value_template: '{{ progress|length<=255 and (states(''input_text.energy_battery_recovery'')|from_json({})) == decision.state and states(''input_text.sg_battery_authority_epoch'')
            == decision.epoch and (states(''input_text.energy_battery_charge_session'')|from_json({})).get(''id'') == decision.session_id }}'
        - action: script.sg_battery_request
          continue_on_error: true
          data:
            operation: charge
            power_w: '{{ (states(''input_text.energy_battery_charge_session'')|from_json({})).get(''power'',-1) }}'
            authority: session
            session_id: '{{ decision.session_id }}'
            attempt: '{{ decision.state.starts }}'
            authority_epoch: '{{ decision.epoch }}'
      - conditions:
        - condition: template
          value_template: "{{ decision.action=='refresh' }}"
        sequence:
        - action: script.sg_battery_request
          continue_on_error: true
          data:
            operation: refresh
            power_w: "{{ (states('input_text.sg_battery_manual_lease')|from_json({})).get('power',-1) }}"
            authority: manual
            session_id: "{{ decision.manual_id }}"
            authority_epoch: "{{ decision.epoch }}"
      - conditions:
        - condition: template
          value_template: '{{ decision.action==''stop'' }}'
        sequence:
        - action: script.sg_battery_request
          continue_on_error: true
          data:
            operation: normal
            authority_epoch: '{{ decision.epoch }}'
            recovery_stop: '{{ decision.recovery_stop }}'
            expected_session_id: '{{ decision.session_id }}'
            expected_manual_id: '{{ decision.manual_id }}'

