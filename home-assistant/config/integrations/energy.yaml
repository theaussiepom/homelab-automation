          {% if not (session is mapping and session.get('id') is string and session.get('id') | length > 0
            and not session.get('done', false)
            and is_number(session.get('start')) and is_number(session.get('end'))
            and is_number(session.get('max_end')) and is_number(session.get('targetkwh'))
            and is_number(session.get('targetsoc')) and is_number(session.get('power'))
            and is_number(session.get('budget'))
            and session.start | float <= as_timestamp(now())
            and session.start | float < session.end | float <= session.max_end | float
            and 0 < session.targetkwh | float and 0 < session.targetsoc | float <= 90
            and 0 < session.power | float <= 3000 and 0 < session.budget | float) %}inactive
          {% elif ack is mapping and ack.get('status') == 'confirmed' and ack.get('epoch') == states('input_text.sg_battery_authority_epoch')
           and ack.get('attempt') == (states('input_text.energy_battery_recovery')|from_json({})).get('starts')
           and (states('input_text.energy_battery_recovery')|from_json({})).get('id') == session.get('id')
           and ack.get('id') == session.get('id') and ack.get('authority') == 'session'
           and ack.get('op') == 'charge' and ack.get('power') == session.get('power')
           and is_number(ack.get('ts')) and is_number(ack.get('started'))
           and session.start | float <= ack.started | float <= ack.ts | float <= session.start | float + 60 %}command_confirmed
          {% else %}requested{% endif %}
        deadline: |-
          {% set session = states('input_text.energy_battery_charge_session') | from_json({}) %}
          {% set ack = states('input_text.sg_battery_command_ack') | from_json({}) %}
          {{ session.get('end') if session is mapping else none }}
        budget_kind: Planned energy/time bound; not a measured grid-energy counter.

