      state: |
        {{ states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) }}
    - name: Energy Solar Forecast Tomorrow
      unique_id: energy_solar_forecast_tomorrow
      unit_of_measurement: kWh
      device_class: energy
      availability: |
        {% set polled = as_timestamp(states('sensor.solcast_pv_forecast_api_last_polled'), 0) %} {{ polled > 0 and 0 <= as_timestamp(now()) - polled < 86400 and has_value('sensor.solcast_pv_forecast_forecast_tomorrow') }}
      state: |
        {{ states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0) }}
    - name: Energy Solar Forecast Peak Power Today
      unique_id: energy_solar_forecast_peak_power_today
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
      availability: |
        {% set polled = as_timestamp(states('sensor.solcast_pv_forecast_api_last_polled'), 0) %} {{ polled > 0 and 0 <= as_timestamp(now()) - polled < 86400 and has_value('sensor.solcast_pv_forecast_peak_forecast_today') }}
      state: |
        {% set v = states('sensor.solcast_pv_forecast_peak_forecast_today') | float(0) %} {{ (v / 1000 if state_attr('sensor.solcast_pv_forecast_peak_forecast_today', 'unit_of_measurement') == 'W' else v) | round(3) }}
    - name: Energy Solar Best Window Today
      unique_id: energy_solar_best_window_today
      availability: |
        {{ state_attr('sensor.energy_solcast_ne_forecasts', 'forecasts') is not none
           and state_attr('sensor.energy_solcast_sw_forecasts', 'forecasts') is not none }}
      state: |
        {% set ne = state_attr('sensor.energy_solcast_ne_forecasts', 'forecasts') | default([], true) %} {% set sw = state_attr('sensor.energy_solcast_sw_forecasts', 'forecasts') | default([], true) %} {% set ns = namespace(best_p=-1, start='unknown', end='unknown') %} {% set max_len = [ne | count, sw | count] | max %} {% for i in range(max_len) %}
          {% set ne_i = ne[i] if i < (ne | count) else {} %}
          {% set sw_i = sw[i] if i < (sw | count) else {} %}
          {% set dt_end = as_local(as_datetime(ne_i.period_end if ne_i.period_end is defined else sw_i.period_end if sw_i.period_end is defined else now().isoformat())) %}
          {% if dt_end.date() == now().date() %}
            {% set p = (ne_i.pv_estimate | float(0)) + (sw_i.pv_estimate | float(0)) %}
            {% if p > ns.best_p %}
              {% set dt_start = dt_end - timedelta(minutes=30) %}
              {% set ns.best_p = p %}
              {% set ns.start = dt_start.strftime('%H:%M') %}
              {% set ns.end = dt_end.strftime('%H:%M') %}
            {% endif %}
          {% endif %}
        {% endfor %} {{ ns.start }}
      attributes:
        end: |
          {% set ne = state_attr('sensor.energy_solcast_ne_forecasts', 'forecasts') | default([], true) %} {% set sw = state_attr('sensor.energy_solcast_sw_forecasts', 'forecasts') | default([], true) %} {% set ns = namespace(best_p=-1, start='unknown', end='unknown') %} {% set max_len = [ne | count, sw | count] | max %} {% for i in range(max_len) %}
            {% set ne_i = ne[i] if i < (ne | count) else {} %}
            {% set sw_i = sw[i] if i < (sw | count) else {} %}
            {% set dt_end = as_local(as_datetime(ne_i.period_end if ne_i.period_end is defined else sw_i.period_end if sw_i.period_end is defined else now().isoformat())) %}
            {% if dt_end.date() == now().date() %}
              {% set p = (ne_i.pv_estimate | float(0)) + (sw_i.pv_estimate | float(0)) %}
              {% if p > ns.best_p %}
                {% set dt_start = dt_end - timedelta(minutes=30) %}
                {% set ns.best_p = p %}
                {% set ns.start = dt_start.strftime('%H:%M') %}
                {% set ns.end = dt_end.strftime('%H:%M') %}
              {% endif %}
            {% endif %}
          {% endfor %} {{ ns.end }}
    - name: Energy Solar Best Window Tomorrow
      unique_id: energy_solar_best_window_tomorrow
