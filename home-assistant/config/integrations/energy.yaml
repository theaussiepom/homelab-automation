  - id: energy_battery_session_deadline
    alias: Energy Battery Session One-shot Deadline
    description: One timer for the committed session deadline. No periodic wakeup or command retry.
    mode: restart
    triggers:
    - trigger: state
      entity_id: input_text.energy_battery_charge_session
    actions:
    - variables:
        captured_session: '{{ states(''input_text.energy_battery_charge_session'') }}'
    - condition: template
      value_template: |-
        {% set session = states('input_text.energy_battery_charge_session') | from_json({}) %}
        {% set ack = states('input_text.sg_battery_command_ack') | from_json({}) %}
        {{ session is mapping and session.get('id') is string and session.get('id') | length > 0
          and not session.get('done', false)
          and is_number(session.get('start')) and is_number(session.get('end'))
          and is_number(session.get('max_end')) and is_number(session.get('targetkwh'))
          and is_number(session.get('targetsoc')) and is_number(session.get('power'))
          and is_number(session.get('budget'))
          and session.start | float <= as_timestamp(now())
          and session.start | float < session.end | float <= session.max_end | float
          and 0 < session.targetkwh | float and 0 < session.targetsoc | float <= 90
          and 0 < session.power | float <= 3000 and 0 < session.budget | float }}
    - delay:
        seconds: |-
          {% set session = states('input_text.energy_battery_charge_session') | from_json({}) %}
          {% set ack = states('input_text.sg_battery_command_ack') | from_json({}) %}
          {{ [0, session.end | float - as_timestamp(now())] | max }}
    - condition: template
      value_template: '{{ states(''input_text.energy_battery_charge_session'') == captured_session }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.energy_battery_charge_session
      data:
        value: |-
          {% set session = states('input_text.energy_battery_charge_session') | from_json({}) %}
          {% set ack = states('input_text.sg_battery_command_ack') | from_json({}) %}
          {{ dict(session, done=true) | tojson | replace(', ', ',') | replace(': ', ':') }}
  - id: energy_battery_session_end
