      - ev
      - shoulder
      - offpeak
      - peak

  energy_grid_export_daily:
    source: sensor.sh10rs_a2392201672_total_feed_in_energy
    cycle: daily

  energy_grid_export_monthly:
    source: sensor.sh10rs_a2392201672_total_feed_in_energy
    cycle: monthly

  energy_ev_daily:
    source: sensor.energy_ev_charging_energy_total
    cycle: daily
    tariffs:
      - ev
      - shoulder
      - offpeak
      - peak

  energy_ev_monthly:
    source: sensor.energy_ev_charging_energy_total
    cycle: monthly
    tariffs:
      - ev
      - shoulder
      - offpeak
      - peak

###############################################################################
# SOLCAST API (script-only — no REST integration startup fetch)
###############################################################################


###############################################################################
# TEMPLATES
###############################################################################

template:
  ###########################################################################
  # SOLCAST PRESERVED FORECASTS (updated by script events; survive API errors)
  ###########################################################################
  - sensor:
    - name: Energy Solcast NE Forecasts
      unique_id: energy_solcast_ne_forecasts
      unit_of_measurement: intervals
      state_class: measurement
      availability: '{{ is_state(''sensor.energy_solcast_planning_snapshot'', ''accepted'') }}'
      state: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'', ''rows'') | default([], true) | count }}'
      attributes:
        forecasts: |-
          {% set ns = namespace(out=[]) %}
          {% for row in state_attr('sensor.energy_solcast_planning_snapshot', 'rows') | default([], true) %}
            {% set ns.out = ns.out + [dict(period_end=as_local(as_datetime(row[0] + 1800)).isoformat(), pv_estimate=row[1])] %}
          {% endfor %}
          {{ ns.out }}
        source: Durable accepted native Solcast snapshot (NE)
        preserved_on_error: true
        source_generation_utc: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'', ''source_generation_utc'') }}'
        snapshot_id: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'', ''snapshot_id'') }}'
    - name: Energy Solcast SW Forecasts
      unique_id: energy_solcast_sw_forecasts
      unit_of_measurement: intervals
      state_class: measurement
      availability: '{{ is_state(''sensor.energy_solcast_planning_snapshot'', ''accepted'') }}'
      state: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'', ''rows'') | default([], true) | count }}'
      attributes:
        forecasts: |-
          {% set ns = namespace(out=[]) %}
          {% for row in state_attr('sensor.energy_solcast_planning_snapshot', 'rows') | default([], true) %}
            {% set ns.out = ns.out + [dict(period_end=as_local(as_datetime(row[0] + 1800)).isoformat(), pv_estimate=row[2])] %}
          {% endfor %}
          {{ ns.out }}
        source: Durable accepted native Solcast snapshot (SW)
        preserved_on_error: true
        source_generation_utc: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'', ''source_generation_utc'') }}'
        snapshot_id: '{{ state_attr(''sensor.energy_solcast_planning_snapshot'', ''snapshot_id'') }}'


  ###########################################################################
  # TARIFF STATE + RATES
  ###########################################################################
  - sensor:
      - name: Energy Current Tariff
        unique_id: energy_current_tariff
        state: >
          {% set now_ts = now() %}
          {% set ev_start = today_at(states('input_datetime.energy_time_ev_start')) %}
          {% set ev_end = today_at(states('input_datetime.energy_time_ev_end')) %}
          {% set offpeak_start = today_at(states('input_datetime.energy_time_offpeak_start')) %}
          {% set offpeak_end = today_at(states('input_datetime.energy_time_offpeak_end')) %}
          {% set peak_start = today_at(states('input_datetime.energy_time_peak_start')) %}
          {% set peak_end = today_at(states('input_datetime.energy_time_peak_end')) %}

          {% if now_ts >= ev_start and now_ts < ev_end %}
            ev
          {% elif now_ts >= offpeak_start and now_ts < offpeak_end %}
            offpeak
          {% elif now_ts >= peak_start and now_ts < peak_end %}
            peak
          {% else %}
            shoulder
          {% endif %}

      - name: Energy Current Import Rate
        unique_id: energy_current_import_rate
        unit_of_measurement: "$/kWh"
        state_class: measurement
        state: >
          {% set tariff = states('sensor.energy_current_tariff') %}
          {% if tariff == 'peak' %}
            {{ states('input_number.energy_rate_import_peak') | float(0) }}
          {% elif tariff == 'offpeak' %}
            {{ states('input_number.energy_rate_import_offpeak') | float(0) }}
          {% elif tariff == 'ev' %}
            {{ states('input_number.energy_rate_import_ev') | float(0) }}
          {% else %}
            {{ states('input_number.energy_rate_import_shoulder') | float(0) }}
          {% endif %}

      - name: Energy Current Effective Import Rate
        unique_id: energy_current_effective_import_rate
        unit_of_measurement: "$/kWh"
        state_class: measurement
        state: >
          {% set tariff = states('sensor.energy_current_tariff') %}
          {% if tariff == 'peak' %}
            {{ states('input_number.energy_rate_import_peak') | float(0) }}
          {% elif tariff == 'offpeak' %}
            {{ states('input_number.energy_rate_import_offpeak') | float(0) }}
          {% elif tariff == 'ev' %}
            {{ (states('input_number.energy_rate_import_ev') | float(0)) - (states('input_number.energy_rate_ev_credit') | float(0)) }}
          {% else %}
            {{ states('input_number.energy_rate_import_shoulder') | float(0) }}
          {% endif %}

      - name: Energy Current Export Rate
        unique_id: energy_current_export_rate
        unit_of_measurement: "$/kWh"
        state_class: measurement
        state: >
          {{ states('input_number.energy_rate_export') | float(0) }}

  - binary_sensor:
      - name: Energy Tariff EV
        unique_id: energy_tariff_ev
        state: "{{ states('sensor.energy_current_tariff') == 'ev' }}"

      - name: Energy Tariff Shoulder
        unique_id: energy_tariff_shoulder
        state: "{{ states('sensor.energy_current_tariff') == 'shoulder' }}"

      - name: Energy Tariff Offpeak
        unique_id: energy_tariff_offpeak
        state: "{{ states('sensor.energy_current_tariff') == 'offpeak' }}"

      - name: Energy Tariff Peak
        unique_id: energy_tariff_peak
        state: "{{ states('sensor.energy_current_tariff') == 'peak' }}"

  ###########################################################################
  # POWER / SOLAR / LOAD
  ###########################################################################
  - sensor:
      - name: Energy Solar Generation Power
        unique_id: energy_solar_generation_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.sh10rs_a2392201672_mppt_total_power') | float(0) / 1000) | round(3) }}

      - name: Energy House Load Power
        unique_id: energy_house_load_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.sh10rs_a2392201672_total_load_active_power') | float(0) | round(3) }}

      - name: Energy Solar Surplus Power
        unique_id: energy_solar_surplus_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {# House load includes EV; add EV back so diverting solar into the car
             does not look like surplus disappearing (which stops Eco+). #}
          {% set solar = states('sensor.energy_solar_generation_power') | float(0) %}
          {% set load = states('sensor.energy_house_load_power') | float(0) %}
          {% set ev = states('sensor.myenergi_my_home_power_charging') | float(0) / 1000 %}
          {{ (solar - load + ev) | round(3) }}

  ###########################################################################
  # BATTERY
  ###########################################################################
  - sensor:
    - name: Energy Battery SOC
      unique_id: energy_battery_soc
      unit_of_measurement: '%'
      device_class: battery
      state_class: measurement
      state: '{{ states(''sensor.battery_level'') | float | round(1) }}'
      availability: |-
        {{ has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))
         and 0 <= states('sensor.battery_level') | float <= 100
         and 0 <= as_timestamp(now()) - as_timestamp(states.sensor.battery_level.last_reported, 0) <= 180 }}
      attributes:
        source: Direct Sungrow Modbus input register13022;60s polling
        freshness_limit_seconds: 180
    - name: Energy Battery SOH
      unique_id: energy_battery_soh
      unit_of_measurement: '%'
      state_class: measurement
      state: '{{ states(''sensor.battery_state_of_health'') | float | round(1) }}'
      availability: |-
        {{ has_value('sensor.battery_state_of_health')
         and is_number(states('sensor.battery_state_of_health'))
         and 1 <= states('sensor.battery_state_of_health') | float <= 100
         and state_attr('sensor.battery_state_of_health', 'restored') != true }}
      attributes:
        source_entity: sensor.battery_state_of_health
        source: Direct Sungrow Modbus input register 13024 (address 13023); 600 s polling
        source_poll_interval_seconds: 600
    - name: Energy Battery Effective Capacity
      unique_id: energy_battery_effective_capacity
      unit_of_measurement: kWh
      device_class: energy_storage
      state_class: measurement
      state: '{{ (states(''input_number.energy_battery_usable_capacity_kwh'')|float * states(''sensor.energy_battery_soh'')|float / 100)|round(3)
        }}'
      availability: '{{ is_number(states(''input_number.energy_battery_usable_capacity_kwh'')) and states(''input_number.energy_battery_usable_capacity_kwh'')|float>0
        and has_value(''sensor.energy_battery_soh'') }}'
    - name: Energy Battery Reserved Backup SOC
      unique_id: energy_battery_reserved_backup_soc
      unit_of_measurement: '%'
      state_class: measurement
      state: '{{ states(''input_number.set_sg_reserved_soc_for_backup'')|float|round(1) }}'
      availability: '{{ is_number(states(''input_number.set_sg_reserved_soc_for_backup'')) and 0 <= states(''input_number.set_sg_reserved_soc_for_backup'')|float
        <= 100 }}'
    - name: Energy Battery Available SOC
      unique_id: energy_battery_available_soc
      unit_of_measurement: '%'
      device_class: battery
      state_class: measurement
      state: |
        {% set soc = states('sensor.energy_battery_soc') | float(0) %} {% set reserve_soc = states('sensor.energy_battery_reserved_backup_soc') | float(5) %} {{ [0, soc - reserve_soc] | max | round(1) }}
    - name: Energy Battery Available Energy
      unique_id: energy_battery_available_energy
      unit_of_measurement: kWh
      device_class: energy_storage
      state_class: measurement
      state: |
        {% set available_soc = states('sensor.energy_battery_available_soc') | float(0) %} {% set capacity = states('sensor.energy_battery_effective_capacity') | float(0) %} {{ ((available_soc / 100) * capacity) | round(2) }}
    - name: Energy Battery Reserve Target
      unique_id: energy_battery_reserve_target
      unit_of_measurement: kWh
      device_class: energy
      state: |
        {{ states('input_number.energy_battery_reserve_target_kwh') | float(5.0) | round(2) }}

  - binary_sensor:
    - name: Energy Battery Above Reserve
      unique_id: energy_battery_above_reserve
      state: |
        {% set est = states('sensor.energy_battery_available_energy') | float(0) %} {% set reserve = states('sensor.energy_battery_reserve_target') | float(5) %} {{ est > reserve }}
    - name: Energy Battery Needs Overnight Support
      unique_id: energy_battery_needs_overnight_support
      state: '{% set m=(state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})) %}{{ m.usable_inputs|default(false)
        and m.grid_topup_kwh|default(0)>0.01 }}'
      attributes:
        provisional: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).provisional|default(true)
          }}'
        source_snapshot_id: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).source_snapshot_id|default(none)
          }}'
        recovery_target_day: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).target_day|default(none)
          }}'
    - name: Energy Battery Should Grid Charge Overnight
      unique_id: energy_battery_should_grid_charge_overnight
      state: "{% from 'energy_battery_authority.jinja' import battery_plan_authority %}\n{% set current_plan_authority=battery_plan_authority|as_function\
        \ %}\n{% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}\n{% set authority_plan=authority_raw\
        \ if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}\n{% set authority_source=states.sensor.energy_solcast_planning_snapshot\
        \ %}\n{% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}\n\
        {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored')\
        \ != true,authority_snapshot,as_timestamp(now())) %}\n{% set raw_plan = state_attr('sensor.energy_recovery_forecast_model_cache', 'model_data')\
        \ %}\n{% set decoded_plan = raw_plan if raw_plan is mapping else raw_plan | from_json({}) if raw_plan is string else {} %}\n{% set plan\
        \ = decoded_plan if decoded_plan is mapping else {} %}\n{% set start = plan.get('latest_start') | float if is_number(plan.get('latest_start'))\
        \ else as_timestamp(plan.get('latest_start'), none) %}\n{% set end = plan.get('tariff_end') | float if is_number(plan.get('tariff_end'))\
        \ else as_timestamp(plan.get('tariff_end'), none) %}\n{% set valid = plan is mapping and plan.get('usable_inputs', plan.get('ready')) ==\
        \ true\n  and is_number(plan.get('grid_topup_kwh')) and plan.grid_topup_kwh | float > 0\n  and is_number(start) and is_number(end) %}\n\
        {{ plan_authority_ok and valid and has_value('sensor.battery_level') and is_number(states('sensor.battery_level'))\n and 0 <= states('sensor.battery_level')\
        \ | float <= 100\n and 0 <= as_timestamp(now()) - as_timestamp(states.sensor.battery_level.last_reported, 0) <= 180 and is_state('input_boolean.energy_disable_automation',\
        \ 'off')\n  and is_state('input_boolean.energy_allow_overnight_battery_charge', 'on')\n  and is_state('input_boolean.sg_battery_control_armed',\
        \ 'on')\n  and is_state('input_boolean.sg_battery_stop_pending', 'off')\n  \n  and is_state('binary_sensor.energy_recovery_target_forecast_available',\
        \ 'on')\n  and start - 180 <= as_timestamp(now()) < end }}"
      attributes:
        planner_ready: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).ready|default(false)
          }}'
        provisional: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).provisional|default(true)
          }}'
        target_soc_pct: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).target_soc|default(0)
          }}'
        grid_energy_budget_kwh: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).grid_topup_kwh|default(0)
          }}'
        charge_start_epoch: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).latest_start|default(0)
          }}'
        source_snapshot_id: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).source_snapshot_id|default(none)
          }}'

  ###########################################################################
  # EV
  ###########################################################################
  - sensor:
      - name: Energy EV Actual Mode
        unique_id: energy_ev_actual_mode
        state: >
          {% set mode = states('select.myenergi_zappi_21539112_charge_mode') | lower %}
          {% if mode == 'stopped' %}
            off
          {% elif mode == 'eco+' %}
            eco_plus
          {% elif mode == 'eco' %}
            eco
          {% elif mode == 'fast' %}
            fast
          {% else %}
            {{ mode }}
          {% endif %}

      - name: Energy EV Desired Mode
        unique_id: energy_ev_desired_mode
        state: >
          {% set disabled = is_state('input_boolean.energy_disable_automation', 'on') %}
          {% set block_ev = is_state('input_boolean.energy_block_ev_charge', 'on') %}
          {% set peak = is_state('binary_sensor.energy_tariff_peak', 'on') %}
          {% set battery_in_charge_slot = is_state('binary_sensor.energy_state_battery_should_be_charging', 'on') %}
          {# Battery-feeding-EV signature/hard still blocks Fast. SOC reserve only blocks Eco+. #}
          {% set batt_feed_unsafe = is_state('binary_sensor.energy_ev_divert_unsafe_signature', 'on')
             or is_state('binary_sensor.energy_ev_divert_unsafe_hard', 'on') %}
          {% set soc_guard = is_state('binary_sensor.energy_ev_divert_unsafe_soc', 'on') %}
          {% set force_ev = is_state('input_boolean.energy_force_ev_charge', 'on') %}
          {% set fast_overnight = is_state('input_boolean.energy_ev_allow_overnight_fast_charge', 'on')
             and is_state('binary_sensor.energy_tariff_ev', 'on') %}
          {% set plugged = is_state('binary_sensor.bennis_tesla_plugged_in_at_home', 'on')
             or is_state('binary_sensor.matty_dolphin_charge_allowed', 'on') %}
          {% set solar_floor = is_state('binary_sensor.energy_ev_solar_floor', 'on') %}
          {% if disabled %}
            off
          {% elif block_ev %}
            off
          {% elif peak %}
            off
          {% elif battery_in_charge_slot %}
            off
          {% elif batt_feed_unsafe %}
            off
          {% elif force_ev or fast_overnight %}
            fast
          {% elif soc_guard %}
            off
          {% elif plugged and solar_floor %}
            eco_plus
          {% else %}
            off
          {% endif %}
        attributes:
          reason: >-
            {% set disabled = is_state('input_boolean.energy_disable_automation', 'on') %}
            {% set block_ev = is_state('input_boolean.energy_block_ev_charge', 'on') %}
            {% set peak = is_state('binary_sensor.energy_tariff_peak', 'on') %}
            {% set battery_in_charge_slot = is_state('binary_sensor.energy_state_battery_should_be_charging', 'on') %}
            {% set batt_feed_unsafe = is_state('binary_sensor.energy_ev_divert_unsafe_signature', 'on')
               or is_state('binary_sensor.energy_ev_divert_unsafe_hard', 'on') %}
            {% set soc_guard = is_state('binary_sensor.energy_ev_divert_unsafe_soc', 'on') %}
            {% set force_ev = is_state('input_boolean.energy_force_ev_charge', 'on') %}
            {% set fast_overnight = is_state('input_boolean.energy_ev_allow_overnight_fast_charge', 'on')
               and is_state('binary_sensor.energy_tariff_ev', 'on') %}
            {% set plugged = is_state('binary_sensor.bennis_tesla_plugged_in_at_home', 'on')
               or is_state('binary_sensor.matty_dolphin_charge_allowed', 'on') %}
            {% set solar_floor = is_state('binary_sensor.energy_ev_solar_floor', 'on') %}
            {% if disabled %}automation_disabled
            {% elif block_ev %}block_ev
            {% elif peak %}peak_tariff
            {% elif battery_in_charge_slot %}battery_overnight_slot
            {% elif batt_feed_unsafe %}divert_unsafe
            {% elif force_ev %}force_ev
            {% elif fast_overnight %}overnight_fast
            {% elif soc_guard %}soc_reserve
            {% elif plugged and solar_floor %}eco_plus_solar_floor
            {% elif not plugged %}not_plugged
            {% else %}solar_floor_off
            {% endif %}
          peak_tariff: "{{ is_state('binary_sensor.energy_tariff_peak', 'on') }}"
          block_ev: "{{ is_state('input_boolean.energy_block_ev_charge', 'on') }}"
          automation_disabled: "{{ is_state('input_boolean.energy_disable_automation', 'on') }}"
          force_ev: "{{ is_state('input_boolean.energy_force_ev_charge', 'on') }}"
          battery_in_charge_slot: "{{ is_state('binary_sensor.energy_state_battery_should_be_charging', 'on') }}"
          divert_unsafe: "{{ is_state('binary_sensor.energy_ev_divert_unsafe', 'on') }}"
          batt_feed_unsafe: "{{ is_state('binary_sensor.energy_ev_divert_unsafe_signature', 'on') or is_state('binary_sensor.energy_ev_divert_unsafe_hard', 'on') }}"
          soc_guard: "{{ is_state('binary_sensor.energy_ev_divert_unsafe_soc', 'on') }}"
          solar_floor: "{{ is_state('binary_sensor.energy_ev_solar_floor', 'on') }}"
          plugged_in: "{{ is_state('binary_sensor.bennis_tesla_plugged_in_at_home', 'on') or is_state('binary_sensor.matty_dolphin_charge_allowed', 'on') }}"
          overnight_fast_allowed: "{{ is_state('input_boolean.energy_ev_allow_overnight_fast_charge', 'on') }}"
          ev_tariff_window: "{{ is_state('binary_sensor.energy_tariff_ev', 'on') }}"
          battery_charge_start: "{{ states('sensor.energy_battery_overnight_charge_start') }}"
          charge_allowed: "{{ states('sensor.energy_ev_desired_mode') not in ['off', 'unknown', 'unavailable', 'none', 'None', ''] }}"

