  - id: energy_battery_fault_notification_observer
    alias: Energy Battery Fault Notification Observer
    description: Notification only. No inverter calls, recovery retries or automatic rearm. Deduplicates by fault, authority and session.
    mode: queued
    max: 10
    triggers:
    - trigger: state
      entity_id: input_text.energy_battery_fault_candidate
      for: 00:02:00
    - trigger: time_pattern
      minutes: /1
    - trigger: state
      entity_id: sensor.energy_battery_control_health
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: input_text.sg_battery_normal_confirmation
    actions:
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {% set d0=state_attr('sensor.energy_battery_control_health','diagnostic_snapshot') %}
            {% set d=d0 if d0 is mapping else {} %}
            {% set c0=states('input_text.energy_battery_fault_candidate')|from_json({}) %}{% set c=c0 if c0 is mapping else {} %}
            {% set l0=states('input_text.energy_battery_fault_notification')|from_json({}) %}{% set l=l0 if l0 is mapping else {} %}
            {% set wanted=states('sensor.energy_battery_control_health') in ['fault','unknown'] and d.get('alert_required')==true %}
            {% set fp=(d.get('status_code','unknown')|string)~'|'~(d.get('authority','none')|string)~'|'~((d.get('session_id') or 'none')|string)[:64] %}
            {{ wanted and c.get('fp')==fp and is_number(c.get('since'))
             and as_timestamp(now())-c.since|float>=120 and l.get('fp')!=fp
             and is_number(d.get('as_of_epoch')) and 0<=as_timestamp(now())-d.as_of_epoch|float<=90 }}
        sequence:
        - variables:
            fault_snapshot: |-
              {% set d0=state_attr('sensor.energy_battery_control_health','diagnostic_snapshot') %}
              {% set d=d0 if d0 is mapping else {} %}
              {% set c0=states('input_text.energy_battery_fault_candidate')|from_json({}) %}{% set c=c0 if c0 is mapping else {} %}
              {% set l0=states('input_text.energy_battery_fault_notification')|from_json({}) %}{% set l=l0 if l0 is mapping else {} %}
              {% set wanted=states('sensor.energy_battery_control_health') in ['fault','unknown'] and d.get('alert_required')==true %}
              {% set fp=(d.get('status_code','unknown')|string)~'|'~(d.get('authority','none')|string)~'|'~((d.get('session_id') or 'none')|string)[:64] %}
              {{ d }}
            notification_latch: |-
              {% set d0=state_attr('sensor.energy_battery_control_health','diagnostic_snapshot') %}
              {% set d=d0 if d0 is mapping else {} %}
              {% set c0=states('input_text.energy_battery_fault_candidate')|from_json({}) %}{% set c=c0 if c0 is mapping else {} %}
              {% set l0=states('input_text.energy_battery_fault_notification')|from_json({}) %}{% set l=l0 if l0 is mapping else {} %}
              {% set wanted=states('sensor.energy_battery_control_health') in ['fault','unknown'] and d.get('alert_required')==true %}
              {% set fp=(d.get('status_code','unknown')|string)~'|'~(d.get('authority','none')|string)~'|'~((d.get('session_id') or 'none')|string)[:64] %}
              {{ {'fp':fp,'since':c.since,'attempted_at':as_timestamp(now())}|tojson|replace(', ', ',')|replace(': ', ':') }}
        - action: input_text.set_value
          target:
            entity_id: input_text.energy_battery_fault_notification
          data:
            value: '{{ notification_latch }}'
        - action: script.energy_battery_present_fault_incident
          continue_on_error: true
          data:
            fingerprint: '{{ (notification_latch if notification_latch is mapping else notification_latch|from_json({})).get(''fp'') }}'
            message: |-
              {{ fault_snapshot.reason }}

              Desired: {{ fault_snapshot.desired_operation }}; observed: {{ fault_snapshot.actual_operation }}.
              Requested: {{ fault_snapshot.requested_power_w if fault_snapshot.requested_power_w is not none else 'none' }} W; register setting: {{ fault_snapshot.raw_power_setting_w if fault_snapshot.raw_power_setting_w is not none else 'unknown' }} W.
              Recovery: {{ fault_snapshot.get('recovery_summary','Recovery status unavailable.') }}
            title: Battery control needs attention
        - action: !secret ha_energy_action_1
          continue_on_error: true
          data:
            title: Battery control needs attention
            message: '{{ fault_snapshot.reason }} Desired {{ fault_snapshot.desired_operation }}; observed {{ fault_snapshot.actual_operation }}.
              Recovery: {{ fault_snapshot.get(''recovery_summary'',''Recovery status unavailable.'') }}'
            data:
              tag: energy-battery-control-fault
      - conditions:
        - condition: template
          value_template: |-
            {% set d0=state_attr('sensor.energy_battery_control_health','diagnostic_snapshot') %}
            {% set d=d0 if d0 is mapping else {} %}
            {% set c0=states('input_text.energy_battery_fault_candidate')|from_json({}) %}{% set c=c0 if c0 is mapping else {} %}
            {% set l0=states('input_text.energy_battery_fault_notification')|from_json({}) %}{% set l=l0 if l0 is mapping else {} %}
            {% set wanted=states('sensor.energy_battery_control_health') in ['fault','unknown'] and d.get('alert_required')==true %}
            {% set fp=(d.get('status_code','unknown')|string)~'|'~(d.get('authority','none')|string)~'|'~((d.get('session_id') or 'none')|string)[:64] %}
            {% set observed=states('sensor.energy_battery_control_health') in ['healthy','blocked'] and d.get('telemetry_fresh')==true
             and d.get('readback_matches')==true and not d.get('pending_stop',true)
             and is_number(d.get('as_of_epoch')) and 0<=as_timestamp(now())-d.as_of_epoch|float<=90 %}
            {% set since=l.get('since',0)|float(0) %}

            {% set nr0=states('input_text.sg_battery_normal_confirmation')|from_json({}) %}
            {% set nr=nr0 if nr0 is mapping else {} %}
            {% set nr_now=as_timestamp(now()) %}
            {% set nr_numeric=is_number(nr.get('confirmed_at')) and is_number(nr.get('read_after')) %}
            {% set nr_valid=has_value('input_text.sg_battery_normal_confirmation')
             and state_attr('input_text.sg_battery_normal_confirmation','restored') != true
             and has_value('input_text.sg_battery_authority_epoch') and states('input_text.sg_battery_authority_epoch')|length > 0 and nr.get('epoch') == states('input_text.sg_battery_authority_epoch') and nr.get('v') == 1 and nr.get('status') == 'confirmed' and nr.get('operation') in ['normal','stage']
             and nr.get('ems') == 0 and nr.get('command') == 204 and nr_numeric
             and 0 < nr.read_after|float <= nr.confirmed_at|float <= nr_now
             and nr_now-nr.confirmed_at|float <= 180
             and is_state('script.sg_battery_command_owner','off')
             and is_state('script.sg_battery_request','off')
             and is_state('input_boolean.sg_battery_stop_pending','off')
             and states('input_text.sg_battery_control_result').startswith('Confirmed: self-consumption') %}
            {% set nr_ems=states.sensor.ems_mode_selection_raw %}{% set nr_cmd=states.sensor.battery_forced_charge_discharge_cmd_raw %}
            {% set nr_valid=nr_valid and nr_ems is not none and nr_cmd is not none
             and has_value('sensor.ems_mode_selection_raw') and is_number(states('sensor.ems_mode_selection_raw')) and states('sensor.ems_mode_selection_raw')|float == 0
             and has_value('sensor.battery_forced_charge_discharge_cmd_raw') and is_number(states('sensor.battery_forced_charge_discharge_cmd_raw')) and states('sensor.battery_forced_charge_discharge_cmd_raw')|float == 204
             and nr.read_after|float <= as_timestamp(nr_ems.last_reported,0) <= nr_now
             and nr.read_after|float <= as_timestamp(nr_cmd.last_reported,0) <= nr_now
             and nr_now-as_timestamp(nr_ems.last_reported,0) <= 180 and nr_now-as_timestamp(nr_cmd.last_reported,0) <= 180 %}
            {% if nr_valid and nr.operation == 'stage' %}
             {% set nr_power=states.sensor.battery_forced_charge_discharge_power %}
             {% set nr_valid=is_number(nr.get('power_w')) and 1 <= nr.power_w|float <= 3000 and nr.power_w|float == nr.power_w|int
              and nr_power is not none and has_value('sensor.battery_forced_charge_discharge_power') and is_number(nr_power.state)
              and nr_power.state|float == nr.power_w|float and nr.read_after|float <= as_timestamp(nr_power.last_reported,0) <= nr_now
              and nr_now-as_timestamp(nr_power.last_reported,0) <= 180 %}
            {% endif %}
            {% set normal=d.get('actual_operation')=='normal' and d.get('owner_normal_confirmed')==true
             and nr_valid and d.get('owner_normal_confirmed_at') == nr.get('confirmed_at') and since<=nr.confirmed_at|float %}
            {% set live_a0=states('input_text.sg_battery_command_ack')|from_json({}) %}
            {% set live_a=live_a0 if live_a0 is mapping else {} %}
            {% set live_epoch=states('input_text.sg_battery_authority_epoch') %}
            {% set live_r0=states('input_text.energy_battery_recovery')|from_json({}) %}
            {% set live_r=live_r0 if live_r0 is mapping else {} %}
            {% set live_lease0=states('input_text.energy_battery_charge_session' if d.get('authority')=='session' else 'input_text.sg_battery_manual_lease')|from_json({}) %}
            {% set live_lease=live_lease0 if live_lease0 is mapping else {} %}
            {% set live_match=has_value('input_text.sg_battery_authority_epoch') and live_epoch|length>0
             and is_state('input_boolean.sg_battery_stop_pending','off') and is_state('input_boolean.sg_battery_control_armed','on')
             and live_a.get('epoch') == live_epoch and d.get('ack_epoch') == live_epoch and live_a.get('status')=='confirmed'
             and live_a.get('id') == d.get('ack_session_id') and live_a.get('attempt') == d.get('ack_attempt')
             and live_a.get('ts') == d.get('ack_confirmed_at') and live_a.get('authority') == d.get('authority')
             and live_lease.get('id') == live_a.get('id') and live_lease.get('done') == false
             and is_number(live_lease.get('end')) and as_timestamp(now()) < live_lease.end|float
             and ((d.get('authority')=='manual' and live_a.get('attempt')==1)
              or (d.get('authority')=='session' and live_r.get('id') == live_a.get('id') and live_r.get('epoch') == live_epoch and live_r.get('starts') == live_a.get('attempt') and live_r.get('phase') in ['starting','confirmed'])) %}
            {% set forced=d.get('actual_operation') in ['charge','discharge','bypass'] and d.get('ack_matches')==true and live_match
             and is_number(d.get('ack_confirmed_at')) and since<=d.ack_confirmed_at|float<=as_timestamp(now())
             and as_timestamp(now())-d.ack_confirmed_at|float<=180 %}
            {{ l.get('fp') is string and l.get('fp')|length>0 and observed and (normal or forced) }}
        sequence:
        - action: persistent_notification.dismiss
          continue_on_error: true
          data:
            notification_id: energy_battery_control_fault
        - action: !secret ha_energy_action_1
          continue_on_error: true
          data:
            message: clear_notification
            data:
              tag: energy-battery-control-fault
        - action: input_text.set_value
          target:
            entity_id: input_text.energy_battery_fault_notification
          data:
            value: ''
        - action: input_text.set_value
          target:
            entity_id: input_text.energy_battery_fault_local_notification
          data:
            value: ''
      - conditions:
        - condition: template
          value_template: |-
            {% set d0=state_attr('sensor.energy_battery_control_health','diagnostic_snapshot') %}
            {% set d=d0 if d0 is mapping else {} %}
            {% set c0=states('input_text.energy_battery_fault_candidate')|from_json({}) %}{% set c=c0 if c0 is mapping else {} %}
            {% set l0=states('input_text.energy_battery_fault_notification')|from_json({}) %}{% set l=l0 if l0 is mapping else {} %}
            {% set wanted=states('sensor.energy_battery_control_health') in ['fault','unknown'] and d.get('alert_required')==true %}
            {% set fp=(d.get('status_code','unknown')|string)~'|'~(d.get('authority','none')|string)~'|'~((d.get('session_id') or 'none')|string)[:64] %}
            {{ l.get('fp') is string and l.get('fp')|length>0
             and states('input_text.energy_battery_fault_local_notification')!=l.fp }}
        sequence:
        - action: script.energy_battery_present_fault_incident
          continue_on_error: true
          data:
            fingerprint: |-
              {% set d0=state_attr('sensor.energy_battery_control_health','diagnostic_snapshot') %}
              {% set d=d0 if d0 is mapping else {} %}
              {% set c0=states('input_text.energy_battery_fault_candidate')|from_json({}) %}{% set c=c0 if c0 is mapping else {} %}
              {% set l0=states('input_text.energy_battery_fault_notification')|from_json({}) %}{% set l=l0 if l0 is mapping else {} %}
              {% set wanted=states('sensor.energy_battery_control_health') in ['fault','unknown'] and d.get('alert_required')==true %}
              {% set fp=(d.get('status_code','unknown')|string)~'|'~(d.get('authority','none')|string)~'|'~((d.get('session_id') or 'none')|string)[:64] %}
              {{ l.fp }}
            message: |-
              {% set d0=state_attr('sensor.energy_battery_control_health','diagnostic_snapshot') %}
              {% set d=d0 if d0 is mapping else {} %}
              {% set c0=states('input_text.energy_battery_fault_candidate')|from_json({}) %}{% set c=c0 if c0 is mapping else {} %}
              {% set l0=states('input_text.energy_battery_fault_notification')|from_json({}) %}{% set l=l0 if l0 is mapping else {} %}
              {% set wanted=states('sensor.energy_battery_control_health') in ['fault','unknown'] and d.get('alert_required')==true %}
              {% set fp=(d.get('status_code','unknown')|string)~'|'~(d.get('authority','none')|string)~'|'~((d.get('session_id') or 'none')|string)[:64] %}
              An earlier battery control incident remains unverified.
              Incident: {{ l.fp }}.
              {% if is_number(d.get('as_of_epoch')) and 0<=as_timestamp(now())-d.as_of_epoch|float<=90 %}
              Current observation: {{ d.get('reason','Control status is unavailable.') }}
              {% else %}Current control diagnostics are stale or unavailable.{% endif %}
              This incident clears only after fresh owner confirmation after it began. Recovery status: {{ d.get('recovery_summary','unavailable') if is_number(d.get('as_of_epoch')) and 0<=as_timestamp(now())-d.as_of_epoch|float<=90 else 'unavailable' }}. Notification status does not suspend recovery.
            title: Battery control incident remains unverified

  - id: energy_solcast_observe_native_refresh
    alias: Energy Solcast Observe Native Refresh Counters
    mode: queued
    max: 10
    triggers:
    - trigger: state
      entity_id:
      - sensor.solcast_pv_forecast_api_last_polled
      - sensor.energy_solcast_planning_snapshot
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: /1
    actions:
    - variables:
        observation: |2

          {% set p=states('input_text.energy_solcast_refresh_observation')|from_json({}) %}
          {% set p=p if p is mapping and p.get('v')==1 else {} %}
          {% set native='sensor.solcast_pv_forecast_api_last_polled' %}
          {% set n=state_attr(native,'failure_count_today') %}
          {% set w=state_attr(native,'failure_count_7_day') %}
          {% set g=as_timestamp(states(native),0)|int %}
          {% set t=as_timestamp(now())|int %}{% set day=t//86400 %}
          {% if has_value(native) and is_number(n) and is_number(w) and n|int>=0 and w|int>=0 and g>0 %}
            {% set new_failure=(n|int>0 if not p else (w|int>p.get('w',w)|int or n|int>p.get('n',n)|int or (day!=p.get('d') and n|int>0 and n|int!=p.get('n',n)|int))) %}
            {% set snap='sensor.energy_solcast_planning_snapshot' %}
            {% set proved=as_timestamp(state_attr(snap,'source_generation_utc'),0)|int if is_state(snap,'accepted') and state_attr(snap,'provenance_status')=='proved_native_cycle' else 0 %}
            {% set recovered=not new_failure and p.get('f',false) and proved>p.get('fg',g)|int and proved<=g %}
            {% set failure=true if new_failure else false if recovered else p.get('f',false) %}
            {{ dict(v=1,d=day if not p or n|int!=p.get('n') else p.get('d',day),n=n|int,w=w|int,g=g,f=failure,at=t if new_failure else p.get('at',0),fg=g if new_failure else p.get('fg',0)) }}
          {% else %}{{ p }}{% endif %}
    - condition: template
      value_template: '{{ observation is mapping and observation.get(''v'')==1 and observation != (states(''input_text.energy_solcast_refresh_observation'')|from_json({}))
        }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.energy_solcast_refresh_observation
      data:
        value: '{{ observation|tojson }}'

  - id: energy_battery_reconcile
    alias: Battery Event And Periodic Reconciliation
    mode: single
    max_exceeded: silent
    triggers:
    - trigger: time_pattern
      seconds: /10
    - trigger: state
      entity_id:
      - input_text.energy_battery_charge_session
      - input_text.sg_battery_manual_lease
      - input_text.sg_battery_command_ack
      - input_text.sg_battery_normal_confirmation
      - input_text.sg_battery_authority_epoch
      - input_boolean.sg_battery_stop_pending
      - input_boolean.sg_battery_control_armed
      - input_boolean.energy_allow_overnight_battery_charge
      - input_boolean.energy_disable_automation
      - binary_sensor.energy_state_battery_should_be_charging
      - binary_sensor.energy_tariff_ev
      - sensor.energy_recovery_forecast_model_cache
      - sensor.battery_level
      - sensor.ems_mode_selection_raw
      - sensor.battery_power_raw
      - sensor.battery_forced_charge_discharge_cmd_raw
      - sensor.battery_forced_charge_discharge_power
      - script.sg_battery_command_owner
      - script.sg_battery_request
      to: null
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: automation_reloaded
    - trigger: event
      event_type: event_template_reloaded
    - trigger: event
      event_type: service_registered
      event_data:
        domain: script
        service: energy_battery_reconcile
    - trigger: time
      at: 06:00:00
    conditions:
    - condition: template
      value_template: '{{ has_value(''script.energy_battery_reconcile'') and has_value(''script.sg_battery_request'') and has_value(''script.sg_battery_command_owner'')
        }}'
    actions:
    - action: script.energy_battery_reconcile
    description: State events plus ten-second local evaluation. Reads existing telemetry; new Modbus traffic only for required bounded owner transactions.
      Stop retries remain independent of alert throttling.

###############################################################################
# INTEGRATION SENSOR
# Converts Zappi charging power into cumulative EV charging energy
###############################################################################

sensor:
  - platform: integration
    source: sensor.myenergi_my_home_power_charging
    name: Energy EV Charging Energy Total
    unique_id: energy_ev_charging_energy_total
    unit_prefix: k
    round: 3
    method: trapezoidal

  # Expected average daily house energy use during daylight hours (kWh),
  # derived from the last 30 days of energy_house_load_power in InfluxDB.
  # Daylight window uses live sun2 hour bounds (sunrise start .. sunset end).

  # Expected average daily house energy during the EV tariff window (kWh),
  # e.g. 00:00-06:00 — used directly for overnight battery drain estimate.

  # Expected average daily house energy during the morning shoulder window (kWh),
  # e.g. 06:00-11:00 — used for morning deficit interval load (not flat daylight spread).

###############################################################################
# UTILITY METERS
###############################################################################

utility_meter:
  energy_grid_import_daily:
    source: sensor.sh10rs_a2392201672_total_purchased_energy
