         {% set r=trigger.event.data.plan %}{% set p=r|from_json({}) if r is string else r %}
         {% set details={'session':trigger.event.data.session,'plan':p,'basis':'captured before admission publication'} %}
        {% elif trigger.id == 'control_state' %}
         {% set details={'entity_id':trigger.entity_id,'previous':trigger.from_state.state if trigger.from_state else none,'value':trigger.to_state.state if trigger.to_state else none,'plan_observed_at_event':p} %}
        {% else %}{% set details={'plan':p,'control':state_attr('sensor.energy_battery_control_health','diagnostic_snapshot'),'session':states('input_text.energy_battery_charge_session')} %}{% endif %}
        {{ {'event':trigger.id,'event_id': (as_timestamp(now())*1000000)|int|string, 'captured_at':utcnow().isoformat(), 'payload':details}|tojson }}
