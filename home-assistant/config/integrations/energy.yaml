  ###########################################################################
  # FORECAST FLAGS / OPERATING MODE
  ###########################################################################
  - binary_sensor:
    - name: Energy Recovery Target Forecast Available
      unique_id: energy_recovery_target_forecast_available
      state: |-
        {% from 'energy_battery_authority.jinja' import battery_plan_authority %}
        {% set current_plan_authority=battery_plan_authority|as_function %}
        {% set authority_raw=state_attr('sensor.energy_recovery_forecast_model_cache','model_data') %}
        {% set authority_plan=authority_raw if authority_raw is mapping else authority_raw|from_json({}) if authority_raw is string else {} %}
        {% set authority_source=states.sensor.energy_solcast_planning_snapshot %}
        {% set authority_snapshot=dict(authority_source.attributes,state=authority_source.state) if authority_source is not none else {} %}
        {% set plan_authority_ok=current_plan_authority(authority_plan,has_value('sensor.energy_recovery_forecast_model_cache') and state_attr('sensor.energy_recovery_forecast_model_cache','restored') != true,authority_snapshot,as_timestamp(now())) %}
        {{ plan_authority_ok }}
      attributes:
        provisional: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).provisional|default(true)
          }}'
        source_snapshot_id: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).source_snapshot_id|default(none)
          }}'
        recovery_target_day: '{{ (state_attr(''sensor.energy_recovery_forecast_model_cache'',''model_data'')|default(''{}'',true)|from_json({})).target_day|default(none)
          }}'

  - sensor:
      - name: Energy Operating Mode
        unique_id: energy_operating_mode
        state: >
          {% set peak = is_state('binary_sensor.energy_tariff_peak', 'on') %}
          {% set ev_window = is_state('binary_sensor.energy_tariff_ev', 'on') %}
          {% set needs_support = is_state('binary_sensor.energy_battery_needs_overnight_support', 'on') %}
          {% set allow_overnight = is_state('input_boolean.energy_allow_overnight_battery_charge', 'on') %}
          {% if peak %}
            peak protection
          {% elif ev_window and needs_support and allow_overnight %}
            overnight recovery
          {% else %}
            solar first
          {% endif %}
        attributes:
          peak_tariff: "{{ is_state('binary_sensor.energy_tariff_peak', 'on') }}"
          ev_tariff_window: "{{ is_state('binary_sensor.energy_tariff_ev', 'on') }}"
          needs_overnight_support: "{{ is_state('binary_sensor.energy_battery_needs_overnight_support', 'on') }}"
          overnight_charge_allowed: "{{ is_state('input_boolean.energy_allow_overnight_battery_charge', 'on') }}"
          battery_soc_pct: "{{ states('sensor.energy_battery_soc') | float(0) | round(1) }}"
          overnight_target_soc_pct: "{{ states('sensor.energy_battery_overnight_target_soc') | float(0) | round(1) }}"
          grid_charge_overnight: "{{ is_state('binary_sensor.energy_battery_should_grid_charge_overnight', 'on') }}"

  ###########################################################################
  # BILLING
  ###########################################################################
  - sensor:
    - name: Energy Cost Daily Import
      unique_id: energy_cost_daily_import
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set peak = states('sensor.energy_grid_import_daily_peak') | float(0) %} {% set shoulder = states('sensor.energy_grid_import_daily_shoulder') | float(0) %} {% set offpeak = states('sensor.energy_grid_import_daily_offpeak') | float(0) %} {% set ev = states('sensor.energy_grid_import_daily_ev') | float(0) %} {% set rate_peak = states('input_number.energy_rate_import_peak') | float(0) %} {% set rate_shoulder = states('input_number.energy_rate_import_shoulder') | float(0) %} {% set rate_offpeak = states('input_number.energy_rate_import_offpeak') | float(0) %} {% set rate_ev = states('input_number.energy_rate_import_ev') | float(0) %} {% set credit_ev = states('input_number.energy_rate_ev_credit') | float(0) %} {{
          (
            (peak * rate_peak)
            + (shoulder * rate_shoulder)
            + (offpeak * rate_offpeak)
            + (ev * rate_ev)
            - (ev * credit_ev)
          ) | round(2)
        }}
    - name: Energy Credit Daily Export
      unique_id: energy_credit_daily_export
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set export = states('sensor.energy_grid_export_daily') | float(0) %} {% set rate_export = states('input_number.energy_rate_export') | float(0) %} {{ (export * rate_export) | round(2) }}
    - name: Energy Cost Daily Supply
      unique_id: energy_cost_daily_supply
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {{ states('input_number.energy_rate_supply_daily') | float(0) | round(2) }}
    - name: Energy Cost Daily Net
      unique_id: energy_cost_daily_net
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set import_cost = states('sensor.energy_cost_daily_import') | float(0) %} {% set export_credit = states('sensor.energy_credit_daily_export') | float(0) %} {% set supply = states('sensor.energy_cost_daily_supply') | float(0) %} {{ (import_cost + supply - export_credit) | round(2) }}
    - name: Energy Cost Monthly Import
      unique_id: energy_cost_monthly_import
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set peak = states('sensor.energy_grid_import_monthly_peak') | float(0) %} {% set shoulder = states('sensor.energy_grid_import_monthly_shoulder') | float(0) %} {% set offpeak = states('sensor.energy_grid_import_monthly_offpeak') | float(0) %} {% set ev = states('sensor.energy_grid_import_monthly_ev') | float(0) %} {% set rate_peak = states('input_number.energy_rate_import_peak') | float(0) %} {% set rate_shoulder = states('input_number.energy_rate_import_shoulder') | float(0) %} {% set rate_offpeak = states('input_number.energy_rate_import_offpeak') | float(0) %} {% set rate_ev = states('input_number.energy_rate_import_ev') | float(0) %} {% set credit_ev = states('input_number.energy_rate_ev_credit') | float(0) %} {{
          (
            (peak * rate_peak)
            + (shoulder * rate_shoulder)
            + (offpeak * rate_offpeak)
            + (ev * rate_ev)
            - (ev * credit_ev)
          ) | round(2)
        }}
    - name: Energy Credit Monthly Export
      unique_id: energy_credit_monthly_export
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set export = states('sensor.energy_grid_export_monthly') | float(0) %} {% set rate_export = states('input_number.energy_rate_export') | float(0) %} {{ (export * rate_export) | round(2) }}
    - name: Energy Cost Monthly Supply
      unique_id: energy_cost_monthly_supply
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set daily_supply = states('input_number.energy_rate_supply_daily') | float(0) %} {{ (now().day * daily_supply) | round(2) }}
    - name: Energy Cost Monthly Net
      unique_id: energy_cost_monthly_net
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set import_cost = states('sensor.energy_cost_monthly_import') | float(0) %} {% set export_credit = states('sensor.energy_credit_monthly_export') | float(0) %} {% set supply = states('sensor.energy_cost_monthly_supply') | float(0) %} {{ (import_cost + supply - export_credit) | round(2) }}
    - name: Energy Cost Monthly Projection
      unique_id: energy_cost_monthly_projection
      unit_of_measurement: AUD
      device_class: monetary
      state: |
        {% set current_total = states('sensor.energy_cost_monthly_net') | float(0) %} {% set days_elapsed = now().day %} {% set next_month = now().replace(day=28) + timedelta(days=4) %} {% set days_in_month = (next_month - timedelta(days=next_month.day)).day %} {% if days_elapsed > 0 %}
          {{ ((current_total / days_elapsed) * days_in_month) | round(2) }}
        {% else %}
          0
        {% endif %}

