    variables:
      current_plan: '{% set r=trigger.to_state.attributes.get(''model_data'') if trigger.to_state else none %}{{ r|from_json({}) if r is string
        else r if r is mapping else {} }}'
      previous_plan: '{% set r=trigger.from_state.attributes.get(''model_data'') if trigger.from_state else none %}{{ r|from_json({}) if r is string
        else r if r is mapping else {} }}'
      captured_record: '{{ {''event'':''plan_changed'',''event_id'': (as_timestamp(now())*1000000)|int|string, ''captured_at'':utcnow().isoformat(),
        ''payload'':{''plan'':current_plan}}|tojson }}'
    conditions:
    - condition: template
      value_template: '{% set n=namespace(changed=false) %}{% for key in [''source_snapshot_id'', ''target_day'', ''diagnostic_status'', ''diagnostic_reason_code'',
        ''usable_inputs'', ''ready'', ''provisional'', ''target_soc'', ''grid_topup_kwh'', ''charge_window_shortfall_kwh'', ''target_cap_shortfall_kwh'',
        ''trajectory_unserved_kwh''] %}{% set a=current_plan.get(key) %}{% set b=previous_plan.get(key) %}{% if a is number %}{% set a=a|round(1)
        %}{% endif %}{% if b is number %}{% set b=b|round(1) %}{% endif %}{% if a != b %}{% set n.changed=true %}{% endif %}{% endfor %}{{ current_plan|length>0
        and n.changed }}'
    actions:
    - action: script.energy_battery_record_decision
      data:
