- id: '1711799150288'
  alias: Aircon update ac options
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - climate.ac_0
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ac_0
      state: 'off'
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.climate_ac_options
    data:
      option: '{{ states(''climate.ac_0'') }}'
  mode: single
