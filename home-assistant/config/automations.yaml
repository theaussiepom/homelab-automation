- id: '1709358090228'
  alias: Guest lights off select scene
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - light.helper_light_guest_all
    to: 'off'
  conditions: []
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.options_scene_guest
    data:
      option: 'off'
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.scene_guest_bright
      - input_boolean.scene_guest_chill
      - input_boolean.scene_guest_nightlight
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.scene_guest_off
  mode: single
