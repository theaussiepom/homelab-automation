- id: '1745548487231'
  alias: Alert Node-RED when Home Assistant starts
  description: ''
  triggers:
  - alias: When Home Assistant starts
    trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - action: button.press
    target:
      entity_id: button.nodered_032732103b651fc0
  mode: single
