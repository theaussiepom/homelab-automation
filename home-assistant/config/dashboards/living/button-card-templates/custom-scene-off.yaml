custom_scene_off_card:
  color_type: card
  color: var(--secondary-background-color)
  show_name: false
  size: 50px
  aspect_ratio: 1/1
  tap_action:
    action: call-service
    service: scene.turn_on
    target:
      entity_id: "[[[ return variables.scene ]]]"
    data:
      transition: 1
  state:
    - value: "off"
      color: var(--secondary-background-color)
  styles:
    card:
      - border-radius: 50%
      - border: none
      - visibility: |
          [[[
            return entity.state == "on"
              ? "hidden"
              : "visible"
          ]]]
      - margin: "-5px 0px 0px 5px"
    icon:
      - color: var(--primary-select-color)

custom_script_off_card:
  template: custom_scene_off_card
  tap_action:
    service: script.turn_on
    data: "[[[ return {}; ]]]"
