custom_scene_card:
  color_type: card
  tap_action:
    action: call-service
    service: scene.turn_on
    target:
      entity_id: "[[[ return variables.scene ]]]"
    data:
      transition: 1
  show_name: false
  aspect_ratio: 1/1
  styles:
    card:
      - border-radius: 20px
      - border-color: var(--secondary-base-color);
      - border-width: 2px;
    icon:
      - width: 100%
      - transform: |
          [[[ return `scale(${variables.iconScale})` ]]]
      - color: var(--scene-icon-color)
  state:
    - value: "on"
      color: var(--scene-on-background-color)
    - value: "off"
      color: var(--scene-off-background-color)

custom_script_card:
  template: custom_scene_card
  tap_action:
    service: script.turn_on
    data: "[[[ return {}; ]]]"
