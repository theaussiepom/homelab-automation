- title: Battery health
  path: home-batteries
  icon: mdi:battery-heart-variant
  subview: true
  theme: living-tablet
  back_path: /lovelace-living/house
  type: custom:grid-layout
  layout:
    grid-template-columns: 30px 980px auto 100px auto
    grid-template-areas: '"m1 c1 m2 c2 m3"

      '
    margin: 30px 0px
  cards:
  - type: custom:stack-in-card
    view_layout:
      grid-area: c1
    keep:
      background: true
      border_radius: true
    cards:
    - type: custom:button-card
      name: Battery health
      icon: mdi:battery-heart-variant
      styles:
        card:
        - height: 64px
        - border: none
        - background: transparent
        - box-shadow: none
        - padding: 0 10px
        grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 62px 1fr
        icon:
        - width: 43px
        - color: var(--primary-base-color)
        name:
        - font-size: 31px
        - font-weight: '650'
        - color: var(--primary-base-color)
        - justify-self: start
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
    - type: custom:gap-card
      height: 12
    - type: custom:stack-in-card
      cards:
      - type: vertical-stack
        cards:
        - type: custom:auto-entities
          card:
            type: entities
            title: Battery health
            show_header_toggle: false
            state_color: true
            card_mod:
              style: "ha-card {\n  background: transparent; box-shadow: none; border: none;\n  color: var(--primary-base-color);\
                \ border-radius: 20px;\n  --primary-text-color: var(--primary-base-color);\n  --secondary-text-color: var(--secondary-base-color);\n\
                \  --paper-item-icon-color: var(--primary-base-color);\n  --state-binary_sensor-moisture-on-color: var(--red);\n\
                \  --state-binary_sensor-smoke-on-color: var(--red);\n}\n.card-header { font-weight: 650; font-size: 23px;\
                \ padding-top: 14px; }\n"
          filter:
            template: '{% set names = {"binary_sensor.bathroom_leak_sink_water_leak": "Bathroom sink", "binary_sensor.ensuite_leak_sink_left_water_leak":
              "En Suite left sink", "binary_sensor.ensuite_leak_sink_right_water_leak": "En Suite right sink", "binary_sensor.kitchen_leak_fridge_water_leak":
              "Kitchen fridge", "binary_sensor.kitchen_leak_sink_water_leak": "Kitchen sink", "binary_sensor.laundry_leak_floor_water_leak":
              "Laundry floor", "binary_sensor.laundry_leak_sink_water_leak": "Laundry sink", "binary_sensor.smoke_detector_smoke_detected":
              "Smoke detector", "binary_sensor.zigbee2mqtt_bridge_connection_state": "Zigbee1 bridge", "binary_sensor.zigbee2mqtt_bridge_connection_state_2":
              "Zigbee2 bridge", "sensor.tablet_living_kiosk_battery": "Living tablet", "binary_sensor.bathroom_vibration_shower_vibration":
              "Bathroom vibration sensor", "binary_sensor.ensuite_vibration_sensor_vibration": "En Suite vibration sensor"}
              %}

              {% set ns = namespace(rows=[]) %}

              {% for eid in label_entities(''low_battery'') | sort if eid not in (state_attr(''sensor.notify_battery_ignore'',''entity_id'')
              or []) %}

              {% set value = states(eid) %}

              {% set dc = state_attr(eid, ''device_class'') %}

              {% if not (false) and (true) %}

              {% set ns.rows = ns.rows + [{''entity'': eid, ''name'': names.get(eid, state_attr(eid, ''friendly_name'') or
              eid), ''secondary_info'': ''last-changed'', ''tap_action'': {''action'':''none''}, ''hold_action'': {''action'':''none''},
              ''double_tap_action'': {''action'':''none''}}] %}

              {% endif %}

              {% endfor %}

              {{ ns.rows | to_json }}'
          unique: true
          else:
            type: custom:button-card
            name: All clear
            label: No low-battery alerts
            icon: mdi:battery-check-outline
            show_label: true
            styles:
              card:
              - background: transparent
              - border: none
              - box-shadow: none
              - height: 175px
              - padding: 20px
              icon:
              - width: 54px
              - color: var(--green)
              name:
              - font-size: 23px
              - font-weight: '650'
              - color: var(--primary-base-color)
              label:
              - font-size: 17px
              - color: var(--secondary-base-color)
              grid:
              - grid-template-rows: 64px 34px 28px
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
      keep:
        background: true
        border_radius: true
      card_mod:
        style: "ha-card {\n  height: 600px; box-sizing: border-box; overflow-y: auto; overflow-x: hidden;\n  padding: 0 8px\
          \ 12px; border: none; border-radius: 16px;\n  background: transparent; box-shadow: none; overscroll-behavior: contain;\n\
          \  scrollbar-width: thin; scrollbar-color: var(--secondary-base-color) transparent;\n}\n"
    card_mod:
