        \ border-radius: 30px;\n  background: var(--tablet-card-background-color); box-shadow: none;\n  --primary-text-color:\
        \ var(--primary-base-color);\n  --secondary-text-color: var(--secondary-base-color);\n  --ha-card-background: transparent;\
        \ --card-background-color: transparent;\n}\n"
