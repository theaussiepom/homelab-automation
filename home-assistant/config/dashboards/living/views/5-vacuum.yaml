- title: Downstairs vacuum
  path: vacuum
  subview: true
  back_path: /lovelace-living/home
  icon: mdi:robot-vacuum
  type: custom:grid-layout
  layout:
    grid-template-columns: 30px 980px auto 100px auto
    grid-template-areas: |
      "m1 c1 m2 c2 m3"
    margin: 30px 0px
  cards:
    - type: custom:stack-in-card
      view_layout:
        grid-area: c1
      card_mod:
        style: |
          ha-card {
            border-width: 5px;
            border-color: var(--primary-base-color);
            border-radius: 30px;
            background: var(--tablet-card-background-color);
          }
      cards:
        - type: custom:dreame-vacuum-card
          entity: vacuum.downstairs_robot
    - type: custom:layout-card
      layout_type: custom:vertical-layout
      view_layout:
        grid-area: c2
      layout:
        width: 100
      cards:
        - type: custom:gap-card
          height: 45
        - type: custom:button-card
          color_type: card
          color: var(--scene-on-background-color)
          icon: mdi:arrow-left-bold-outline
          show_name: false
          aspect_ratio: 1/1
          tap_action:
            action: navigate
            navigation_path: /lovelace-living/home
          styles:
            card:
              - border-radius: 20px
              - border-color: var(--secondary-base-color)
              - border-width: 2px
              - background: var(--opaque-background-color)
            icon:
              - width: 100%
              - color: var(--scene-icon-color)
        - type: custom:gap-card
          height: 40
        - type: custom:button-card
          entity: sensor.downstairs_robot_battery_level
          show_name: false
          aspect_ratio: 1/1
          tap_action: none
          styles:
            card:
              - border-radius: 20px
              - border-color: var(--secondary-base-color)
              - border-width: 2px
              - background: var(--opaque-background-color)
            icon:
              - width: 80%
              - color: |
                  [[[
                     if (entity.state > 80)
                       return 'var(--green)'
                      
                      if (entity.state > 20)
                        return 'var(--yellow)'

                      return 'var(--red)'
                  ]]]
        - type: custom:gap-card
          height: 40
        - type: custom:button-card
          entity: sensor.downstairs_robot_low_water_warning
          show_name: false
          aspect_ratio: 1/1
          tap_action: none
          styles:
            card:
              - border-radius: 20px
              - border-color: var(--secondary-base-color)
              - border-width: 2px
              - background: var(--opaque-background-color)
            icon:
              - width: 80%
              - color: |
                  [[[
                     if (entity.state == "no_warning")
                       return 'var(--green)'

                      return 'var(--red)'
                  ]]]
        - type: custom:gap-card
          height: 40
        - type: custom:button-card
          color_type: card
          color: var(--scene-on-background-color)
          icon: mdi:stairs-up
          name: Upstairs
          show_name: true
          aspect_ratio: 1/1
          tap_action:
            action: navigate
            navigation_path: /lovelace-living/vacuum-upstairs
          hold_action:
            action: none
          double_tap_action:
            action: none
          styles:
            card:
              - border-radius: 20px
              - border-color: var(--secondary-base-color)
              - border-width: 2px
              - background: var(--opaque-background-color)
              - padding: 8px
            icon:
              - width: 65%
              - color: var(--scene-icon-color)
            name:
              - font-size: 12px
              - color: var(--scene-icon-color)
