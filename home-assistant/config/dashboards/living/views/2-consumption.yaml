- title: Consumption
  path: consumption
  subview: true
  icon: mdi:lightning-bolt
  type: custom:grid-layout
  layout:
    grid-template-columns: 80px auto
    grid-template-areas: |
      "c1 c1"
      "a1 a2"
      "b1 b1"
    margin: '-4px'
    card_margin: 0px
  theme: living-tablet
  background: "#EDE5D1E0"
  cards:
    - type: custom:stack-in-card
      view_layout:
        grid-area: c1
      cards:
      - type: custom:button-card
        entity: sensor.battery_level
        name: Battery charge
        icon: mdi:battery-arrow-up-outline
        show_name: true
        show_label: true
        label: '[[[ const status=states[''input_text.sg_battery_target_charge_status'']?.state; let text=status && ![''unknown'',''unavailable''].includes(status)
          ? status : ''Idle''; const active=states[''switch.sg_battery_charge_now'']?.state===''on''; const power=states[''sensor.battery_power_raw''];
          const watts=Number(power?.state); if (active && states[''sensor.ems_mode_selection_raw'']?.state===''2'' && states[''sensor.battery_forced_charge_discharge_cmd_raw'']?.state===''170''
          && power && Number.isFinite(watts) && ![''unknown'',''unavailable''].includes(power.state)) text += ` · ${(Math.abs(watts)/1000).toFixed(1)}
          kW`; return text.replace(/[&<>"'']/g, c=>({''&'':''&amp;'',''<'':''&lt;'',''>'':''&gt;'',''"'':''&quot;'',"''":''&#39;''}[c])); ]]]'
        custom_fields:
          level: '[[[ const n=Number(entity?.state); return entity && ![''unknown'',''unavailable''].includes(entity.state) && Number.isFinite(n)
            ? `${Math.round(n)}%` : ''—''; ]]]'
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        triggers_update:
        - input_text.sg_battery_target_charge_status
        - switch.sg_battery_charge_now
        - sensor.battery_power_raw
        - sensor.ems_mode_selection_raw
        - sensor.battery_forced_charge_discharge_cmd_raw
        styles:
          card:
          - border: none
          - background: transparent
          - box-shadow: none
          - padding: '0'
          - min-height: 80px
          grid:
          - grid-template-areas: '"i n level" "i l level"'
          - grid-template-columns: 56px 1fr auto
          - grid-template-rows: 40px minmax(24px,auto)
          - column-gap: 14px
          icon:
          - width: 46px
          - color: '[[[ return states[''switch.sg_battery_charge_now'']?.state===''on'' ? ''var(--green)'' : ''var(--primary-base-color)''; ]]]'
          name:
          - justify-self: start
          - font-size: 28px
          - font-weight: '700'
          - color: var(--primary-base-color)
          label:
          - justify-self: start
          - text-align: left
          - white-space: normal
          - font-size: 16px
          - color: var(--secondary-base-color)
          custom_fields:
            level:
            - font-size: 38px
            - font-weight: '700'
            - color: var(--primary-base-color)
            - align-self: center
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(6, 100px) 10px 100px
          grid-template-areas: '"t50 t60 t70 t80 t90 t100 gap stop"'
          grid-column-gap: 16px
          grid-row-gap: 16px
          grid-template-rows: 100px
          justify-content: center
          margin: '0'
          card_margin: '0'
          mediaquery:
            '(max-width: 950px)':
              grid-template-columns: repeat(3, minmax(80px, 100px))
              grid-template-rows: repeat(3, 100px)
              grid-template-areas: '"t50 t60 t70" "t80 t90 t100" "stop stop stop"'
