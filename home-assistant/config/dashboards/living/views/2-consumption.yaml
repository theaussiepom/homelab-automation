          - sensor.energy_ev_charging_energy_total
          - sensor.total_daily_energy
          - sensor.sh10rs_a2392201672_total_feed_in_energy
          name: " "
          entity_id: daily_energy_import
          color: "#585123"
          tap_action:
            action: none
      - entities:
        - type: entity
          entity_id: sensor.sh10rs_a2392201672_daily_battery_charging_energy
          subtract_entities:
          - sensor.sh10rs_a2392201672_daily_battery_discharging_energy
          children: []
          name: Net to battery
          color: "#5E8C61"
        - type: remaining_parent_state
          children:
          - sensor.power_daily_energy_aircon
          - sensor.power_daily_energy_downstairs
          - sensor.power_daily_energy_upstairs
          - sensor.power_daily_energy_lights
          name: Home
          entity_id: sensor.total_daily_energy
          children_sum:
            should_be: equal
          color: "#EB6424"
          tap_action:
            action: none
        - type: entity
          children: []
          entity_id: sensor.energy_ev_charging_energy_total
          name: EV charging at home
          color: "#AE8CA3"
        - type: entity
          children: []
