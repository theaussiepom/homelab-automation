        - type: custom:button-card
          color_type: card
          entity: switch.sg_battery_charge_now
          show_name: true
          show_icon: true
          hold_action:
            action: none
          double_tap_action:
            action: none
          styles:
            card:
            - width: 100px
            - min-width: 100px
            - height: 100px
            - padding: 10px
            - box-shadow: none
            - border-style: solid
            - border-color: var(--secondary-base-color)
            - border-width: 2px
            - border-radius: 20px
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr 30px
            icon:
            - width: 44px
            - height: 44px
            - transform: none
            - color: var(--scene-icon-color)
            name:
            - font-size: 24px
            - font-weight: '700'
            - color: var(--primary-base-color)
          tap_action:
            action: call-service
            service: script.sg_charge_battery_to_target
            service_data:
              target_soc: '50'
          triggers_update:
          - input_text.sg_battery_manual_lease
          - input_select.sg_battery_charge_target
          - input_boolean.sg_battery_target_preparing
          - script.sg_charge_battery_to_target
          name: 50%
          icon: mdi:battery-50
          view_layout:
            grid-area: t50
          state:
          - operator: template
            value: '[[[ try { const lease=JSON.parse(states[''input_text.sg_battery_manual_lease'']?.state || ''{}''); return entity?.state===''on''
              && lease.kind===''target'' && !lease.done && lease.target===50; } catch { return false; } ]]]'
            styles:
              card:
              - background: var(--scene-on-background-color)
