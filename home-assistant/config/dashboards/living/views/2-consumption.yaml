    - type: custom:sankey-chart
      layout: auto
      height: 670
      unit_prefix: k
      round: 1
      convert_units_to: ''
      co2_intensity_entity: sensor.co2_signal_co2_intensity
      gas_co2_intensity: 2351.6459999999997
      min_box_size: 10
      min_box_distance: 5
      show_states: true
      show_units: true
      sections:
      - entities:
        - type: entity
          children:
          - daily_energy_import
          entity_id: sensor.sh10rs_a2392201672_total_purchased_energy
          name: From Grid
          color: "#474954"
        - type: entity
          children:
          - daily_energy_import
          entity_id: sensor.sh10rs_a2392201672_daily_battery_discharging_energy
          subtract_entities:
