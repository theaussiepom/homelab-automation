- title: Security
  path: security
  icon: mdi:shield-home-outline
  subview: true
  theme: living-tablet
  back_path: /lovelace-living/home
  type: custom:grid-layout
  layout:
    grid-template-columns: 30px 980px auto 100px auto
    grid-template-areas: '"m1 c1 m2 c2 m3"

      '
    margin: 30px 0px
  cards:
  - type: custom:stack-in-card
    view_layout:
      grid-area: c1
    keep:
      background: true
      border_radius: true
    cards:
    - type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: 230px 1fr
        grid-gap: 20px
        margin: '0'
        padding: '0'
        card-margin: '0'
      cards:
      - type: custom:button-card
        name: Security
        icon: mdi:shield-home-outline
        styles:
          card:
          - height: 64px
          - border: none
          - background: transparent
          - box-shadow: none
          - padding: 0 10px
          grid:
          - grid-template-areas: '"i n"'
          - grid-template-columns: 55px 1fr
          icon:
          - width: 39px
          - color: var(--primary-base-color)
          name:
          - font-size: 31px
          - font-weight: '650'
          - color: var(--primary-base-color)
          - justify-self: start
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: alarm_control_panel.house_alarm
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0,1fr) 120px
          grid-gap: 4px
          margin: '0'
          padding: '0'
          card-margin: '0'
        cards:
        - type: custom:group-person-pills
          entity: group.persons
          variant: card
          card:
            type: custom:button-card
            icon: mdi:account
            show_label: true
            label: '[[[ return !entity || [''unknown'',''unavailable''].includes(entity.state) ? ''Unavailable'' : entity.state===''home''
              ? ''Home'' : entity.state===''not_home'' ? ''Away'' : entity.state; ]]]'
            styles:
              card:
              - height: 60px
              - background: transparent
              - border: none
              - border-radius: 18px
              - padding: 8px 4px
              - box-shadow: none
              grid:
              - grid-template-areas: '"i n" "i l"'
              - grid-template-columns: 24px 1fr
              - grid-template-rows: 1fr 1fr
              icon:
              - width: 24px
              - color: '[[[ return [''on'',''home''].includes(entity?.state) ? ''var(--green)'' : ''var(--secondary-base-color)'';
                  ]]]'
              name:
              - justify-self: start
              - font-size: 16px
              - font-weight: '650'
              - color: var(--primary-base-color)
              label:
              - justify-self: start
              - font-size: 14px
              - color: var(--secondary-base-color)
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
            name: '[[[ return entity?.attributes?.friendly_name || entity?.entity_id?.slice(7) || ''Person''; ]]]'
        - type: custom:button-card
          entity: input_boolean.house_alarm_automatic_arming
          name: Auto Arm
          icon: mdi:shield-sync
          show_label: true
          label: '[[[ return !entity || [''unknown'',''unavailable''].includes(entity.state) ? ''Unavailable'' : entity.state ===
            ''on'' ? ''On'' : ''Off''; ]]]'
          styles:
            card:
            - height: 60px
            - background: var(--opaque-background-color)
            - border: none
            - border-radius: 18px
            - padding: 8px 4px
            - box-shadow: none
            - border: 1px solid var(--secondary-base-color)
            grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 24px 1fr
            - grid-template-rows: 1fr 1fr
            icon:
            - width: 24px
            - color: '[[[ return [''on'',''home''].includes(entity?.state) ? ''var(--green)'' : ''var(--secondary-base-color)'';
                ]]]'
            name:
            - justify-self: start
            - font-size: 16px
            - font-weight: '650'
            - color: var(--primary-base-color)
            label:
            - justify-self: start
            - font-size: 14px
            - color: var(--secondary-base-color)
          tap_action:
            action: toggle
          hold_action:
            action: none
          double_tap_action:
            action: none
    - type: custom:gap-card
      height: 12
    - type: custom:stack-in-card
      cards:
      - type: vertical-stack
        cards:
        - type: custom:stack-in-card
          keep:
            background: true
            border_radius: true
          cards:
          - type: conditional
            conditions:
            - condition: state
              entity: alarm_control_panel.house_alarm
              state: disarmed
            card:
              type: grid
              columns: 2
              square: false
              cards:
              - type: custom:button-card
                entity: binary_sensor.house_alarm_perimeter_ready
                name: Arm (Axl)
                icon: mdi:paw
                show_name: true
                show_label: true
                show_state: false
                label: '[[[ return !entity || ![''on'',''off''].includes(entity.state) ? ''Unavailable'' : entity.state===''on''
                  ? "Perimeter" : ''Check sensors''; ]]]'
                tap_action:
                  action: call-service
                  service: alarm_control_panel.alarm_arm_home
                  target:
                    entity_id: alarm_control_panel.house_alarm
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                styles:
                  card:
                  - height: 136px
                  - padding: 16px
                  - border-radius: 20px
                  - background: color-mix(in srgb, var(--green) 55%, var(--opaque-background-color))
                  - border: 1px solid rgba(27,36,50,.18)
                  - box-shadow: none
                  grid:
                  - grid-template-areas: '"i n" "i l"'
                  - grid-template-columns: 80px 1fr
                  - grid-template-rows: 1fr 1fr
                  - column-gap: 12px
                  - padding-right: 24px
                  icon:
                  - width: 64px
                  - color: var(--primary-base-color)
                  name:
                  - font-size: 28px
                  - font-weight: '650'
                  - color: var(--primary-base-color)
                  - justify-self: start
                  - align-self: end
                  label:
                  - font-size: 17px
                  - color: var(--primary-base-color)
                  - justify-self: start
                  - align-self: start
                  - padding-top: 7px
                  custom_fields:
                    ready:
                    - position: absolute
                    - top: 12px
                    - right: 12px
                custom_fields:
                  ready: '[[[ const ok=entity?.state===''on''; const known=[''on'',''off''].includes(entity?.state); return
                    `<ha-icon icon="${ok?''mdi:check-circle-outline'':known?''mdi:alert-circle-outline'':''mdi:help-circle-outline''}"
                    style="width:24px;height:24px;color:var(--primary-base-color)" aria-label="${ok?''Ready'':known?''Check
                    sensors'':''Unavailable''}"></ha-icon>`; ]]]'
              - type: custom:button-card
                entity: binary_sensor.house_alarm_away_ready
                name: Arm
                icon: mdi:shield-lock-outline
                show_name: true
                show_label: true
                show_state: false
                label: '[[[ return !entity || ![''on'',''off''].includes(entity.state) ? ''Unavailable'' : entity.state===''on''
                  ? "Doors + motion" : ''Check sensors''; ]]]'
                tap_action:
                  action: call-service
                  service: alarm_control_panel.alarm_arm_away
                  target:
                    entity_id: alarm_control_panel.house_alarm
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                styles:
                  card:
                  - height: 136px
                  - padding: 16px
                  - border-radius: 20px
                  - background: color-mix(in srgb, var(--green) 55%, var(--opaque-background-color))
                  - border: 1px solid rgba(27,36,50,.18)
                  - box-shadow: none
                  grid:
                  - grid-template-areas: '"i n" "i l"'
                  - grid-template-columns: 80px 1fr
                  - grid-template-rows: 1fr 1fr
                  - column-gap: 12px
                  - padding-right: 24px
                  icon:
                  - width: 64px
                  - color: var(--primary-base-color)
                  name:
                  - font-size: 28px
                  - font-weight: '650'
                  - color: var(--primary-base-color)
                  - justify-self: start
                  - align-self: end
                  label:
                  - font-size: 17px
                  - color: var(--primary-base-color)
                  - justify-self: start
                  - align-self: start
                  - padding-top: 7px
                  custom_fields:
                    ready:
                    - position: absolute
                    - top: 12px
                    - right: 12px
                custom_fields:
                  ready: '[[[ const ok=entity?.state===''on''; const known=[''on'',''off''].includes(entity?.state); return
                    `<ha-icon icon="${ok?''mdi:check-circle-outline'':known?''mdi:alert-circle-outline'':''mdi:help-circle-outline''}"
                    style="width:24px;height:24px;color:var(--primary-base-color)" aria-label="${ok?''Ready'':known?''Check
                    sensors'':''Unavailable''}"></ha-icon>`; ]]]'
          - type: conditional
            conditions:
            - condition: state
              entity: alarm_control_panel.house_alarm
              state_not: disarmed
            card:
              type: custom:living-alarm-keypad
              entity: alarm_control_panel.house_alarm
          card_mod:
            style: ha-card { background:var(--opaque-background-color); border:1px solid var(--secondary-base-color); border-radius:24px;
              box-shadow:none; padding:8px; box-sizing:border-box; }
        - type: conditional
          conditions:
          - entity: timer.house_alarm_countdown
            state: active
          card:
            type: entities
            entities:
            - type: simple-entity
              entity: timer.house_alarm_countdown
              name: Countdown
              icon: mdi:timer-sand
              tap_action:
                action: none
              hold_action:
                action: none
              double_tap_action:
                action: none
            card_mod:
              style: ha-card { background:var(--opaque-background-color); border:0; border-radius:20px; box-shadow:none; color:var(--primary-base-color);
                --primary-text-color:var(--primary-base-color); --secondary-text-color:var(--secondary-base-color); --primary-color:var(--primary-base-color);
                --paper-item-icon-color:var(--primary-base-color); --state-alarm_control_panel-disarmed-color:var(--green);
                --state-alarm_control_panel-armed_home-color:var(--yellow); --state-alarm_control_panel-armed_night-color:var(--yellow);
                --state-alarm_control_panel-armed_away-color:var(--red); --state-alarm_control_panel-triggered-color:var(--red);
                } .card-header {font-weight:650; font-size:23px;}
        - type: conditional
          conditions:
          - condition: or
            conditions:
            - entity: binary_sensor.house_alarm_coverage_problem
              state: 'on'
            - entity: input_boolean.house_alarm_front_door_inside_exempt
              state: 'on'
            - entity: input_boolean.house_alarm_living_inside_exempt
              state: 'on'
            - entity: input_boolean.house_alarm_laundry_inside_exempt
              state: 'on'
          card:
            type: markdown
            content: '{% if is_state(''binary_sensor.house_alarm_coverage_problem'',''on'') %}<ha-alert alert-type="warning">Check
              active / unavailable sensors</ha-alert>{% endif %}

              {% for key,name in [(''front_door'',''Front Door''),(''living'',''Deck''),(''laundry'',''Laundry'')] %}{% if
              is_state(''input_boolean.house_alarm_''+key+''_inside_exempt'',''on'') %}⏸ {{ name }} inside · bypassed until
              closed

              {% endif %}{% endfor %}'
            entity_id:
            - binary_sensor.house_alarm_coverage_problem
            - input_text.house_alarm_status
            - input_boolean.house_alarm_front_door_inside_exempt
            - input_boolean.house_alarm_living_inside_exempt
            - input_boolean.house_alarm_laundry_inside_exempt
            card_mod:
              style: ha-card { background:var(--opaque-background-color); border:0; border-radius:20px; box-shadow:none; color:var(--primary-base-color);
                --primary-text-color:var(--primary-base-color); --secondary-text-color:var(--secondary-base-color); --primary-color:var(--primary-base-color);
                --paper-item-icon-color:var(--primary-base-color); --state-alarm_control_panel-disarmed-color:var(--green);
                --state-alarm_control_panel-armed_home-color:var(--yellow); --state-alarm_control_panel-armed_night-color:var(--yellow);
                --state-alarm_control_panel-armed_away-color:var(--red); --state-alarm_control_panel-triggered-color:var(--red);
                } .card-header {font-weight:650; font-size:23px;}
        - type: custom:button-card
          entity: input_text.house_alarm_status
          show_name: false
          show_icon: true
          show_label: true
          icon: mdi:alert-circle-outline
          label: '[[[ return entity?.state || ''''; ]]]'
          tap_action:
            action: none
          hold_action:
            action: none
          styles:
            card:
            - display: '[[[ return /^(Not armed:|Coverage check:)/.test(entity?.state||'''') ? ''block'' : ''none''; ]]]'
            - height: auto
            - background: var(--opaque-background-color)
            - border: none
            - border-radius: 18px
            - padding: 12px
            grid:
            - grid-template-areas: '"i l"'
            - grid-template-columns: 28px 1fr
            icon:
            - color: var(--yellow)
            - width: 22px
            label:
            - white-space: normal
            - text-align: left
            - font-size: 16px
            - color: var(--yellow)
          double_tap_action:
            action: none
        - type: custom:stack-in-card
          keep:
            background: true
            border_radius: true
          cards:
          - type: custom:button-card
            name: Perimeter
            icon: mdi:door-open
            label: '[[[ const ids=["binary_sensor.frontdoor_door_door_inside_frontdoor_contact", "binary_sensor.frontdoor_door_door_outside_frontdoor_contact",
              "binary_sensor.living_door_door_inside_living_contact", "binary_sensor.living_door_door_outside_living_contact",
              "binary_sensor.laundry_door_door_inside_laundry_contact", "binary_sensor.laundry_door_door_outside_laundry_contact",
              "binary_sensor.frontdoor_door_door_gate_deck_contact", "cover.garage_door"]; const values=ids.map(id=>states[id]?.state);
              const u=values.filter(s=>!s||[''unavailable'',''unknown''].includes(s)).length; const n=values.filter(s=>["on",
              "open", "opening", "closing"].includes(s)).length; return u ? u+'' unavailable'' : n ? n+" open" : "All closed";
              ]]]'
            triggers_update:
            - binary_sensor.frontdoor_door_door_inside_frontdoor_contact
            - binary_sensor.frontdoor_door_door_outside_frontdoor_contact
            - binary_sensor.living_door_door_inside_living_contact
            - binary_sensor.living_door_door_outside_living_contact
            - binary_sensor.laundry_door_door_inside_laundry_contact
            - binary_sensor.laundry_door_door_outside_laundry_contact
            - binary_sensor.frontdoor_door_door_gate_deck_contact
            - cover.garage_door
            tap_action:
              action: navigate
              navigation_path: /lovelace-living/security-entrances
            styles:
              card:
              - height: 40px
              - background: transparent
              - border: none
              - box-shadow: none
              - padding: 0 8px
              grid:
              - grid-template-areas: '"i n l"'
              - grid-template-columns: 38px 1fr auto
              icon:
              - width: 29px
              - color: '[[[ const v=["binary_sensor.frontdoor_door_door_inside_frontdoor_contact", "binary_sensor.frontdoor_door_door_outside_frontdoor_contact",
                  "binary_sensor.living_door_door_inside_living_contact", "binary_sensor.living_door_door_outside_living_contact",
                  "binary_sensor.laundry_door_door_inside_laundry_contact", "binary_sensor.laundry_door_door_outside_laundry_contact",
                  "binary_sensor.frontdoor_door_door_gate_deck_contact", "cover.garage_door"].map(id=>states[id]?.state);
                  return v.some(s=>!s||[''unknown'',''unavailable''].includes(s)) ? ''var(--red)'' : v.some(s=>["on", "open",
                  "opening", "closing"].includes(s)) ? ''var(--yellow)'' : ''var(--green)''; ]]]'
              name:
              - justify-self: start
              - font-size: 22px
              - font-weight: '650'
              - color: var(--primary-base-color)
              label:
              - justify-self: end
              - font-size: 16px
              - color: var(--secondary-base-color)
            show_name: true
            show_label: true
            hold_action:
              action: none
            double_tap_action:
              action: none
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(5,minmax(0,1fr))
              grid-gap: 4px
              margin: '0'
              padding: '0'
              card-margin: '0'
            cards:
            - type: custom:button-card
              name: Front Door
              show_icon: false
              show_label: true
              label: '[[[ const ids=["binary_sensor.frontdoor_door_door_inside_frontdoor_contact", "binary_sensor.frontdoor_door_door_outside_frontdoor_contact"];
                const a=ids.map(id=>states[id]?.state); const bypass=states["input_boolean.house_alarm_front_door_inside_exempt"]?.state===''on'';
                return a.some(s=>!s||[''unknown'',''unavailable''].includes(s)) ? ''Unavailable'' : a[0]===''on'' && a[1]===''on''
                ? ''Both open'' : a[1]===''on'' ? ''Screen open'' : a[0]===''on'' ? (bypass ? ''Inside bypassed'' : ''Inside
                open'') : ''Closed''; ]]]'
              triggers_update:
              - binary_sensor.frontdoor_door_door_inside_frontdoor_contact
              - binary_sensor.frontdoor_door_door_outside_frontdoor_contact
              - input_boolean.house_alarm_front_door_inside_exempt
              custom_fields:
                doors: '[[[ const ids=["binary_sensor.frontdoor_door_door_inside_frontdoor_contact", "binary_sensor.frontdoor_door_door_outside_frontdoor_contact"];
                  const a=ids.map(id=>states[id]?.state); const bypass=states["input_boolean.house_alarm_front_door_inside_exempt"]?.state===''on'';
                  return a.map((s,i)=>{ const c=!s||[''unknown'',''unavailable''].includes(s)?''var(--red)'':s===''on''?(i===0&&bypass?''var(--primary-select-color)'':''var(--yellow)''):''var(--green)'';
                  const icon=i===0?''mdi:door'':''mdi:door-sliding''; return `<span style="display:flex;flex-direction:column;align-items:center;gap:4px"><ha-icon
                  icon="${icon}" style="width:38px;height:38px;color:${c}"></ha-icon><span style="font-size:11px;color:var(--secondary-base-color)">${i===0?''Inside'':''Screen''}</span></span>`;
                  }).join(''''); ]]]'
              styles:
                card:
                - height: 132px
                - padding: 7px 8px
                - background: transparent
                - border: none
                - box-shadow: none
                - border-radius: 18px
                grid:
                - grid-template-areas: '"n" "doors" "l"'
                - grid-template-rows: 24px 62px 25px
                name:
                - font-size: 17px
                - font-weight: '650'
                - color: var(--primary-base-color)
                label:
                - font-size: 14px
                - color: var(--secondary-base-color)
                custom_fields:
                  doors:
                  - display: flex
                  - justify-content: center
                  - align-items: center
                  - gap: 22px
              tap_action:
                action: navigate
                navigation_path: /lovelace-living/security-entrances
              hold_action:
                action: none
              double_tap_action:
                action: none
            - type: custom:button-card
              name: Deck
              show_icon: false
              show_label: true
              label: '[[[ const ids=["binary_sensor.living_door_door_inside_living_contact", "binary_sensor.living_door_door_outside_living_contact"];
                const a=ids.map(id=>states[id]?.state); const bypass=states["input_boolean.house_alarm_living_inside_exempt"]?.state===''on'';
                return a.some(s=>!s||[''unknown'',''unavailable''].includes(s)) ? ''Unavailable'' : a[0]===''on'' && a[1]===''on''
                ? ''Both open'' : a[1]===''on'' ? ''Screen open'' : a[0]===''on'' ? (bypass ? ''Inside bypassed'' : ''Inside
                open'') : ''Closed''; ]]]'
              triggers_update:
              - binary_sensor.living_door_door_inside_living_contact
              - binary_sensor.living_door_door_outside_living_contact
              - input_boolean.house_alarm_living_inside_exempt
              custom_fields:
                doors: '[[[ const ids=["binary_sensor.living_door_door_inside_living_contact", "binary_sensor.living_door_door_outside_living_contact"];
                  const a=ids.map(id=>states[id]?.state); const bypass=states["input_boolean.house_alarm_living_inside_exempt"]?.state===''on'';
                  return a.map((s,i)=>{ const c=!s||[''unknown'',''unavailable''].includes(s)?''var(--red)'':s===''on''?(i===0&&bypass?''var(--primary-select-color)'':''var(--yellow)''):''var(--green)'';
                  const icon=i===0?''mdi:door'':''mdi:door-sliding''; return `<span style="display:flex;flex-direction:column;align-items:center;gap:4px"><ha-icon
                  icon="${icon}" style="width:38px;height:38px;color:${c}"></ha-icon><span style="font-size:11px;color:var(--secondary-base-color)">${i===0?''Inside'':''Screen''}</span></span>`;
                  }).join(''''); ]]]'
              styles:
                card:
                - height: 132px
                - padding: 7px 8px
                - background: transparent
                - border: none
                - box-shadow: none
                - border-radius: 18px
                grid:
                - grid-template-areas: '"n" "doors" "l"'
                - grid-template-rows: 24px 62px 25px
                name:
                - font-size: 17px
                - font-weight: '650'
                - color: var(--primary-base-color)
                label:
                - font-size: 14px
                - color: var(--secondary-base-color)
                custom_fields:
                  doors:
                  - display: flex
                  - justify-content: center
                  - align-items: center
                  - gap: 22px
              tap_action:
                action: navigate
                navigation_path: /lovelace-living/security-entrances
              hold_action:
                action: none
              double_tap_action:
                action: none
            - type: custom:button-card
              name: Laundry
              show_icon: false
              show_label: true
              label: '[[[ const ids=["binary_sensor.laundry_door_door_inside_laundry_contact", "binary_sensor.laundry_door_door_outside_laundry_contact"];
                const a=ids.map(id=>states[id]?.state); const bypass=states["input_boolean.house_alarm_laundry_inside_exempt"]?.state===''on'';
                return a.some(s=>!s||[''unknown'',''unavailable''].includes(s)) ? ''Unavailable'' : a[0]===''on'' && a[1]===''on''
                ? ''Both open'' : a[1]===''on'' ? ''Screen open'' : a[0]===''on'' ? (bypass ? ''Inside bypassed'' : ''Inside
                open'') : ''Closed''; ]]]'
              triggers_update:
              - binary_sensor.laundry_door_door_inside_laundry_contact
              - binary_sensor.laundry_door_door_outside_laundry_contact
              - input_boolean.house_alarm_laundry_inside_exempt
              custom_fields:
                doors: '[[[ const ids=["binary_sensor.laundry_door_door_inside_laundry_contact", "binary_sensor.laundry_door_door_outside_laundry_contact"];
                  const a=ids.map(id=>states[id]?.state); const bypass=states["input_boolean.house_alarm_laundry_inside_exempt"]?.state===''on'';
                  return a.map((s,i)=>{ const c=!s||[''unknown'',''unavailable''].includes(s)?''var(--red)'':s===''on''?(i===0&&bypass?''var(--primary-select-color)'':''var(--yellow)''):''var(--green)'';
                  const icon=i===0?''mdi:door'':''mdi:door-sliding''; return `<span style="display:flex;flex-direction:column;align-items:center;gap:4px"><ha-icon
