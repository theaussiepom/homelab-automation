name: Public configuration validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -B -m unittest discover -s .github/scripts -p 'test_config_validation.py'
      - run: python .github/scripts/config_validation.py
      - run: npm ci --prefix node-red/config --ignore-scripts --no-audit --no-fund
      - run: node --test tools/node-red-cast/test-cast-protobuf.js tools/node-red-cast/test-cast-tts.js tools/node-red-influxdb/test-lodash.js tools/node-red-private-inputs/test-private-credentials.js tools/node-red-private-inputs/test-jsonata-upgrade.js tools/node-red-private-inputs/test-state-machine-renderer.js
