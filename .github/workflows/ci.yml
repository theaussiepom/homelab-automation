name: Public configuration validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -B -m unittest discover -s .github/scripts -p 'test_config_validation.py'
      - run: python .github/scripts/config_validation.py
      - run: npm ci --prefix node-red/config --ignore-scripts --no-audit --no-fund
      - run: node --test tools/node-red-cast/test-cast-protobuf.js tools/node-red-private-inputs/test-private-credentials.js tools/node-red-private-inputs/test-jsonata-upgrade.js
